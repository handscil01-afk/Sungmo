<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="운동회 점수판">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>가을운동회 점수판</title>
<style>
:root{
  --bg:#f4f5f8; --card:#fff; --ink:#1b1f2a; --muted:#667085; --line:#e3e6ec;
  --red:#d6334a; --red-soft:#fde8eb; --blue:#2563d9; --blue-soft:#e6eefc;
  --accent:#1f2a44; --ok:#178a52; --ok-soft:#e3f5ea; --warn:#b45309; --warn-soft:#fff3dc;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141b; --card:#1a1f29; --ink:#eef1f6; --muted:#9aa3b2; --line:#2a313e;
    --red:#ff5d72; --red-soft:#3a1c22; --blue:#6b9bff; --blue-soft:#1b2640;
    --accent:#cfd8ea; --ok:#3ccf86; --ok-soft:#163327; --warn:#f2a93b; --warn-soft:#352a14;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical}
header{position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;padding:10px 16px calc(10px);
  display:flex;align-items:center;gap:10px;padding-top:max(10px,env(safe-area-inset-top))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header{background:#202838;color:#fff}}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:13px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.16);white-space:nowrap}
.pill.off{background:#f2a93b;color:#1b1f2a}
.pill.wait{background:#ffd76a;color:#1b1f2a}
.who{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:4px 10px;font-size:13px}
main{padding:12px 16px 110px;max-width:860px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;padding:10px 4px 12px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;line-height:1}
nav button.on{color:var(--ink);font-weight:700}
nav button.on b{color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:14px 0 8px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;white-space:nowrap;font-weight:600}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 12px;font-size:15px;min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--card);font-weight:700}
.seg button.on.r{background:var(--red);color:#fff}
.seg button.on.b{background:var(--blue);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;min-height:46px;font-weight:600}
.btn.primary{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:none}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45}
.big{font-size:20px;min-height:64px;flex:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--muted);vertical-align:middle;margin-right:6px}
.dot.red{background:var(--red)} .dot.blue{background:var(--blue)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tap{cursor:pointer}
.tag{font-size:13px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok);font-weight:700}
.tag.warn{background:var(--warn-soft);color:var(--warn);font-weight:700}
.tag.red{background:var(--red-soft);color:var(--red);font-weight:700}
.tag.blue{background:var(--blue-soft);color:var(--blue);font-weight:700}
.lane{border:2px solid var(--line);border-radius:var(--radius);padding:12px;margin:10px 0;background:var(--card)}
.lane.c0{border-color:#2f9e5a}.lane.c1{border-color:var(--red)}
.lane .head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lane .head .name{font-size:19px;font-weight:800;flex:1}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.slot{border:1.5px dashed var(--line);border-radius:10px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);padding:2px}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--card)}
.slot .p{font-size:20px;font-weight:800;line-height:1.1}
.slot .l{font-size:11px;color:var(--muted);text-align:center;line-height:1.15}
.slot .n{font-size:11px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:62px;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.opt b{font-size:20px}
.opt span{font-size:13px;color:var(--muted)}
.opt:active{transform:scale(.97)}
.total{font-size:22px;font-weight:800}
.rank{width:30px;text-align:center;font-weight:800}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.side{border-radius:var(--radius);padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;justify-content:center}
.side.red{background:var(--red-soft)} .side.blue{background:var(--blue-soft)}
.side .nm{font-size:21px;font-weight:800;word-break:keep-all}
.side select{font-size:15px;padding:6px 8px}
.vsmark{align-self:center;font-weight:800;color:var(--muted)}
.score2{display:flex;justify-content:center;align-items:baseline;gap:14px;font-weight:800}
.score2 .r{color:var(--red);font-size:34px}.score2 .b{color:var(--blue);font-size:34px}
.watch{font-variant-numeric:tabular-nums;font-size:56px;font-weight:800;text-align:center;letter-spacing:1px;margin:6px 0}
.timein{width:110px;text-align:center;font-size:18px}
.board .team{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.board .tbox{border-radius:var(--radius);padding:16px;text-align:center}
.board .tbox.red{background:var(--red);color:#fff}.board .tbox.blue{background:var(--blue);color:#fff}
.board .tbox .v{font-size:64px;font-weight:900;line-height:1}
.board .tbox .t{font-size:18px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.5);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#sheet .box{background:var(--card);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
#sheet h2{margin:0 0 12px;font-size:18px}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;background:#1b1f2a;color:#fff;border-radius:12px;padding:12px 16px;display:none;gap:14px;align-items:center;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.show{display:flex}
#toast button{border:0;background:none;color:#ffd76a;font-weight:700}
.empty{color:var(--muted);text-align:center;padding:18px 6px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.okline{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.gate{max-width:420px;margin:12vh auto 0;padding:0 16px}
.gate h1{font-size:24px}
@media (min-width:700px){ .opts{grid-template-columns:repeat(4,1fr)} }
@media (min-width:900px) and (orientation:landscape){ main{max-width:1100px} .board{display:grid;grid-template-columns:1fr 1fr;gap:0 16px} .board>h2{grid-column:1/-1} .board>.card:first-child{grid-column:1/-1} }
.hidden{display:none!important}
.hbtn{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;width:36px;height:32px;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.hbtn svg{width:20px;height:20px}
.banner{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:var(--radius);padding:12px 14px;margin:12px 0}
.banner b{display:block;margin-bottom:2px}
.banner .row{margin-top:8px}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;background:var(--bg);font-weight:700}
#dlg{position:fixed;inset:0;z-index:70;background:rgba(10,12,18,.55);display:none;align-items:center;justify-content:center;padding:16px}
#dlg.open{display:flex}
#dlg .box{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:420px}
#dlg .msg{font-size:17px;margin:0 0 14px;white-space:pre-line}
#dlg .row{justify-content:flex-end}
.switch{position:relative;width:52px;height:30px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.switch span:before{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(22px)}
</style>
</head>
<body>
<div id="app"><div class="gate"><h1>불러오는 중…</h1></div></div>
<div id="sheet"><div class="box" id="sheetBox"></div></div>
<div id="dlg"><div class="box" id="dlgBox"></div></div>
<div id="toast"><span id="toastMsg"></span><button id="toastAct"></button></div>

<script type="module">
/* ===================== 설정 ===================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDihHD0cldHyY0MWViA_R0yb-nkIoJ_-4I",
  authDomain: "handscil-sports.firebaseapp.com",
  projectId: "handscil-sports",
  storageBucket: "handscil-sports.firebasestorage.app",
  messagingSenderId: "431367162993",
  appId: "1:431367162993:web:fa488b8e5d0acc98ffdfd0"
};
const ROOT = 'undonghoe5';

/* ===================== 종목 정의 ===================== */
const DEFAULT_SETTINGS = { tuhoShort: 0, foul: 1 };
const INDIV = {
  archery: { name:'양궁', who:'함수민', lanes:2, count:5, unit:'발',
    opts: s => [['t','과녁',5],['b','배너',3],['o','배너 밖',0]] },
  freeball:{ name:'후리볼', who:'이소흔', lanes:1, count:5, unit:'번',
    opts: s => [['in','네트 안',5],['net','네트 닿음',3],['line','라인 안',2],['foul','파울',s.foul],['miss','헛스윙·0점',0]] },
  tuho:    { name:'투호', who:'박진해', lanes:2, count:5, unit:'개',
    opts: s => [['z0','2m 미만',s.tuhoShort],['z1','2~3.5m',10],['z2','3.5~5m',20],['z3','5~6.5m',30],['z4','6.5~8m',20],['z5','8~9.5m',10],['out','선 밖',0]] },
};
const TEAM = {
  gymball: { name:'짐볼 차기', mode:'duel', hint:'더 멀리 찬 사람이 이김' },
  threeleg:{ name:'2인3각', mode:'duel', hint:'반환점을 돌아 먼저 들어온 조가 이김' },
  beanbag: { name:'콩주머니', mode:'duel', hint:'1인 5개 번갈아, 가운데에 가장 가까운 쪽이 이김' },
  run:     { name:'줄 잡고 달리기', mode:'time', hint:'기록(초)이 빠른 사람이 이김' },
  tug:     { name:'줄다리기', mode:'round', hint:'판마다 이긴 팀에 승점 1점' },
};
const TEAMS = { red:'빨강', blue:'파랑' };
const LANE_COLORS = { tuho:['초록 투호','빨강 투호'], archery:['왼쪽 사대','오른쪽 사대'], freeball:['타석'] };

/* ===================== 유틸 ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const hm = t => { if(!t) return ''; const d=new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const uid = () => Math.random().toString(36).slice(2,8) + now().toString(36).slice(-4);
const ls = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const fmtSec = v => (v==null||v===''||isNaN(v)) ? '-' : Number(v).toFixed(2);

/* ===================== 저장소 ===================== */
async function firebaseStore(){
  const A = await import('./vendor/firebase-app.js');
  const F = await import('./vendor/firebase-firestore.js');
  const app = A.initializeApp(FIREBASE_CONFIG);
  let db;
  try { db = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }); }
  catch(e){ db = F.getFirestore(app); }
  const cfgRef = F.doc(db, ROOT, 'config');
  const cols = { indiv: F.collection(db, ROOT, 'main', 'indiv'), matches: F.collection(db, ROOT, 'main', 'matches') };
  return {
    mode:'firebase',
    onConfig(cb, err){ return F.onSnapshot(cfgRef, {includeMetadataChanges:true},
      s => cb(s.exists()? s.data(): {}, s.metadata.hasPendingWrites?1:0, s.metadata.fromCache), err); },
    onCol(name, cb, err){ return F.onSnapshot(cols[name], {includeMetadataChanges:true}, s => {
      const list=[]; let p=0;
      s.forEach(d => { list.push({ id:d.id, ...d.data() }); if(d.metadata.hasPendingWrites) p++; });
      cb(list, p, s.metadata.fromCache);
    }, err); },
    setConfig(obj){ return F.setDoc(cfgRef, obj, {merge:true}); },
    put(name, id, obj){ return F.setDoc(F.doc(cols[name], id), obj, {merge:true}); },
  };
}
function deepMerge(a, b){
  const out = (a && typeof a==='object' && !Array.isArray(a)) ? {...a} : {};
  for(const k in b){
    const v=b[k];
    out[k] = (v && typeof v==='object' && !Array.isArray(v)) ? deepMerge(out[k], v) : v;
  }
  return out;
}
function demoStore(){
  const KEY='udh5demo';
  let data = ls.get(KEY, { config:{}, indiv:{}, matches:{} });
  const subs = { config:[], indiv:[], matches:[] };
  const emit = name => setTimeout(() => {
    if(name==='config') subs.config.forEach(cb => cb(data.config, 0, false));
    else subs[name].forEach(cb => cb(Object.entries(data[name]).map(([id,v])=>({id,...v})), 0, false));
  }, 0);
  const save = () => ls.set(KEY, data);
  return {
    mode:'demo',
    onConfig(cb){ subs.config.push(cb); emit('config'); },
    onCol(name, cb){ subs[name].push(cb); emit(name); },
    setConfig(obj){ data.config = deepMerge(data.config, obj); save(); emit('config'); return Promise.resolve(); },
    put(name, id, obj){ data[name][id] = deepMerge(data[name][id]||{}, obj); save(); emit(name); return Promise.resolve(); },
    reset(){ data={config:{},indiv:{},matches:{}}; save(); emit('config'); emit('indiv'); emit('matches'); }
  };
}

/* ===================== 상태 ===================== */
const D = { config:{}, indiv:[], matches:[], pending:{config:0,indiv:0,matches:0}, cache:false, loaded:{config:false,indiv:false,matches:false}, error:'' };
const UI = {
  me: ls.get('udh5_me', ''),
  tab: ls.get('udh5_tab', 'indiv'),
  ie: ls.get('udh5_ie', 'tuho'),
  te: ls.get('udh5_te', 'gymball'),
  round: { archery:'main', freeball:'main', tuho:'main' },
  lanes: ls.get('udh5_lanes', { archery:[], freeball:[], tuho:[] }),
  q:'', filter:'all', view:'enter',
  pick:{}, rosterText:'', runTimes:{},
  watch:{ running:false, start:0, acc:0 },
};
let store;
const online = () => navigator.onLine;

const settings = () => ({ ...DEFAULT_SETTINGS, ...(D.config.settings||{}) });
function people(){
  const p = D.config.people || {};
  return Object.entries(p).filter(([,v]) => v && !v.deleted)
    .map(([id,v]) => ({ id, ...v }))
    .sort((a,b) => (a.createdAt||0)-(b.createdAt||0) || a.name.localeCompare(b.name,'ko'));
}
const person = id => { const v=(D.config.people||{})[id]; return v ? { id, ...v } : null; };
const pname = id => person(id)?.name || '(삭제된 사람)';
const teamOf = id => person(id)?.team || '';

function optMap(ev){ const m={}; INDIV[ev].opts(settings()).forEach(([k,l,v]) => m[k]={l,v}); return m; }
function totalOf(ev, throws){ const m=optMap(ev); return (throws||[]).reduce((s,k)=> s + (m[k]?.v ?? 0), 0); }
const recId = (ev, round, pid) => `${ev}_${round}_${pid}`;
function rec(ev, round, pid){ return D.indiv.find(r => r.id===recId(ev,round,pid) && !r.deleted && (r.throws||[]).length); }

function standings(ev){
  const main = people().map(p => ({ p, r: rec(ev,'main',p.id) })).filter(x => x.r)
    .map(x => ({ ...x, total: totalOf(ev, x.r.throws), fin: rec(ev,'final',x.p.id) }))
    .map(x => ({ ...x, ftotal: x.fin ? totalOf(ev, x.fin.throws) : null }));
  main.sort((a,b) => b.total-a.total || ((b.ftotal??-1)-(a.ftotal??-1)) || a.p.name.localeCompare(b.p.name,'ko'));
  // 본경기 기준 순위(동점 공동), 결승 기록이 있으면 그 안에서 다시 나눔
  let rank=0, prevKey=null;
  main.forEach((x,i) => { const key = x.total+'|'+(x.ftotal??''); if(key!==prevKey){ rank=i+1; prevKey=key; } x.rank=rank; });
  const ties = [];
  const byTotal = {};
  main.forEach(x => (byTotal[x.total] ||= []).push(x));
  Object.values(byTotal).forEach(g => {
    const best = Math.min(...g.map(x=>x.rank));
    if(g.length>1 && main.indexOf(g[0]) < 3){
      const finals = g.map(x=>x.ftotal);
      const resolved = finals.every(f=>f!=null) && new Set(finals).size===finals.length;
      ties.push({ total:g[0].total, names:g.map(x=>x.p.name), ids:g.map(x=>x.p.id), resolved });
    }
  });
  return { list: main, ties };
}

function matchesOf(ev){ return D.matches.filter(m => m.event===ev && !m.deleted).sort((a,b)=>(a.at||0)-(b.at||0)); }
function tally(ev){ const t={red:0,blue:0,draw:0}; matchesOf(ev).forEach(m => { if(t[m.winner]!=null) t[m.winner]++; }); return t; }
function orderFor(ev, team){
  const members = people().filter(p => p.team===team).map(p=>p.id);
  const saved = (((D.config.orders||{})[ev]||{})[team]) || [];
  const list = saved.filter(id => members.includes(id));
  members.forEach(id => { if(!list.includes(id)) list.push(id); });
  return list;
}
function plays(ev, team){
  const c={}; matchesOf(ev).forEach(m => { const id = team==='red'? m.redId : m.blueId; if(id) c[id]=(c[id]||0)+1; }); return c;
}
function nextUp(ev, team){
  const ord = orderFor(ev, team); if(!ord.length) return null;
  const c = plays(ev, team); let best=null, bc=Infinity;
  ord.forEach(id => { const n=c[id]||0; if(n<bc){ bc=n; best=id; } });
  return best;
}

function saveLanes(){ ls.set('udh5_lanes', UI.lanes); }
function addLane(ev, pid){
  const E = INDIV[ev]; const lanes = UI.lanes[ev] ||= [];
  if(lanes.some(L=>L.pid===pid)) return;
  if(lanes.length >= E.lanes){ toast(E.lanes===1? '지금 입력 중인 사람을 먼저 저장하거나 빼 주세요.' : `${E.lanes}명까지 동시에 입력할 수 있습니다. 한 명을 먼저 저장해 주세요.`); return; }
  const round = UI.round[ev]; const r = rec(ev, round, pid);
  lanes.push({ pid, round, throws: r? [...r.throws] : [], dist: r?.dist || '2.5', existing: !!r });
  saveLanes();
}
async function saveLane(ev, i){
  const E = INDIV[ev]; const L = UI.lanes[ev][i]; if(!L) return;
  if(!L.throws.length){ toast('점수가 하나도 입력되지 않았습니다.'); return; }
  if(L.throws.length < E.count && !(await ask(`${E.count}${E.unit} 중 ${L.throws.length}${E.unit}만 입력했습니다.\n이대로 저장할까요?`, '저장'))) return;
  const id = recId(ev, L.round, L.pid);
  const prev = D.indiv.find(r=>r.id===id);
  const p = person(L.pid);
  const data = { event:ev, round:L.round, personId:L.pid, personName:p?.name||'', team:p?.team||'', throws:L.throws, deleted:false };
  if(ev==='archery') data.dist = L.dist;
  if(prev && !prev.deleted && (prev.throws||[]).length){
    data.editedBy = UI.me; data.editedAt = now();
    data.history = [...(prev.history||[]), { throws: prev.throws, by: prev.editedBy||prev.by, at: prev.editedAt||prev.at }].slice(-10);
  } else { data.by = UI.me; data.at = now(); data.editedBy = null; data.editedAt = null; }
  put('indiv', id, data);
  UI.lanes[ev].splice(i,1); saveLanes();
  toast(`${p?.name||''} ${totalOf(ev,data.throws)}점 저장했습니다.`);
}
function saveMatch(ev, winner, redId, blueId, extra={}){
  const id = `${ev}_${now()}_${uid()}`;
  put('matches', id, { event:ev, winner, redId:redId||null, blueId:blueId||null,
    redName: redId?pname(redId):null, blueName: blueId?pname(blueId):null, by:UI.me, at:now(), deleted:false, ...extra });
  delete UI.pick[ev];
  const label = winner==='draw'?'무승부':`${TEAMS[winner]} 승`;
  toast(`${label} 저장했습니다.`, '되돌리기', () => put('matches', id, { deleted:true, editedBy:UI.me, editedAt:now() }));
}

function csv(kind){
  const rows = [];
  const q = v => { const s=String(v??''); return /[",\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
  const t = v => v? new Date(v).toLocaleString('ko-KR') : '';
  if(kind==='indiv'){
    rows.push(['종목','구분','이름','팀','1회','2회','3회','4회','5회','합계','거리','입력자','입력 시각','수정자','수정 시각']);
    Object.entries(INDIV).forEach(([ev,E]) => { const m=optMap(ev);
      D.indiv.filter(r=>r.event===ev && !r.deleted && (r.throws||[]).length).forEach(r => {
        const pts = Array.from({length:5},(_,k)=> r.throws[k]!=null ? (m[r.throws[k]]?.v ?? 0) : '');
        rows.push([E.name, r.round==='final'?'결승':'본경기', pname(r.personId), TEAMS[teamOf(r.personId)]||'', ...pts, totalOf(ev,r.throws), r.dist?r.dist+'m':'', r.by||'', t(r.at), r.editedBy||'', t(r.editedAt)]);
      }); });
  } else {
    rows.push(['종목','순번','빨강 선수','파랑 선수','결과','빨강 기록(초)','파랑 기록(초)','입력자','입력 시각','수정자','수정 시각']);
    Object.entries(TEAM).forEach(([ev,E]) => matchesOf(ev).forEach((m,i) => rows.push([E.name, i+1, m.redId?pname(m.redId):'', m.blueId?pname(m.blueId):'',
      m.winner==='draw'?'무승부':TEAMS[m.winner]+' 승', m.redTime??'', m.blueTime??'', m.by||'', t(m.at), m.editedBy||'', t(m.editedAt)])));
  }
  const blob = new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `가을운동회_${kind==='indiv'?'개인전':'단체전'}_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function parseRoster(text){
  const out=[];
  text.split(/\r?\n|,|\t/).forEach(line => {
    let s = line.trim().replace(/^\d+[.)]\s*/, ''); if(!s) return;
    let team = '';
    if(/(빨강|레드|red|홍팀)/i.test(s)) team='red'; else if(/(파랑|블루|blue|청팀)/i.test(s)) team='blue';
    s = s.replace(/(빨강팀|파랑팀|빨강|파랑|레드|블루|홍팀|청팀|red|blue)/ig,'').replace(/[()\[\]\-:/]/g,' ').replace(/\s+/g,' ').trim();
    if(s) out.push({ name:s, team });
  });
  return out;
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if(!el || el.disabled || el.closest('#dlg')) return;
  const a = el.dataset.a, v = el.dataset.v, i = +el.dataset.i;
  const ev = UI.ie, tev = UI.te;
  switch(a){
    case 'setMe': { const n = $('#meInput').value.trim(); if(!n){ toast('이름을 적어 주세요.'); return; } UI.me=n; ls.set('udh5_me',n); break; }
    case 'rename': { const n = await askText('입력하는 사람 이름', UI.me); if(n && n.trim()){ UI.me=n.trim(); ls.set('udh5_me',UI.me); } break; }
    case 'tab': UI.tab=v; ls.set('udh5_tab',v); window.scrollTo(0,0); break;
    case 'ie': UI.ie=v; UI.q=''; ls.set('udh5_ie',v); break;
    case 'te': UI.te=v; ls.set('udh5_te',v); break;
    case 'view': UI.view=v; break;
    case 'round': if((UI.lanes[ev]||[]).length){ toast('입력 중인 사람을 먼저 저장하거나 빼 주세요.'); return; } UI.round[ev]=v; break;
    case 'filter': UI.filter=v; break;
    case 'pick': addLane(ev, v); UI.q=''; if(document.activeElement) document.activeElement.blur(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'throw': { const L=UI.lanes[ev][i]; if(L && L.throws.length<INDIV[ev].count){ L.throws.push(el.dataset.k); saveLanes(); } break; }
    case 'unslot': { const L=UI.lanes[ev][i]; L.throws.splice(+el.dataset.k,1); saveLanes(); break; }
    case 'undoThrow': { const L=UI.lanes[ev][i]; L.throws.pop(); saveLanes(); break; }
    case 'dropLane': { const L=UI.lanes[ev][i]; if(L.throws.length && !(await ask('입력한 점수를 저장하지 않고 뺄까요?','빼기'))) return; UI.lanes[ev].splice(i,1); saveLanes(); break; }
    case 'dist': UI.lanes[ev][i].dist=v; saveLanes(); break;
    case 'saveLane': await saveLane(ev, i); break;
    case 'editRec': openSheet(() => recSheet(ev, v)); return;
    case 'reopen': { if((UI.lanes[ev]||[]).length>=INDIV[ev].lanes){ toast('입력 칸이 차 있습니다. 먼저 저장하거나 빼 주세요.'); return; }
      UI.round[ev]=v; addLane(ev, el.dataset.p); UI.view='enter'; closeSheet(); window.scrollTo(0,0); break; }
    case 'delRec': { if(!(await ask('이 기록을 지울까요?','지우기'))) return; const id=recId(ev,v,el.dataset.p); const prev=D.indiv.find(r=>r.id===id);
      put('indiv', id, { deleted:true, editedBy:UI.me, editedAt:now(), history:[...(prev?.history||[]), {throws:prev?.throws||[], by:prev?.editedBy||prev?.by, at:prev?.editedAt||prev?.at}].slice(-10) });
      toast('기록을 지웠습니다.', '되돌리기', () => put('indiv', id, { deleted:false })); closeSheet(); break; }
    case 'closeSheet': closeSheet(); return;
    case 'win': {
      const E = TEAM[tev];
      if(E.mode!=='round' && (!el.dataset.r || !el.dataset.b)){ toast('양 팀 모두 팀원이 있어야 합니다. 명단에서 팀을 정해 주세요.'); return; }
      saveMatch(tev, v, el.dataset.r, el.dataset.b); break; }
    case 'orders': orderTeam='red'; openSheet(orderSheet); return;
    case 'oteam': orderTeam=v; drawSheet(); return;
    case 'omove': { const ord=orderFor(tev,orderTeam); const k=+v, d=+el.dataset.d; [ord[k],ord[k+d]]=[ord[k+d],ord[k]];
      setConfig({ orders:{ [tev]:{ [orderTeam]: ord } } }); return; }
    case 'ocopy': { if(!(await ask('빨강팀과 파랑팀의 지금 순서를 다른 단체전 종목에도 똑같이 적용할까요?','적용'))) return;
      const o={}; Object.keys(TEAM).filter(k=>TEAM[k].mode!=='round').forEach(k=> o[k]={ red:orderFor(tev,'red'), blue:orderFor(tev,'blue') });
      setConfig({ orders:o }); toast('모든 종목에 같은 순서를 적용했습니다.'); return; }
    case 'editMatch': openSheet(() => matchSheet(v)); return;
    case 'emWin': put('matches', v, { winner: el.dataset.w, editedBy:UI.me, editedAt:now() }); toast('결과를 고쳤습니다.'); closeSheet(); break;
    case 'emTimes': { const r=parseFloat($('#emR').value), b=parseFloat($('#emB').value);
      if(isNaN(r)||isNaN(b)){ toast('두 기록을 숫자로 적어 주세요.'); return; }
      put('matches', v, { redTime:r, blueTime:b, winner: r<b?'red': b<r?'blue':'draw', editedBy:UI.me, editedAt:now() }); toast('기록을 고쳤습니다.'); closeSheet(); break; }
    case 'emDel': if(!(await ask('이 대결 기록을 지울까요?','지우기'))) return; put('matches', v, { deleted:true, editedBy:UI.me, editedAt:now() });
      toast('기록을 지웠습니다.', '되돌리기', () => put('matches', v, { deleted:false })); closeSheet(); break;
    case 'watchToggle': { const w=UI.watch; if(w.running){ w.acc += performance.now()-w.start; w.running=false; cancelAnimationFrame(rafId); paintWatch(); }
      else { w.start=performance.now(); w.running=true; tick(); } if(navigator.vibrate) navigator.vibrate(40); return; }
    case 'watchReset': { const w=UI.watch; w.running=false; w.acc=0; cancelAnimationFrame(rafId); paintWatch(); return; }
    case 'watchTo': { const w=UI.watch; if(w.running){ w.acc += performance.now()-w.start; w.running=false; cancelAnimationFrame(rafId); }
      const val = Math.round(watchVal()*100)/100; if(!val){ toast('초시계 기록이 없습니다.'); return; }
      (UI.runTimes[tev] ||= {})[v] = val; w.acc=0; break; }
    case 'saveRun': { const rt = UI.runTimes[tev]||{}; const r=parseFloat(rt.red), b=parseFloat(rt.blue);
      if(!el.dataset.r || !el.dataset.b){ toast('양 팀 모두 팀원이 있어야 합니다.'); return; }
      if(isNaN(r)||isNaN(b)){ toast('빨강과 파랑 기록을 모두 넣어 주세요.'); return; }
      saveMatch(tev, r<b?'red': b<r?'blue':'draw', el.dataset.r, el.dataset.b, { redTime:r, blueTime:b }); UI.runTimes[tev]={}; break; }
    case 'addRoster': {
      const list = parseRoster(UI.rosterText); if(!list.length){ toast('붙여넣은 이름이 없습니다.'); return; }
      const cur = people(); const add={}; let n=0, u=0; const t0=now();
      list.forEach((x,k) => { const ex = cur.find(p=>p.name===x.name);
        if(ex){ if(x.team && ex.team!==x.team){ add[ex.id]={team:x.team}; u++; } }
        else { add['p'+uid()] = { name:x.name, team:x.team, createdAt:t0+k, deleted:false }; n++; } });
      setConfig({ people:add }); UI.rosterText=''; toast(`${n}명을 넣었습니다.${u?` (${u}명은 팀만 바꿈)`:''}`); break; }
    case 'setTeam': setConfig({ people:{ [v]:{ team: el.dataset.t } } }); return;
    case 'renameP': { const p=person(v); const n=await askText('이름 고치기', p?.name||''); if(n && n.trim()) setConfig({ people:{ [v]:{ name:n.trim() } } }); return; }
    case 'delP': { const p=person(v); if(!(await ask(`${p?.name}을(를) 명단에서 지울까요?\n이미 입력한 기록은 그대로 남습니다.`,'지우기'))) return; setConfig({ people:{ [v]:{ deleted:true } } }); return; }
    case 'setS': setConfig({ settings:{ [el.dataset.k]: parseFloat(v) } }); return;
    case 'csv': csv(v); return;
    case 'demoReset': if(await ask('연습 기록을 모두 지울까요?','지우기')) store.reset(); return;
    case 'install': installSheet(); return;
    case 'fs': FS.toggle(); return;
    case 'later': UIX.installDismissed=true; saveUIX(); toast('「명단·설정」 탭에서 언제든 설치할 수 있습니다.'); break;
    case 'doInstall': doInstall(); return;
  }
  render();
});
document.addEventListener('input', e => {
  const el = e.target; const k = el.dataset.in; if(!k) return;
  if(k==='q'){ UI.q = el.value; const box=$('#pickRows'); if(box) box.innerHTML = pickRows(UI.ie, UI.round[UI.ie]); }
  else if(k==='roster'){ UI.rosterText = el.value; }
  else if(k==='rt'){ (UI.runTimes[UI.te] ||= {})[el.dataset.t] = el.value; }
});
document.addEventListener('change', e => {
  const el = e.target; if(el.dataset.ch==='autofs'){ UIX.autoFS = el.checked; saveUIX(); return; }
  if(el.dataset.ch==='pick'){ (UI.pick[UI.te] ||= {})[el.dataset.t] = el.value; render(); }
});
document.addEventListener('keydown', e => { if(e.key==='Enter' && e.target.id==='meInput'){ document.querySelector('[data-a="setMe"]').click(); } });
window.addEventListener('online', render); window.addEventListener('offline', render);

/* ===================== 시작 ===================== */
let renderQueued=false, renderDeferred=false;
const typing = () => { const ae=document.activeElement; return !!ae && (ae.tagName==='TEXTAREA' || ae.tagName==='INPUT'); };
function queueRender(){ if(renderQueued) return; renderQueued=true; requestAnimationFrame(()=>{ renderQueued=false;
  if(typing()){ renderDeferred=true; return; } render(); }); }
document.addEventListener('focusout', () => setTimeout(() => { if(renderDeferred && !typing()){ renderDeferred=false; render(); } }, 50));
function onErr(e){ console.error(e); D.error = e.code==='permission-denied' ? '파이어베이스 규칙 때문에 데이터를 읽을 수 없습니다. Firestore 규칙을 확인해 주세요.' : '연결 오류: '+(e.message||e); queueRender(); }
(async () => {
  const forceDemo = new URLSearchParams(location.search).has('demo');
  if(!forceDemo){
    try { store = await firebaseStore(); }
    catch(e){ console.error(e); D.error = '파이어베이스에 연결하지 못해 연습 모드로 열었습니다. 인터넷 연결을 확인하고 새로고침해 주세요.'; }
  }
  if(!store) store = demoStore();
  store.onConfig((d,p,c) => { D.config=d||{}; D.pending.config=p; D.cache=c; D.loaded.config=true; queueRender(); }, onErr);
  store.onCol('indiv', (l,p) => { D.indiv=l; D.pending.indiv=p; queueRender(); }, onErr);
  store.onCol('matches', (l,p) => { D.matches=l; D.pending.matches=p; queueRender(); }, onErr);
  render();
})();
window.addEventListener('beforeunload', e => {
  const p = D.pending.config + D.pending.indiv + D.pending.matches;
  if(p && !online()){ e.preventDefault(); e.returnValue=''; }
});
</script>
