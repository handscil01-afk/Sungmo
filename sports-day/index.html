<!doctype html>

<meta charset="utf-8">
<script>/* 카카오톡·라인 같은 앱 안 브라우저로 열면 바로 기기의 기본 브라우저로 다시 엶 (홈 화면 설치·저장된 정보가 한 브라우저에 모이게) */
(function(){var u=navigator.userAgent,h=location.href,ios=/iPhone|iPad|iPod/i.test(u);
if(/KAKAOTALK/i.test(u)){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(h);setTimeout(function(){location.href=ios?'kakaoweb://closeBrowser':'kakaotalk://inappbrowser/close';},1500);}
else if(/ Line\//i.test(u)&&!/openExternalBrowser=1/.test(h)){location.href=h+(h.indexOf('?')<0?'?':'&')+'openExternalBrowser=1';}
else if(/Android/i.test(u)&&/NAVER\(inapp|Instagram|FBAN|FBAV|everytimeApp|BAND\//i.test(u)){location.href='intent://'+h.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end';}
})();</script>
