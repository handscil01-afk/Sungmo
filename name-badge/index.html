<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="명찰 만들기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>명찰 만들기</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --field:#f1f3f6; --text:#16181d; --sub:#6b7280; --line:#dfe3e8;
  --accent:#2f6fed; --accent-soft:#e8efff; --good:#12a150; --warn:#e5484d; --warn-soft:#fdecec; --amber:#b7791f; --amber-soft:#fff6e0;
  --stage:#d9dde3; --lw:clamp(560px,46vw,660px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101215; --card:#1a1d22; --field:#23272e; --text:#f1f2f4; --sub:#9aa1ad; --line:#2f343c;
    --accent:#5b8cff; --accent-soft:#1e2a44; --good:#3ccf7e; --warn:#ff6b6f; --warn-soft:#3a1f22; --amber:#e6b450; --amber-soft:#3a3118; --stage:#2a2e35;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;height:100dvh;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.sub{color:var(--sub);font-size:12px}
.top{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line)}
.top img{width:26px;height:26px;border-radius:6px}
.top h1{font-size:16px;margin:0;flex:1;font-weight:700}
.ib{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:8px;display:grid;place-items:center}
.ib svg{width:18px;height:18px}
.ib:hover{background:var(--field)}
.seg.viewsw{display:none}
#banner{flex:none;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
#banner img{width:28px;height:28px;border-radius:7px}
#banner b{font-size:13px}
#banner span.t{flex:1;min-width:180px;font-size:12px;color:var(--sub)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 11px;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--field)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--warn)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
#app{flex:1;min-height:0;display:grid;grid-template-columns:var(--lw) 1fr}
#left{display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:var(--card)}
.tabs{flex:none;display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-weight:600;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
#tabBody{flex:1;min-height:0;overflow:auto;padding:10px 12px}
#tabBody.flexcol{display:flex;flex-direction:column;overflow:hidden}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.cols>div{min-width:0}
h4{margin:10px 0 4px;font-size:13px}
h4:first-child{margin-top:0}
.f{display:flex;align-items:center;gap:6px;margin:5px 0}
.f>label{flex:none;min-width:70px;color:var(--sub);font-size:13px}
.f input[type=text],.f select,.f input[type=number]{flex:1;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:4px 7px}
.f input[type=number]{max-width:84px;text-align:right}
.f input[type=color]{width:36px;height:26px;padding:0;border:1px solid var(--line);border-radius:5px;background:none}
textarea.ta{width:100%;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:5px 7px;resize:vertical;font-size:13px;line-height:1.35}
.ck{display:flex;align-items:center;gap:6px;margin:5px 0;font-size:13px;cursor:pointer}
.ck input{width:16px;height:16px;flex:none}
.rn{margin:6px 0}
.rn .h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.rn .h label{color:var(--sub)}
.rn .h input[type=number]{width:72px;text-align:right;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:2px 6px}
.rn input[type=range]{width:100%;margin:2px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.note{font-size:12px;color:var(--sub);margin:4px 0}
.warnbox{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:4px 8px;margin:4px 0}
.infobox{font-size:12px;color:var(--text);background:var(--accent-soft);border-radius:6px;padding:5px 8px;margin:6px 0}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12px}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:baseline}
/* 명단 표 */
.twrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:8px}
table.rt{width:100%;border-collapse:collapse;font-size:13px;min-width:530px;table-layout:fixed}
.rt th{position:sticky;top:0;background:var(--field);z-index:1;text-align:left;font-weight:600;padding:5px 4px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}
.rt td{padding:1px 2px;border-bottom:1px solid var(--line);vertical-align:middle}
.rt tr.sel td{background:var(--accent-soft)}
.rt input[type=text],.rt select{width:100%;min-width:0;border:1px solid transparent;background:transparent;padding:3px 3px;border-radius:4px;font-size:13px}
.rt input[type=text]:hover,.rt select:hover,.rt input[type=text]:focus,.rt select:focus{border-color:var(--line);background:var(--card)}
.rt select{padding:3px 0}
.rt .pcw{display:flex;flex-wrap:wrap;gap:1px 3px;align-items:center}.rt .pcw select{flex:1;min-width:64px;width:auto}
.rt td.c{text-align:center}.rt td{overflow:hidden}
.mini{border:1px solid var(--line);background:var(--card);border-radius:5px;font-size:11px;padding:1px 5px}
.ck.mini{border:0;background:none;display:inline-flex;margin:0 4px 0 0;font-size:11px}
.ck.mini input{width:13px;height:13px}
.x{border:0;background:transparent;color:var(--sub);font-size:17px;line-height:1;padding:2px 6px}
.x:hover{color:var(--warn)}
/* 미리보기 */
#right{display:flex;flex-direction:column;min-height:0;min-width:0}
#pvBar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--card)}
.seg{display:flex}
.seg button{border:1px solid var(--line);background:var(--card);padding:4px 10px;font-size:13px}
.seg button:first-child{border-radius:7px 0 0 7px}
.seg button:last-child{border-radius:0 7px 7px 0}
.seg button+button{border-left:0}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#pvNav{display:flex;align-items:center;gap:5px;margin-left:auto}
#pvNav select{max-width:190px;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:3px 6px}
#pvNav .lbl{font-size:13px;min-width:92px;text-align:center}
#pvWarn{flex:none}
#pvWarn .warnbox{margin:0;border-radius:0;padding:5px 12px}
#pvStage{flex:1;min-height:0;background:var(--stage);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#pvStage .arr{display:flex;gap:14px;align-items:flex-start;justify-content:center}
#pvStage .arr.col{flex-direction:column;align-items:center}
.pvitem .cap{font-size:12px;color:var(--sub);text-align:center;margin-bottom:3px;height:16px}
.pvbox{position:relative;box-shadow:0 2px 10px rgba(0,0,0,.25);background:#fff}
.pvbox .sc{transform-origin:0 0;position:absolute;left:0;top:0}
#pvFoot{flex:none;padding:5px 12px;font-size:12px;color:var(--sub);background:var(--card);border-top:1px solid var(--line);min-height:28px}
/* 모달·토스트 */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:8px}
.mdl{background:var(--card);border-radius:12px;width:min(520px,96vw);max-height:94vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mdl.wide{width:min(940px,98vw)}
.mh{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:15px}
.mh .back{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600}
.mb{padding:12px;overflow:auto;flex:1;min-height:0}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.mb p{margin:6px 0}
.mb ol{margin:6px 0;padding-left:20px}
.kbd{display:inline-block;border:1px solid var(--line);background:var(--field);border-radius:5px;padding:0 6px;font-size:12px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#22262d;color:#fff;padding:8px 14px;border-radius:10px;z-index:80;display:none;align-items:center;gap:12px;max-width:92vw;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#toast.on{display:flex}
#toast button{border:0;background:transparent;color:#8fb4ff;font-weight:700}
.dropz{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--sub)}
.dropz.over{border-color:var(--accent);background:var(--accent-soft)}
.wz table{border-collapse:collapse;width:100%;font-size:13px}
.wz th,.wz td{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:middle}
.wz th{background:var(--field);font-size:12px;color:var(--sub)}
.wz .tw{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px;margin:6px 0}
.wz select,.wz input[type=number]{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:3px 6px}
.wz .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0}
.wz .ex{color:var(--sub);font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== 명찰 · 인쇄 (실제 mm 크기) ===== */
.bdg{position:relative;box-sizing:border-box;overflow:hidden;background:#fff;color:#111;display:flex;flex-direction:column;--sn:1;--so:1;--se:1;--g:1;line-height:1.2}
.bdg .bnd{flex:none;margin:-.3mm -.3mm 0;color:#fff;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden}
.bdg .fbody{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1mm;padding:1.5mm 3mm;position:relative;text-align:center}
.bdg .nm{width:100%;white-space:nowrap;font-weight:800;line-height:1.2}
.bdg .orgrow{width:100%;display:block;text-align:center;white-space:nowrap}
.bdg .lgi{display:inline-block;vertical-align:middle;margin-right:1.5mm;object-fit:contain}
.bdg .org{white-space:nowrap;font-weight:600;color:#333}
.bdg .evn{width:100%;white-space:nowrap;color:#444;font-weight:600}
.bdg .lg{display:block;object-fit:contain;flex:none}
.bdg .lgc{position:absolute}
.bdg .bkbox{flex:1;min-height:0;padding:3mm 3.5mm;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.bdg .bkin{width:100%;--g:1;font-size:calc(var(--bpt) * var(--g))}
.bkin .tt{font-weight:800;font-size:1.25em;text-align:center;margin-bottom:.35em}
.bkin .nt{white-space:pre-wrap;text-align:center;margin:.3em 0;font-weight:600}
.bkin .sec{margin:.35em 0}
.bkin .sh{font-weight:700;font-size:.82em;color:#555;border-bottom:.2mm solid #999;margin-bottom:.15em}
.bkin .ct{display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap}
.bkin .ct .lb{font-size:.8em;color:#555;min-width:3.6em}
.bkin .ct .n2{font-weight:700}
.bkin .ct .ph{font-weight:800;font-size:1.15em;margin-left:auto;white-space:nowrap}
.bkin .evg{display:grid;grid-template-columns:max-content 1fr;gap:0 .5em}
.bkin .evg .tm{font-weight:700;white-space:nowrap}
.bkin .evg .wide{grid-column:1/-1}
.bkin .fr{white-space:pre-wrap;margin:.3em 0}
.pg{position:relative;background:#fff;overflow:hidden;flex:none}
.pg .cell{position:absolute}
.pg .cutd{position:absolute;outline:.2mm dashed #555;outline-offset:0;pointer-events:none}
.pg .tick{position:absolute;background:#444}
.fpan{position:absolute;box-sizing:border-box;overflow:hidden;color:#111;background:#fff}
.fpan .fin{padding:3mm 3mm 0 3mm}
.fpan .fno{position:absolute;right:1.6mm;bottom:1mm;font-size:6.5pt;color:#888}
.fpan table.ft{width:100%;border-collapse:collapse;table-layout:auto}
.ft th{text-align:left;font-weight:700;color:#444;border-bottom:.3mm solid #444;padding:.3mm .8mm;white-space:nowrap}
.ft td{padding:.4mm .8mm;border-bottom:.1mm solid #bbb;vertical-align:top}
.ft td.ph{white-space:nowrap;font-weight:700}
.ft td.kd{font-weight:700;white-space:nowrap}
#measure{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
#printRoot{display:none}
@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  #printRoot,#printRoot *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printRoot .pg{break-after:page;page-break-after:always}
  #printRoot .pg:last-child{break-after:auto;page-break-after:auto}
}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  .seg.viewsw{display:flex}
  #app[data-view="set"] #right{display:none}
  #app[data-view="pv"] #left{display:none}
  .cols{grid-template-columns:1fr}
  .top h1{font-size:15px}
}
</style>
</head>
<body>
<header class="top">
  <img src="icon-192.png" alt="">
  <h1>명찰 만들기</h1>
  <div class="seg viewsw" id="viewSw"><button data-view="set" class="on">설정</button><button data-view="pv">미리보기</button></div>
  <button class="ib" id="hSet" aria-label="설정" title="설정">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
  <button class="ib hidden" id="hFS" aria-label="전체화면" title="전체화면"></button>
</header>
<div id="banner" class="hidden">
  <img src="icon-192.png" alt="">
  <b>홈 화면에 설치해 두세요</b>
  <span class="t">아이콘으로 바로 열리고, 인터넷이 잘 안 되는 곳에서도 열려요.</span>
  <button class="btn pri sm" id="bInst">설치하기</button>
  <button class="btn sm" id="bFs">전체화면</button>
  <button class="btn sm" id="bLater">다음에</button>
</div>
<div id="app" data-view="set">
  <section id="left">
    <nav class="tabs" id="tabs">
      <button data-tab="roster" class="on">명단</button>
      <button data-tab="front">앞면</button>
      <button data-tab="back">뒷면</button>
      <button data-tab="fold">연락망</button>
      <button data-tab="print">크기·인쇄</button>
    </nav>
    <div id="tabBody"></div>
  </section>
  <section id="right">
    <div id="pvBar">
      <div class="seg" id="pvSeg"><button data-pv="person" class="on">이 사람 앞·뒷면</button><button data-pv="page">명찰 인쇄 쪽</button><button data-pv="fold">연락망 쪽</button></div>
      <div id="pvNav"></div>
    </div>
    <div id="pvWarn"></div>
    <div id="pvStage"></div>
    <div id="pvFoot"></div>
  </section>
</div>
<div id="sheetRoot"></div>
<div id="toast"><span id="toastMsg"></span><button id="toastBtn" class="hidden"></button></div>
<div id="measure"></div>
<div id="printRoot"></div>
<style id="pageRule"></style>
<input type="file" id="fileXl" accept=".xlsx,.xlsm,.csv,.tsv,.txt" multiple class="hidden">
<input type="file" id="fileLogo" accept="image/png,image/jpeg,image/svg+xml,image/*" class="hidden">
<input type="file" id="fileRoster" accept=".json,application/json" class="hidden">
<input type="file" id="fileSet" accept=".json,application/json" class="hidden">
<script>
(function(){
'use strict';
// 다른 곳에 게시되어 head 태그가 body로 들어간 경우 head로 옮김
Array.prototype.forEach.call(document.querySelectorAll('body meta, body link[rel]'), function(n){ document.head.appendChild(n); });

/* ================= 공용 도구 ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').replace(/\s+/g, '').toLowerCase();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const MM = 96 / 25.4;
let uidN = 0;
const nid = () => 'p' + (++uidN).toString(36) + Math.random().toString(36).slice(2, 6);
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }
};
const KEY_SET = 'name-badge-settings-v1', KEY_XL = 'name-badge-xlmap-v1', KEY_KV = 'name-badge-kindvals-v1';
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
let inFrame = false; try{ inFrame = window.self !== window.top; }catch(e){ inFrame = true; }

function getPath(o, path){ return path.split('.').reduce((a, k) => a == null ? undefined : a[k], o); }
function setPath(o, path, v){ const ks = path.split('.'); let a = o; for(let i = 0; i < ks.length - 1; i++){ if(a[ks[i]] == null) a[ks[i]] = {}; a = a[ks[i]]; } a[ks[ks.length - 1]] = v; }
function deepMerge(base, add){
  if(add == null || typeof add !== 'object' || Array.isArray(add)) return base;
  for(const k of Object.keys(add)){
    const v = add[k];
    if(Array.isArray(v)) base[k] = JSON.parse(JSON.stringify(v));
    else if(v && typeof v === 'object') base[k] = deepMerge(base[k] && typeof base[k] === 'object' && !Array.isArray(base[k]) ? base[k] : {}, v);
    else if(v !== undefined) base[k] = v;
  }
  return base;
}

function fmtPhone(v){
  let s = String(v == null ? '' : v).trim(); if(!s) return '';
  if(/^\d+(\.\d+)?e\+?\d+$/i.test(s)) s = String(Math.round(Number(s)));
  if(!/^[0-9\-\s().+]+$/.test(s)) return s;
  let x = s.replace(/\D/g, '');
  if(x.length === 10 && x[0] === '1') x = '0' + x;

async function inflateRaw(u8){
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));

  }catch(e){ if(!total) throw e; }
  const out = new Uint8Array(total); let p = 0; for(const c of chunks){ out.set(c, p); p += c.length; }
  return out;

function openZip(buf){

  if(e < 0) throw new Error('엑셀(xlsx) 파일이 아닙니다.');
  const cnt = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
  const td = new TextDecoder('utf-8'); const files = {};
  for(let k = 0; k < cnt; k++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    files[td.decode(u8.subarray(p + 46, p + 46 + nlen))] = {method, csize, off};
    p += 46 + nlen + xlen + clen;
  }
  return {
    has: n => !!files[n],
    async text(n){
      const f = files[n]; if(!f) return null;
      const n2 = dv.getUint16(f.off + 26, true), x2 = dv.getUint16(f.off + 28, true);
      const data = u8.subarray(f.off + 30 + n2 + x2, f.off + 30 + n2 + x2 + f.csize);
      const raw = f.method === 0 ? data : await inflateRaw(data);
      return td.decode(raw);
    }
  };
}

  const ssx = await z.text('xl/sharedStrings.xml');
  if(ssx){ for(const si of xmlDoc(ssx).getElementsByTagName('si')) ss.push(nodeText(si)); }
  const sheets = [];
  for(const s of wb.getElementsByTagName('sheet')){
    const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    let target = relMap[rid] || ''; target = target.replace(/^\//, '');
    if(!target.startsWith('xl/')) target = 'xl/' + target;
    sheets.push({name: s.getAttribute('name'), path: target});
  }
  for(const sh of sheets){
    const x = await z.text(sh.path); const rows = [];
    if(x){
      const doc = xmlDoc(x);
      let rowNo = 0;
      for(const row of doc.getElementsByTagName('row')){
        const ra = parseInt(row.getAttribute('r'), 10); const r = isNaN(ra) ? rowNo : ra - 1; rowNo = r + 1;
        const cells = {}; let cn = 0;
        for(const c of row.getElementsByTagName('c')){
          const t = c.getAttribute('t'); let v = '';
          if(t === 'inlineStr'){ const is = c.getElementsByTagName('is')[0]; v = is ? nodeText(is) : ''; }
          else { const ve = c.getElementsByTagName('v')[0]; v = ve ? ve.textContent : ''; if(t === 's'){ const ix = parseInt(v, 10); v = ss[ix] != null ? ss[ix] : ''; } else if(t === 'b') v = v === '1' ? 'TRUE' : 'FALSE'; else if(t === 'e') v = ''; }
          const ref = c.getAttribute('r'); const ci = ref ? colIndex(ref) : cn; cn = ci + 1;
          cells[ci] = String(v).trim();
        }

  }

}
function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const first = text.split(/\r?\n/, 1)[0] || '';
  const cnt = ch => first.split(ch).length - 1;
  const delim = cnt('\t') > cnt(',') && cnt('\t') >= cnt(';') ? '\t' : (cnt(';') > cnt(',') ? ';' : ',');
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === delim){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && text[i + 1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.map(r => { const o = {}; r.forEach((v, i) => { v = String(v).trim(); if(v !== '') o[i] = v; }); return o; });
}
async function parseDataFile(f){
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if(ext === 'xls') throw new Error('옛날 형식(.xls)은 읽을 수 없어요. 엑셀에서 "다른 이름으로 저장" → xlsx 또는 CSV로 저장한 뒤 넣어 주세요.');
  if(ext === 'xlsx' || ext === 'xlsm'){
    const sheets = await readWorkbook(await f.arrayBuffer());
    if(!sheets.length) throw new Error('시트가 없는 파일이에요.');
    return {name: f.name, sheets};
  }
  const buf = await f.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if(text.indexOf('�') >= 0){ try{ text = new TextDecoder('euc-kr').decode(buf); }catch(e){} }
  return {name: f.name, sheets: [{name:'CSV', rows: parseCSV(text)}]};
}

const NAME_EXACT = ['이름', '성명', '성함', 'name'];
function findHeaderRow(rows){
  for(let r = 0; r < Math.min(rows.length, 15); r++){
    const cells = rows[r]; if(!cells) continue;
    if(Object.values(cells).map(norm).some(v => NAME_EXACT.includes(v))) return r;
  }
  for(let r = 0; r < Math.min(rows.length, 15); r++){
    const cells = rows[r]; if(!cells) continue;
    if(Object.values(cells).map(norm).some(v => v.includes('이름') || v.includes('성명'))) return r;
  }
  for(let r = 0; r < Math.min(rows.length, 15); r++){ if(rows[r] && Object.keys(rows[r]).length >= 2) return r; }
  return 0;
}
const USES = [['name','이름'], ['kind','구분'], ['org','소속'], ['phone','연락처'], ['pair','짝(활지사·보호자) 이름'], ['pairPhone','짝 연락처'], ['staff','담당직원'], ['skip','쓰지 않음']];
function guessUse(h){
  const t = norm(h); if(!t) return 'skip';

  const hasTel = /(연락|전화|번호|폰|핸드|휴대|tel|phone)/.test(t);
  if(/담당/.test(t) || /^직원$/.test(t)) return 'staff';
  if(hasPair && hasTel) return 'pairPhone';
  if(hasPair) return 'pair';
  if(/^(이름|성명|성함|name)$/.test(t) || /이름|성명|성함/.test(t)) return 'name';
  if(/^(구분|분류|역할|유형|종류|참여구분|참가구분)$/.test(t) || /구분|분류|역할/.test(t)) return 'kind';
  if(/소속|기관|단체|센터|부서|직위|직책|직급|근무/.test(t)) return 'org';
  if(hasTel) return 'phone';

function guessKindFor(value){
  const t = norm(value);
  const byName = S.kinds.find(k => norm(k.name) === t);
  if(byName) return byName.id;
  const role = /활지|활동지원|활동보조|지원사|활보|동행|보호자/.test(t) ? 'H' : /이용|당사자|장애|회원|참가자|참여자/.test(t) ? 'U' : /직원|스태프|staff|사회복지|실무자/.test(t) ? 'S' : /통역|수어|속기|점역|통번역/.test(t) ? 'T' : '';
  const k = role && roleKind(role);

function wzCommit(){

function partnerKindOf(k){

  const h = roleKind('H'); return h ? h.id : '';
}
function linkPair(p, name, phone){
  const pk = kindById(p.kind) || S.kinds[0]; const pkid = partnerKindOf(pk);
  let q = people.find(x => x !== p && x.name === name && x.kind === pkid) || people.find(x => x !== p && x.name === name);
  if(!q){ q = newPerson({kind: pkid || p.kind, name, phone: phone || ''}); if(kindRole(q.kind) === 'S') q.eventStaff = true; people.push(q); }
  else if(phone && !q.phone) q.phone = phone;

function linkIds(a, b){
  const ka = kindById(a.kind), kb = kindById(b.kind);

  if(ka && ka.pairWith === b.kind){ owner = a; target = b; }
  else if(kb && kb.pairWith === a.kind){ owner = b; target = a; }

const ROLE_RE = /^(활지사|활동지원사|활동지원인|활동보조인|활동보조|활보|지원사|동행인|동행|보호자|활지|도우미)$/;

const PHONE_RE = /0\d{1,2}[-.\s]?\d{3,4}[-.\s]?\d{4}/g;
function tokenizeLine(line, known){

  const re = /\(([^)]*)\)|（([^）]*)）|\[([^\]]*)\]|([^(（\[]+)/g; let m;
  while((m = re.exec(line))){
    const inner = m[1] != null ? m[1] : (m[2] != null ? m[2] : m[3]);
    if(inner != null){
      const words = inner.split(/[\s,，、;；\/·.+&|~:]+/).filter(Boolean);
      const hasRole = words.some(w => ROLE_ANY.test(w));
      let named = false;
      for(const w of words){
        const ph = phoneOf(w); if(ph){ toks.push({phone: ph}); continue; }
        let base = w.replace(/[^가-힣A-Za-z]/g, '');
        if(ROLE_ANY.exec(base)) base = base.replace(ROLE_ANY, '');
        base = base.replace(/(님|씨|선생님|샘|쌤)$/, '');
        if(base.length >= 2 && base.length <= 5 && !SKIP_RE.test(base) && (hasRole || known(base))){ toks.push({name: base, hint: hasRole ? 'H' : null}); named = true; }
      }
      if(hasRole && !named) toks.push({kw: 'role', paren: true});
      continue;
    }
    for(const w of m[4].split(/[\s,，、;；\/·.+&|~:]+/)){
      if(!w) continue;
      const ph = phoneOf(w); if(ph){ toks.push({phone: ph}); continue; }
      let base = w.replace(/[^가-힣A-Za-z0-9]/g, '');
      if(!base) continue;
      if(/^외\d*(명|분)?$/.test(base) || /^\d+(명|분)$/.test(base)){ if(base.startsWith('외')) toks.push({kw: 'plus'}); continue; }
      base = base.replace(/\d+/g, '');
      if(ROLE_RE.test(base)){ toks.push({kw: 'role'}); continue; }
      let hint = null;
      const pre = /^(활지사|활동지원사|활보|지원사|동행인|동행|보호자)(.+)$/.exec(base);
      const post = /^(.+?)(활지사|활동지원사|활보|지원사|동행인|동행|보호자)$/.exec(base);
      if(pre && pre[2].length >= 2){ base = pre[2]; hint = 'H'; }
      else if(post && post[1].length >= 2){ base = post[1]; toks.push({name: base.replace(/(님|씨)$/, ''), hint: null}); toks.push({kw: 'role'}); continue; }
      base = base.replace(/(님|씨|선생님|샘|쌤)$/, '');
      if(SKIP_RE.test(base)) continue;
      if(/^[가-힣]{2,5}$/.test(base) || /^[A-Za-z]{2,20}$/.test(base)) toks.push({name: base, hint});
      else ignored.push(w);
    }
  }
  return {toks, ignored};
}
function parsePaste(text, mode){
  const kU = roleKind('U') || S.kinds[0], kH = roleKind('H') || S.kinds[0];
  const exist = new Map(); people.forEach(p => { if(!exist.has(p.name)) exist.set(p.name, p); });
  const seen = new Set(), items = [], dups = [], ignored = [];
  const known = n => exist.has(n);
  for(const line of text.split(/\r?\n/)){
    if(!line.trim()) continue;
    if(mode !== 'auto'){
      // 구분을 고른 경우: "이름 010-0000-0000 소속" 한 줄씩
      let l = line.replace(/^\s*[-*•·▶▷◆◇○●□■☞→]+\s*/, '').replace(/^\s*\d{1,3}(?:\s*[.)\]:]\s*|\s+(?=[가-힣A-Za-z]))/, '');
      const phs = l.match(PHONE_RE) || []; l = l.replace(PHONE_RE, ' ');
      const words = l.split(/[\s,，、;；\/|\t]+/).filter(Boolean);
      const ni = words.findIndex(w => /^[가-힣A-Za-z]{2,20}$/.test(w.replace(/(님|씨)$/, '')));
      if(ni < 0){ ignored.push(line.trim()); continue; }
      const name = words[ni].replace(/(님|씨)$/, '');
      if(seen.has(name) || exist.has(name)){ dups.push(name); continue; }
      seen.add(name);
      items.push({name, kind: mode, phone: phs[0] ? fmtPhone(phs[0]) : '', org: words.filter((w, i) => i !== ni).join(' '), pairs: [], pairExisting: []});
      continue;
    }
    const {toks, ignored: ig} = tokenizeLine(line, known); ignored.push(...ig);
    let cur = null, firstName = true, last = null;
    for(let i = 0; i < toks.length; i++){
      const t = toks[i];
      if(t.phone){ if(last && !last.phone) last.phone = fmtPhone(t.phone); continue; }
      if(t.kw) continue;
      const ex = exist.get(t.name);
      const nextRole = toks[i + 1] && toks[i + 1].kw === 'role';
      let hint = t.hint;
      if(nextRole && !(ex && kindRole(ex.kind) === 'U')) hint = 'H';
      let role;
      if(hint === 'H') role = 'H';
      else if(ex && kindRole(ex.kind) === 'U') role = 'U';
      else if(ex && kindRole(ex.kind) === 'H') role = 'H';
      else role = firstName ? 'U' : 'H';
      firstName = false;
      if(seen.has(t.name)){ dups.push(t.name); last = null; continue; }
      seen.add(t.name);
      if(ex){
        if(role === 'H' && cur && cur.u){ cur.u.pairExisting.push(ex); }
        else if(role === 'H' && !cur){ cur = {u: null, hs: []}; }
        else dups.push(t.name);
        last = null; continue;
      }
      const it = {name: t.name, kind: role === 'U' ? kU.id : kH.id, phone: '', org: '', pairs: [], pairExisting: []};
      items.push(it);
      if(role === 'U'){ if(cur && !cur.u) cur.u = it; else cur = {u: it, hs: []}; }
      else { if(!cur) cur = {u: null, hs: []}; cur.hs.push(it); }
      last = it;
    }
    if(cur && cur.u) cur.u.pairs.push(...cur.hs);
  }
  return {items, dups: [...new Set(dups)], ignored: [...new Set(ignored)]};
}
function commitPaste(res){
  const made = new Map();
  res.items.forEach(it => {
    const p = newPerson({kind: it.kind, name: it.name, phone: it.phone, org: it.org});
    if(kindRole(p.kind) === 'S'){ p.eventStaff = true; if(!people.some(q => q.rep && kindRole(q.kind) === 'S')) p.rep = true; }
    made.set(it, p); people.push(p);
  });
  res.items.forEach(it => {
    const p = made.get(it);
    it.pairs.forEach(h => { const q = made.get(h); if(q) p.pairIds.push(q.id); });
    it.pairExisting.forEach(q => { if(!p.pairIds.includes(q.id)) p.pairIds.push(q.id); });
  });
  return res.items.length;
}

async function loadRosterFile(f){

  ]});

function loadLogo(f){
  if(!f) return;
  const url = URL.createObjectURL(f); const img = new Image();
  img.onload = () => {
    let w = img.naturalWidth || 400, h = img.naturalHeight || 400; if(!w || !h){ w = 400; h = 400; }
    const sc = Math.min(1, 800 / Math.max(w, h)); const cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h * sc));
    const c = document.createElement('canvas'); c.width = cw; c.height = ch; const cx = c.getContext('2d');
    const jpeg = /jpe?g/i.test(f.type); if(jpeg){ cx.fillStyle = '#fff'; cx.fillRect(0, 0, cw, ch); }
    cx.drawImage(img, 0, 0, cw, ch);
    try{ S.front.logoData = c.toDataURL(jpeg ? 'image/jpeg' : 'image/png', 0.92); }catch(e){ toast('그림을 읽지 못했어요'); URL.revokeObjectURL(url); return; }
    S.front.logoAR = cw / ch; URL.revokeObjectURL(url);
    saveSettings(); paintLogoThumb(); schedulePreview(); toast('로고를 넣었어요');
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('이 그림은 읽을 수 없어요 (png, jpg, svg)'); };
  img.src = url;
}

/* 글씨가 칸을 넘으면 자동으로 줄임 (화면에 붙어 있을 때만 정확) */
function fitFace(el){
  const fb = el.querySelector('.fbody');
  if(fb){
    ['--sn', '--so', '--se', '--g'].forEach(v => el.style.setProperty(v, 1));
    const fitW = (node, v) => {
      if(!node) return;
      if(node.scrollWidth > node.clientWidth + 0.5){
        let s = Math.max(0.2, node.clientWidth / node.scrollWidth * 0.99); el.style.setProperty(v, s);
        for(let i = 0; i < 10 && node.scrollWidth > node.clientWidth + 0.5 && s > 0.2; i++){ s *= 0.97; el.style.setProperty(v, s); }
      }
    };
    fitW(el.querySelector('.nm'), '--sn'); fitW(el.querySelector('.orgrow'), '--so'); fitW(el.querySelector('.evn'), '--se');
    if(fb.scrollHeight > fb.clientHeight + 0.5){
      let g = 1; for(let i = 0; i < 30 && fb.scrollHeight > fb.clientHeight + 0.5 && g > 0.3; i++){ g -= 0.03; el.style.setProperty('--g', g); }
    }
  }
  const box = el.querySelector('.bkbox');
  if(box){
    const inn = box.querySelector('.bkin'); inn.style.setProperty('--g', 1);
    const cs = getComputedStyle(box); const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const over = () => inn.offsetHeight > availH + 0.5 || inn.scrollWidth > inn.clientWidth + 0.5;
    let g = 1;
    if(availH > 0 && over()){
      g = Math.max(0.25, availH / Math.max(1, inn.offsetHeight) * 0.98); inn.style.setProperty('--g', g);

}

function foldLines(){

  const list = base.filter(p => p.print !== false && cleanName(p.name) && inc.some(k => k.id === p.kind));
  const ids = new Set(list.map(p => p.id)); const targets = new Set();
  if(S.fold.showPair) list.forEach(p => realPairs(p).forEach(q => { if(ids.has(q.id)) targets.add(q.id); }));

}

  const headH = ms.querySelector('thead').offsetHeight;
  const hs = [...ms.querySelectorAll('tbody tr')].map(tr => tr.offsetHeight);

}

/* ================= 오른쪽 미리보기 ================= */
let pvT = 0;
function schedulePreview(){ cancelAnimationFrame(pvT); pvT = requestAnimationFrame(renderPreview); }
function curPerson(){
  const real = people.find(p => p.id === selId); if(real) return real;
  const l = pvList(); return l[0] || null;
}
function pvBox(node, wpx, hpx, scale){
  const box = document.createElement('div'); box.className = 'pvbox'; box.style.width = Math.round(wpx * scale) + 'px'; box.style.height = Math.round(hpx * scale) + 'px';
  const sc = document.createElement('div'); sc.className = 'sc'; sc.style.transform = 'scale(' + scale + ')'; sc.appendChild(node); box.appendChild(sc);
  return box;
}
function renderPreview(){
  reindex();
  const st = $('pvStage'); if(!st) return;
  document.querySelectorAll('#pvSeg button').forEach(b => b.classList.toggle('on', b.dataset.pv === pvMode));
  const nav = $('pvNav'); const foot = $('pvFoot'); st.innerHTML = ''; foot.textContent = '';
  const W = st.clientWidth, H = st.clientHeight;
  if(pvMode === 'person'){
    const list = pvList(); const cp = curPerson();
    nav.innerHTML = '<button class="btn sm" data-nav="-1">◀</button><select id="pvPick">' + list.map(p => '<option value="' + p.id + '"' + (cp && cp.id === p.id ? ' selected' : '') + '>' + esc(p.name) + ' (' + esc((kindById(p.kind) || {}).name || '') + ')</option>').join('') + '</select><button class="btn sm" data-nav="1">▶</button>';
    if(!cp || W < 50 || H < 50) return;
    const tmp = document.createElement('div'); tmp.innerHTML = faceFront(cp) + faceBack(cp);
    const f = tmp.children[0], b = tmp.children[1];
    const bw = S.size.w * MM, bh = S.size.h * MM, pad = 28, gap = 18, cap = 22;
    const s1 = Math.min((W - pad - gap) / (2 * bw), (H - pad - cap) / bh), s2 = Math.min((W - pad) / bw, (H - pad - 2 * cap - gap) / (2 * bh));
    const side = s1 >= s2; const sc = clamp(Math.max(s1, s2), 0.1, 2);
    const arr = document.createElement('div'); arr.className = 'arr' + (side ? '' : ' col');
    [['앞면', f], ['뒷면', b]].forEach(([cap2, node]) => { const it = document.createElement('div'); it.className = 'pvitem'; it.innerHTML = '<div class="cap">' + cap2 + '</div>'; it.appendChild(pvBox(node, bw, bh, sc)); arr.appendChild(it); });
    st.appendChild(arr); fitAll(arr);
    foot.textContent = (people.length ? '' : '예시 명찰이에요. 명단을 넣으면 실제 이름으로 바뀌어요. · ') + '명찰 ' + S.size.w + '×' + S.size.h + 'mm · 화면에서는 실제 크기의 ' + Math.round(sc * 100) + '%로 보여요';
  } else {
    let pages = [], label = '', info = '';
    if(pvMode === 'page'){
      const g = geo(), seq = pageSeq(g); pageIdx = clamp(pageIdx, 0, Math.max(0, seq.length - 1));
      if(seq.length){ const it = seq[pageIdx]; pages = [buildBadgePage(it, g)]; label = (pageIdx + 1) + ' / ' + seq.length + '쪽 · ' + (it.side === 'f' ? '앞면' : '뒷면') + (S.page.duplex === 'both' ? ' (종이 ' + (it.k + 1) + '장째)' : ''); }
      info = 'A4 ' + (g.o === 'portrait' ? '세로' : '가로') + ' · 한 장에 ' + g.per + '개 (' + g.cols + '×' + g.rows + ')' + (people.length ? '' : ' · 예시 명찰');
      pages.dims = [g.pw, g.ph - 0.4];
    } else {
      const job = buildFold();
      if(job){ pageIdx = clamp(pageIdx, 0, job.sheets.length - 1); pages = [job.sheets[pageIdx]]; label = '연락망 ' + (pageIdx + 1) + ' / ' + job.sheets.length + '장'; info = '칸 ' + job.panels + '개 · 가로 ' + job.n + '×세로 ' + job.m + (people.length ? '' : ' · 예시 명단'); pages.dims = [job.pw, job.ph - 0.4]; pages.total = job.sheets.length; }
    }
    const tot = pvMode === 'page' ? pageSeq(geo()).length : (pages.total || 0);
    nav.innerHTML = '<button class="btn sm" data-nav="-1">◀</button><span class="lbl">' + esc(label || '-') + '</span><button class="btn sm" data-nav="1">▶</button>';
    nav.dataset.total = tot;
    if(!pages.length){ st.innerHTML = '<div class="sub" style="padding:20px">' + (pvMode === 'fold' ? '연락망에 넣을 사람이 없어요. 명단과 “연락망 탭”의 구분 체크를 확인하세요.' : '표시할 쪽이 없어요.') + '</div>'; return; }
    if(W < 50 || H < 50) return;
    const pwpx = pages.dims[0] * MM, phpx = pages.dims[1] * MM;
    const sc = clamp(Math.min((W - 24) / pwpx, (H - 24) / phpx), 0.1, 2);
    st.appendChild(pvBox(pages[0], pwpx, phpx, sc)); fitAll(pages[0]);
    foot.textContent = info + ' · 화면에서는 실제 크기의 ' + Math.round(sc * 100) + '%로 보여요';
  }
  updatePvWarn();
}
function updatePvWarn(){
  const w = $('pvWarn'); if(!w) return;
  const t = backWarnText();
  w.innerHTML = t ? '<div class="warnbox">' + esc(t) + '</div>' : '';
}

/* ================= 인쇄 ================= */
function printJob(kind){
  reindex();
  let pages = [], orient = 'portrait';
  if(kind === 'badge'){
    if(!printList().length){ toast('명단이 비어 있어요. 명단을 먼저 넣어 주세요.'); return null; }
    const g = geo(); if(!g.fits){ notice('명찰이 용지보다 커요. 크기나 여백을 줄여 주세요.'); return null; }
    orient = g.o; pages = pageSeq(g).map(it => buildBadgePage(it, g));
  } else {
    const job = buildFold(); if(!job){ toast('연락망에 넣을 사람이 없어요'); return null; }
    if(!people.length){ toast('명단이 비어 있어요. 명단을 먼저 넣어 주세요.'); return null; }
    orient = job.orient;
    for(let c = 0; c < job.copies; c++) job.sheets.forEach(sh => pages.push(c === 0 ? sh : sh.cloneNode(true)));
  }
  const ms = $('measure'), root = $('printRoot'); root.innerHTML = ''; ms.innerHTML = '';
  pages.forEach(p => ms.appendChild(p)); pages.forEach(fitAll);
  pages.forEach(p => root.appendChild(p)); ms.innerHTML = '';
  $('pageRule').textContent = '@page{size:A4 ' + orient + ';margin:0}';
  setTimeout(() => { try{ window.print(); }catch(e){ toast('이 화면에서는 인쇄 창을 열 수 없어요'); } }, 60);
  return {pages: pages.length, orient};
}

/* ================= 설정 입력 연결 ================= */
function onSettingChanged(path){
  saveSettings();
  if(path.indexOf('size.') === 0 || path.indexOf('page.') === 0){ updatePrintInfo(); if(tab === 'fold') updateFoldInfo(); }
  if(path.indexOf('size.') === 0 || path.indexOf('back.') === 0 || path.indexOf('front.border') === 0 || path.indexOf('front.font') === 0) scheduleBackCheck();
  if(path.indexOf('fold.') === 0) updateFoldInfo();
  schedulePreview();
}
function handleSetting(e){
  const el = e.target.closest ? e.target.closest('#tabBody [data-s]') : null; if(!el) return;
  const path = el.dataset.s; let v;
  if(el.type === 'checkbox') v = el.checked;
  else if(el.type === 'number' || el.type === 'range'){
    v = parseFloat(el.value); if(isNaN(v)) return;
    const mn = el.min !== '' ? +el.min : -Infinity, mx = el.max !== '' ? +el.max : Infinity;
    if(v < mn || v > mx){ if(e.type === 'input') return; v = clamp(v, mn, mx); el.value = v; }
  } else v = el.value;
  setPath(S, path, v);
  document.querySelectorAll('#tabBody [data-s="' + path + '"]').forEach(o => { if(o !== el){ if(o.type === 'checkbox') o.checked = v; else o.value = v; } });
  onSettingChanged(path);
}
$('tabBody').addEventListener('input', handleSetting);
$('tabBody').addEventListener('change', handleSetting);
$('tabBody').addEventListener('input', e => {
  const b = e.target.closest('[data-band]'); if(!b) return; S.kinds[+b.dataset.band].band = b.value; saveSettings(); schedulePreview();
});
$('tabBody').addEventListener('click', e => {
  if(tab === 'roster') return;
  const pill = e.target.closest('[data-bk]'); if(pill){ backKind = pill.dataset.bk; renderBackTab(); return; }
  const pre = e.target.closest('[data-preset]');
  if(pre){ const p = PRESETS.find(x => x[0] === pre.dataset.preset); S.size.w = p[2]; S.size.h = p[3]; syncInputs(); onSettingChanged('size.w'); return; }
  const b = e.target.closest('[data-a]'); if(!b) return; const a = b.dataset.a;
  if(a === 'logo') $('fileLogo').click();
  else if(a === 'nologo'){ S.front.logoData = ''; paintLogoThumb(); saveSettings(); schedulePreview(); }
  else if(a === 'bandsame'){ const i = +b.dataset.i; S.kinds[i].band = ''; const c = $('band' + i); if(c) c.value = S.kinds[i].color; saveSettings(); schedulePreview(); }
  else if(a === 'printfold') printJob('fold');
  else if(a === 'printbadge') printJob('badge');
  else if(a === 'setsave') saveSettingsFile();
  else if(a === 'setload') $('fileSet').click();
});
// 구분 색을 바꾸면 '같게'로 둔 띠 색도 따라가도록 표시만 갱신
$('tabBody').addEventListener('input', e => { const el = e.target; if(el.dataset && el.dataset.s && /^kinds\.\d+\.color$/.test(el.dataset.s)){ const i = +el.dataset.s.split('.')[1]; if(!S.kinds[i].band){ const c = $('band' + i); if(c) c.value = el.value; } } });

$('tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if(b){ setTab(b.dataset.tab); if(b.dataset.tab === 'back') scheduleBackCheck(); } });
$('pvSeg').addEventListener('click', e => { const b = e.target.closest('button[data-pv]'); if(b){ pvMode = b.dataset.pv; pageIdx = 0; schedulePreview(); } });
$('pvNav').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]'); if(!b) return; const d = +b.dataset.nav;
  if(pvMode === 'person'){
    const l = pvList(); if(!l.length) return; const cp = curPerson(); let i = Math.max(0, l.findIndex(p => cp && p.id === cp.id)); i = (i + d + l.length) % l.length;
    selId = l[i].id; document.querySelectorAll('#rosterWrap tr[data-id]').forEach(tr => tr.classList.toggle('sel', tr.dataset.id === selId));
  } else { const tot = +$('pvNav').dataset.total || 1; pageIdx = clamp(pageIdx + d, 0, tot - 1); }
  schedulePreview();
});
$('pvNav').addEventListener('change', e => { if(e.target.id === 'pvPick'){ selId = e.target.value; document.querySelectorAll('#rosterWrap tr[data-id]').forEach(tr => tr.classList.toggle('sel', tr.dataset.id === selId)); schedulePreview(); } });
$('viewSw').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if(!b) return; $('app').dataset.view = b.dataset.view; document.querySelectorAll('#viewSw button').forEach(x => x.classList.toggle('on', x === b)); schedulePreview(); });

/* 파일 입력 */
$('fileXl').addEventListener('change', e => { const fs = e.target.files; if(fs && fs.length) importFiles(fs); e.target.value = ''; });
$('fileLogo').addEventListener('change', e => { loadLogo(e.target.files[0]); e.target.value = ''; });
$('fileRoster').addEventListener('change', e => { if(e.target.files[0]) loadRosterFile(e.target.files[0]); e.target.value = ''; });
$('fileSet').addEventListener('change', e => { if(e.target.files[0]) loadSettingsFile(e.target.files[0]); e.target.value = ''; });
window.addEventListener('dragover', e => { if(e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => {
  if(!e.dataTransfer || !e.dataTransfer.files.length) return; e.preventDefault();
  const fs = [...e.dataTransfer.files]; const data = fs.filter(f => /\.(xlsx|xlsm|xls|csv|tsv|txt)$/i.test(f.name)); const js = fs.filter(f => /\.json$/i.test(f.name));
  if(data.length) importFiles(data); else if(js.length) loadRosterFile(js[0]);
});
window.addEventListener('beforeunload', e => { if(dirtyRoster && people.length){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', schedulePreview);
if(window.ResizeObserver) new ResizeObserver(() => schedulePreview()).observe($('pvStage'));

/* ================= 시작 ================= */
loadSettings(); ensureSettings(); buildSample(); reindex();
paintInstall();
setTab('roster');
window.NB = {
  get S(){ return S; }, get people(){ return people; }, geo, pageSeq, buildBadgePage, buildFold, printJob, mirrorH, fmtPhone, parsePaste,
  setSel(id){ selId = id; schedulePreview(); }, get backWarn(){ return backWarn; }, checkBacks, renderPreview,
  setPvMode(m){ pvMode = m; pageIdx = 0; schedulePreview(); }
};
})();
</script>
