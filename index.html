<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>성모의 앱 모음</title>
<meta name="theme-color" content="#e6f3ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* Layout: 앱 카드를 세로로 쌓고, 넓은 화면에서는 두 줄로 놓는 간단한 목록 */
:root{--sky:#e6f3ff;--paper:#fff;--ink:#3d3458;--ink-2:#6c648a;--accent:#ff7b54;--line:#e6def2;
  --f-cute:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--sky);color:var(--ink);font-family:var(--f-body);padding-block:32px 48px;padding-inline:16px;word-break:keep-all}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{margin:0;font-family:var(--f-cute);font-weight:400;font-size:clamp(32px,7vw,48px);text-align:center}
h1 span{color:var(--accent)}
p.lead{margin:0;text-align:center;color:var(--ink-2)}
.apps{display:grid;gap:14px}
@media (min-width:640px){.apps{grid-template-columns:1fr 1fr}}
a.app{display:flex;gap:14px;align-items:center;padding:16px;border-radius:22px;background:var(--paper);color:inherit;text-decoration:none;box-shadow:0 3px 0 rgba(61,52,88,.1),0 10px 22px rgba(61,52,88,.08);min-width:0}
a.app:hover{transform:translateY(-2px)}
a.app:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
a.app img{width:64px;height:64px;border-radius:16px;flex:none}
a.app b{display:block;font-family:var(--f-cute);font-weight:400;font-size:22px}
a.app small{display:block;color:var(--ink-2);font-size:14px;line-height:1.45}
</style>
</head>
<body>
<main>
  <h1>성모의 <span>앱 모음</span></h1>
  <p class="lead">아래 앱을 눌러 열고, 앱 안의 안내에 따라 홈 화면에 설치하면 아이콘으로 바로 열 수 있어요.</p>
  <div class="apps">
    <a class="app" href="bible-marble/"><img src="bible-marble/icon-192.png" alt=""><span><b>성경 부루마블</b><small>성경의 땅을 여행하며 말씀 퀴즈를 푸는 2~4인 보드게임 · 구약·신약 판, 퀴즈 관리, 여러 기기 함께하기</small></span></a>
    <a class="app" href="piano/"><img src="piano/icon-192.png" alt=""><span><b>난장이의 피아노 교실</b><small>코드(화음)를 차근차근 익히는 왕초보 피아노 연습실</small></span></a>
  </div>
</main>
</body>
</html>
