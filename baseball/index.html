<!doctype html>
<html lang="ko" data-fs="1" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="손잡다 야구">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="듣고 고르는 확률 야구. 보이스오버·톡백·점자 단말기·숫자판 키보드로 할 수 있습니다.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>손잡다 야구</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>손잡다 야구</h1>
    <div class="topbtns"><span id="voiceSt" class="sr-only"></span><button type="button" class="btn small mic" id="micBtn" hidden>음성 켜기</button><button type="button" class="btn small" id="menuBtn">메뉴</button></div>
  </header>
  <div id="top"></div>
  <main id="main">
    <section id="boardSec" aria-label="경기 상황" hidden></section>
    <section id="turn" aria-labelledby="q">
      <div id="say" tabindex="-1" hidden></div>
      <div id="note" tabindex="-1" hidden></div>
      <h2 id="q" tabindex="-1"></h2>
      <div id="opts" class="opts" role="group"></div>
      <div id="extra"></div>
      <form id="cmdForm" autocomplete="off">
        <label for="cmd">명령 칸 <small>(숫자나 낱말을 적고 입력)</small></label>
        <div class="cmdrow"><input id="cmd" type="text" inputmode="text" enterkeyhint="go" autocapitalize="off" spellcheck="false"><button type="submit" class="btn">입력</button></div>
      </form>
      <section id="chatSec" aria-labelledby="chatH" hidden>
        <h2 id="chatH">채팅</h2>
        <ol id="chatList"></ol>
      </section>
    </section>
    <section id="logSec" aria-labelledby="logH" hidden>
      <h2 id="logH">중계 기록</h2>
      <ol id="log"></ol>
    </section>
  </main>
</div>
<div id="dlg"><div class="box" id="dlgBox" role="dialog" aria-modal="true"></div></div>
<div id="live" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
<audio id="rvoice" autoplay playsinline></audio>
<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/league.js"></script>
<script src="js/speech.js"></script>
<script src="js/shell.js"></script>
<script src="js/ui.js"></script>
<script src="js/gfx.js"></script>
<script src="js/net.js"></script>
<script src="js/voice.js"></script>
<script src="js/game.js"></script>
<script src="js/manager.js"></script>
<script src="js/league-ui.js"></script>
<script src="js/career.js"></script>
<script src="js/online.js"></script>
<script src="js/app.js"></script>
</body>
</html>
