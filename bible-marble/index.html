<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>성경 부루마블</title>
<meta name="theme-color" content="#0c0a1d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
</head>
<body>
<style>
/* Layout: 정사각 보드(9×9 둘레 32칸)와 옆(가로)·아래(세로)의 정보 패널. 밤하늘 네온 아케이드 단일 테마. */
:root{
  --bg:#0c0a1d; --bg-2:#141030; --panel:#1a1540; --panel-2:#231d55; --line:#342c75;
  --ink:#f1edff; --ink-2:#b3abe2; --ink-3:#7d75b6;
  --gold:#ffd447; --cyan:#46e8ff; --good:#4ff2a0; --bad:#ff5a7e; --on-gold:#2a1d00;
  --g0:#ff9a3c; --g1:#ff5c5c; --g2:#9cf25a; --g3:#46e8ff; --g4:#b48bff; --g5:#ff6ad8; --g6:#4f8dff; --g7:#ffd447;
  --shade:rgba(5,3,16,.72);
  --f-display:'Black Han Sans','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-ui:'Do Hyeon','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-num:'Orbitron','Do Hyeon',ui-monospace,monospace;
  --bs:360px; --u:calc(var(--bs) / 100);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;word-break:keep-all;overflow-wrap:break-word;
  background-image:radial-gradient(120% 70% at 50% -10%,#2a1f6b 0%,transparent 60%),radial-gradient(60% 40% at 100% 100%,#251046 0%,transparent 70%);background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* ---------- header ---------- */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:4px;padding:6px 12px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#hdr h1{flex:1;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.02em;color:var(--gold);text-shadow:0 0 10px color-mix(in srgb,var(--gold) 55%,transparent)}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2)}
.ib:hover{color:var(--ink);background:var(--panel)}
.ib svg{width:22px;height:22px}

/* ---------- setup ---------- */
#setup{max-width:600px;margin:0 auto;padding-block:18px 40px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.logo{text-align:center;padding:10px 0 2px}
.logo .big{display:block;font-family:var(--f-display);font-size:clamp(40px,12vw,64px);line-height:1.05;color:#fff6cf;
  text-shadow:0 0 6px var(--gold),0 0 22px color-mix(in srgb,var(--gold) 70%,transparent),0 0 46px color-mix(in srgb,#ff7a2f 55%,transparent)}
.logo .sm{display:inline-block;margin-top:8px;font-family:var(--f-ui);font-size:15px;color:var(--cyan);letter-spacing:.32em;text-shadow:0 0 10px color-mix(in srgb,var(--cyan) 60%,transparent)}
.logo p{margin-top:10px;color:var(--ink-2);font-size:14.5px;text-wrap:balance}
@media (prefers-reduced-motion:no-preference){.logo .big{animation:flick 3.8s 1s infinite}}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.55}94%{opacity:1}96%{opacity:.7}97%{opacity:1}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.box h2{font-family:var(--f-ui);font-weight:400;font-size:19px;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.box h2 small{font-family:var(--f-body);font-size:12.5px;color:var(--ink-3)}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.tokbtn{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--bg-2);border:2px solid var(--pc);box-shadow:0 0 12px color-mix(in srgb,var(--pc) 45%,transparent)}
.prow input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg-2);padding:0 12px;font-size:16px}
.seg{display:flex;gap:4px;padding:4px;border-radius:13px;background:var(--bg-2);border:1px solid var(--line)}
.seg button{flex:1;min-height:38px;padding:0 8px;border-radius:9px;color:var(--ink-3);font-family:var(--f-ui);font-size:15.5px;white-space:nowrap}
.seg button.on{background:var(--panel-2);color:var(--gold);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 55%,transparent)}
.prow .seg{flex:none}
.xbtn{flex:none;width:36px;height:36px;border-radius:10px;color:var(--ink-3);font-size:20px}
.xbtn:hover{color:var(--bad)}
.addp{width:100%;margin-top:8px;min-height:44px;border-radius:12px;border:1.5px dashed var(--line);color:var(--ink-2);font-family:var(--f-ui);font-size:16px}
.opt{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.opt>span{font-size:13.5px;color:var(--ink-2);font-weight:700}
.opt .hint{font-size:12.5px;color:var(--ink-3);font-weight:400}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.swrow b{display:block;font-size:14.5px}
.swrow small{display:block;color:var(--ink-3);font-size:12.5px}
.sw{position:relative;flex:none;width:54px;height:32px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line);transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ink-3);transition:.15s}
.sw[aria-checked="true"]{background:color-mix(in srgb,var(--good) 30%,var(--bg-2));border-color:var(--good)}
.sw[aria-checked="true"]::after{left:25px;background:var(--good)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-family:var(--f-ui);font-size:18px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold);box-shadow:0 0 18px color-mix(in srgb,var(--gold) 45%,transparent)}
.btn.cyan{background:transparent;color:var(--cyan);border-color:var(--cyan);box-shadow:inset 0 0 12px color-mix(in srgb,var(--cyan) 22%,transparent)}
.btn.wide{width:100%}
.btn.big{min-height:58px;font-size:22px;border-radius:18px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn small{font-family:var(--f-body);font-size:12.5px;opacity:.8}

/* ---------- game layout ---------- */
#game{display:grid;gap:14px;padding-block:12px 28px;padding-inline:16px;max-width:1320px;margin:0 auto;justify-content:center}
#side{display:flex;flex-direction:column;gap:12px;min-width:0}
body.land #game{grid-template-columns:auto minmax(270px,400px);align-items:start}

/* ---------- board ---------- */
#board{position:relative;width:var(--bs);height:var(--bs);display:grid;grid-template-columns:1.3fr repeat(7,1fr) 1.3fr;grid-template-rows:1.3fr repeat(7,1fr) 1.3fr;gap:2px;padding:3px;border-radius:14px;background:var(--line);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--cyan) 35%,transparent),0 0 28px color-mix(in srgb,var(--cyan) 18%,transparent)}
.tile{position:relative;min-width:0;min-height:0;background:var(--bg-2);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;cursor:pointer;padding:2px;transition:background .2s}
.tile:hover{background:var(--panel)}
.tile .band{position:absolute;background:var(--gc);box-shadow:0 0 8px var(--gc)}
.tile.sb .band{left:0;right:0;top:0;height:16%}
.tile.st .band{left:0;right:0;bottom:0;height:16%}
.tile.sl .band{top:0;bottom:0;right:0;width:16%}
.tile.sr .band{top:0;bottom:0;left:0;width:16%}
.tile.sb{padding-top:calc(var(--u)*1.6)} .tile.st{padding-bottom:calc(var(--u)*1.6)}
.tile.sl{padding-right:calc(var(--u)*1.6)} .tile.sr{padding-left:calc(var(--u)*1.6)}
.tile .nm{font-family:var(--f-ui);font-weight:400;font-size:max(8px,calc(var(--u)*2.65));line-height:1.05;word-break:break-all;color:var(--ink)}
.tile .pr{font-family:var(--f-num);font-size:max(6.5px,calc(var(--u)*1.75));color:var(--ink-3);margin-top:1px}
.tile .ic{width:calc(var(--u)*4.2);height:calc(var(--u)*4.2);color:var(--ink-2)}
.tile .ic svg{width:100%;height:100%;display:block}
.tile.t-card .ic{color:var(--gold)} .tile.t-quiz .ic{color:var(--cyan)} .tile.t-spot .ic{color:#7fd1ff} .tile.t-tithe .ic{color:var(--good)}
.tile.corner .nm{font-size:max(9px,calc(var(--u)*3.2))}
.tile.corner .ic{width:calc(var(--u)*5.6);height:calc(var(--u)*5.6)}
.tile.corner .sub{font-size:max(6.5px,calc(var(--u)*1.6));color:var(--ink-3);line-height:1.15;margin-top:1px}
.tile.c-start .ic{color:var(--good)} .tile.c-jail .ic{color:#ffb36b} .tile.c-pot .ic{color:var(--gold)} .tile.c-fly .ic{color:#ff7a3d}
.tile.owned{background:color-mix(in srgb,var(--oc) 14%,var(--bg-2));box-shadow:inset 0 0 0 1.5px var(--oc)}
.tile.owned .pr{color:var(--oc)}
.tile .lv{position:absolute;top:2px;left:50%;transform:translateX(-50%);display:flex;gap:1px}
.tile.sb .lv{top:calc(var(--u)*1.9)}
.tile .lv i{width:calc(var(--u)*1.2);height:calc(var(--u)*1.2);min-width:4px;min-height:4px;background:var(--oc);border-radius:1px;box-shadow:0 0 4px var(--oc)}
.tile .tk .tok{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);min-width:12px;min-height:12px;font-size:max(8px,calc(var(--u)*2.1));opacity:.95}
.tile .tk{position:absolute;inset:auto 1px 1px 1px;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;pointer-events:none}
.tok{width:calc(var(--u)*3.9);height:calc(var(--u)*3.9);min-width:14px;min-height:14px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:max(9px,calc(var(--u)*2.5));line-height:1;background:var(--bg);border:1.5px solid var(--pc);box-shadow:0 0 6px var(--pc)}
.tok.hop{animation:hop .22s ease-out}
@keyframes hop{40%{transform:translateY(-35%) scale(1.15)}}
#board.picking .tile:not(.c-fly){animation:pickglow 1.1s infinite alternate}
#board.picking .tile:not(.c-fly):hover{background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--gold)}
@keyframes pickglow{to{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--gold) 70%,transparent)}}
.tile.flash{animation:tflash .6s}
@keyframes tflash{30%{background:color-mix(in srgb,var(--gold) 30%,var(--bg-2))}}
@media (prefers-reduced-motion:reduce){.tok.hop,.tile.flash,#board.picking .tile{animation:none}}

/* ---------- center ---------- */
#center{grid-area:2/2/9/9;position:relative;border-radius:8px;background:radial-gradient(80% 80% at 50% 40%,#211a55 0%,var(--bg) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.6);padding:calc(var(--u)*2.4);text-align:center;overflow:hidden}
#center .ttl{font-family:var(--f-display);font-size:calc(var(--u)*5.4);line-height:1;color:#fff6cf;text-shadow:0 0 4px var(--gold),0 0 16px color-mix(in srgb,var(--gold) 60%,transparent)}
#center .rnd{font-family:var(--f-ui);font-size:max(11px,calc(var(--u)*2.7));color:var(--ink-3)}
#center .rnd b{font-family:var(--f-num);font-weight:600;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px 3px 4px;border-radius:99px;background:var(--panel);border:1.5px solid var(--pc);box-shadow:0 0 12px color-mix(in srgb,var(--pc) 40%,transparent);font-family:var(--f-ui);font-size:max(13px,calc(var(--u)*3.4))}
.chip .tok{width:calc(var(--u)*5.4);height:calc(var(--u)*5.4);font-size:calc(var(--u)*3.3)}
.dice{display:flex;gap:calc(var(--u)*2.4)}
.die{width:calc(var(--u)*11);height:calc(var(--u)*11);min-width:34px;min-height:34px;border-radius:22%;background:#f7f3ff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:16%;box-shadow:0 0 14px color-mix(in srgb,var(--cyan) 45%,transparent),inset 0 -3px 0 rgba(40,20,90,.25)}
.die i{border-radius:50%;margin:12%;background:transparent}
.die i.on{background:#1b1440}
.die.dbl{box-shadow:0 0 18px var(--gold),inset 0 -3px 0 rgba(40,20,90,.25)}
.die.roll{animation:shake .12s infinite}
@keyframes shake{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
#cMsg{min-height:2.6em;font-size:max(12px,calc(var(--u)*3));line-height:1.3;color:var(--ink-2);max-width:95%;text-wrap:balance}
#cMsg b{color:var(--ink)}
#cBtn{min-height:max(42px,calc(var(--u)*10));font-size:max(16px,calc(var(--u)*4.2));padding:0 calc(var(--u)*6)}
#center .pot{font-family:var(--f-ui);font-size:max(11.5px,calc(var(--u)*2.7));color:var(--ink-3);display:flex;align-items:center;gap:6px}
#center .pot b{font-family:var(--f-num);color:var(--gold);font-weight:600}
#pickBar{position:absolute;inset:auto 0 0 0;padding:8px;background:color-mix(in srgb,var(--gold) 16%,var(--bg));border-top:1px solid var(--gold);font-family:var(--f-ui);font-size:max(13px,calc(var(--u)*3.2));color:var(--gold)}

/* ---------- players ---------- */
#plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pc{position:relative;display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:0;transition:border-color .2s,box-shadow .2s}
.pc.act{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc),0 0 18px color-mix(in srgb,var(--pc) 35%,transparent)}
.pc.out{opacity:.45}
.pc .tok{width:40px;height:40px;font-size:22px;flex:none}
.pc .info{min-width:0;flex:1}
.pc .nm{font-family:var(--f-ui);font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .nm small{font-family:var(--f-body);font-size:11px;color:var(--ink-3);margin-left:4px}
.pc .money{font-family:var(--f-num);font-size:16px;font-weight:600;color:var(--gold)}
.pc .money small{font-family:var(--f-ui);font-size:12px;color:var(--ink-3);margin-left:2px;font-weight:400}
.pc .meta{font-size:11.5px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:2px 8px}
.pc .meta .st{color:#ffb36b}
.float{position:absolute;right:10px;top:6px;font-family:var(--f-num);font-weight:800;font-size:15px;pointer-events:none;animation:floatUp 1.3s ease-out forwards}
.float.p{color:var(--good)} .float.m{color:var(--bad)}
@keyframes floatUp{from{opacity:1;transform:translateY(4px)}to{opacity:0;transform:translateY(-22px)}}

/* ---------- log ---------- */
#logBox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
#logBox h3{font-family:var(--f-ui);font-weight:400;font-size:15px;color:var(--ink-2);margin-bottom:6px}
#log{list-style:none;margin:0;padding:0;max-height:210px;overflow-y:auto;font-size:13px;color:var(--ink-2)}
#log li{padding:4px 0;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent);display:flex;gap:8px}
#log li:first-child{border-top:0;color:var(--ink)}
#log li i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--pc,var(--ink-3))}
body.land #log{max-height:calc(100vh - 380px);min-height:120px}

/* ---------- modal & sheet ---------- */
.ov{position:fixed;inset:0;z-index:60;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}}
.mbox{width:100%;max-width:460px;max-height:calc(100% - 8px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 0 0 1px color-mix(in srgb,var(--tc,var(--cyan)) 40%,transparent),0 0 40px color-mix(in srgb,var(--tc,var(--cyan)) 22%,transparent);animation:popIn .22s ease-out}
@keyframes popIn{from{transform:translateY(12px) scale(.97);opacity:.4}}
@media (prefers-reduced-motion:reduce){.ov,.mbox{animation:none}}
.kick{font-family:var(--f-ui);font-size:14px;color:var(--tc,var(--cyan));letter-spacing:.04em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvchip{font-family:var(--f-ui);font-size:12.5px;padding:1px 9px;border-radius:99px;border:1px solid currentColor}
.mbox h3{font-family:var(--f-ui);font-weight:400;font-size:24px;line-height:1.25;margin:6px 0 8px;text-wrap:balance}
.mbody{font-size:15px;color:var(--ink-2);line-height:1.6;display:flex;flex-direction:column;gap:10px}
.mbody .ref{font-size:13px;color:var(--ink-3)}
.mbtns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.ttab{width:100%;border-collapse:collapse;font-size:13.5px}
.ttab td{padding:5px 4px;border-top:1px solid var(--line)}
.ttab td:last-child{text-align:right;font-family:var(--f-num);font-size:13px;color:var(--ink)}
.ttab tr.cur td{color:var(--gold)}
.qtext{font-size:18px;line-height:1.55;color:var(--ink);font-weight:700}
.qopts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.qo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:50px;padding:8px 12px;border-radius:14px;background:var(--bg-2);border:1.5px solid var(--line);font-size:16px;line-height:1.35;color:var(--ink)}
.qo:hover:not([disabled]){border-color:var(--cyan)}
.qo b{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--panel-2);font-family:var(--f-num);font-size:12px;color:var(--ink-2)}
.qo.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--bg-2))}
.qo.ok b{background:var(--good);color:var(--bg)}
.qo.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--bg-2))}
.qo.no b{background:var(--bad);color:var(--bg)}
.qo[disabled]{cursor:default}
.qres{border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.5}
.qres.ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.qres.no{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.qres.wait{background:var(--bg-2);color:var(--ink-2)}
.qres small{display:block;color:var(--ink-2);font-size:13px}
.card-art{display:flex;align-items:center;justify-content:center;height:68px;border-radius:14px;background:radial-gradient(60% 90% at 50% 50%,color-mix(in srgb,var(--gold) 26%,transparent),transparent);color:var(--gold)}
.card-art svg{width:44px;height:44px;filter:drop-shadow(0 0 8px var(--gold))}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg-2)}
.rank li:first-child{box-shadow:inset 0 0 0 1.5px var(--gold)}
.rank .no{font-family:var(--f-num);font-weight:800;width:22px;color:var(--ink-3)}
.rank li:first-child .no{color:var(--gold)}
.rank .tok{width:32px;height:32px;font-size:18px}
.rank .who{flex:1;min-width:0;font-family:var(--f-ui);font-size:17px}
.rank .who small{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--ink-3)}
.rank .amt{font-family:var(--f-num);font-weight:600;color:var(--gold)}

const SND={ctx:null,
  init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C()}catch(e){}},
  tone(f,t0,d,type='square',v=.06){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.02)},
  play(k){if(!PREF.sound||!this.ctx||SPD()===0)return;const c=this.ctx;if(c.state==='suspended')c.resume();const t=c.currentTime;
    switch(k){
      case 'step':this.tone(660,t,.05,'triangle',.05);break;
      case 'roll':for(let i=0;i<6;i++)this.tone(180+Math.random()*240,t+i*.05,.04,'square',.03);break;
      case 'coin':this.tone(988,t,.08,'square',.05);this.tone(1319,t+.08,.18,'square',.05);break;
      case 'pay':this.tone(523,t,.08,'triangle',.06);this.tone(392,t+.09,.16,'triangle',.06);break;
      case 'good':[523,659,784,1047].forEach((f,i)=>this.tone(f,t+i*.08,.16,'triangle',.07));break;
      case 'bad':this.tone(196,t,.18,'sawtooth',.05);this.tone(147,t+.18,.3,'sawtooth',.05);break;
      case 'card':[784,988,1175,1568].forEach((f,i)=>this.tone(f,t+i*.06,.22,'sine',.06));break;
      case 'build':this.tone(392,t,.07,'square',.05);this.tone(587,t+.07,.07,'square',.05);this.tone(784,t+.14,.14,'square',.05);break;
    }}};
document.addEventListener('pointerdown',()=>SND.init(),{passive:true});
document.addEventListener('keydown',()=>SND.init());

let RUN=0, G=null;
const ABORT={abort:true}, PENDING=new Set();
function waitFor(setup){const id=RUN;return new Promise((res,rej)=>{const e={rej};PENDING.add(e);setup(v=>{if(!PENDING.has(e))return;PENDING.delete(e);id===RUN?res(v):rej(ABORT)})})}
async function sleep(ms){const id=RUN;await new Promise(r=>setTimeout(r,ms));if(id!==RUN)throw ABORT}
function abortAll(){RUN++;for(const e of PENDING)e.rej(ABORT);PENDING.clear();closeModal();window.__pick=null;const b=$('#board');if(b)b.classList.remove('picking');const pb=$('#pickBar');if(pb)pb.hidden=true}

function hasGroup(pid,g){return TILES.every((t,i)=>t.t!=='city'||t.g!==g||(G.own[i]&&G.own[i].o===pid))}
function tollOf(i){const t=TILES[i],o=G.own[i];if(!o)return 0;
  if(t.t==='spot')return SPOTS.every(j=>G.own[j]&&G.own[j].o===o.o)?150:50;
  let v=r10(t.price*MULT[o.l]);if(hasGroup(o.o,t.g))v*=2;return v}
function worth(p){let v=p.money;for(const[i,o]of Object.entries(G.own))if(o.o===p.id)v+=TILES[i].price+(TILES[i].t==='city'?o.l*upCost(+i):0);return v}
function landsOf(p){return Object.entries(G.own).filter(([,o])=>o.o===p.id).map(([i])=>+i)}

function float(p,delta){if(!delta)return;const el=$(`.pc[data-id="${p.id}"]`);if(!el)return;const f=document.createElement('span');f.className='float '+(delta>0?'p':'m');f.textContent=(delta>0?'+':'')+fmt(delta);el.appendChild(f);setTimeout(()=>f.remove(),1300)}

function buildBoard(){
  const b=$('#board');b.innerHTML='';
  TILES.forEach((t,i)=>{
    const [r,c]=cellOf(i),s=sideOf(i),el=document.createElement('div');
    el.className=`tile t-${t.t} ${s}`+(s==='corner'?` c-${t.t}`:'');el.style.gridArea=`${r}/${c}`;el.dataset.i=i;el.tabIndex=0;
    el.setAttribute('role','button');el.setAttribute('aria-label',t.name);
    if(t.t==='city')el.style.setProperty('--gc',GROUPS[t.g].c);
    let h='';
    if(t.t==='city')h=`<i class="band"></i><span class="lv"></span><b class="nm">${t.name}</b><span class="pr num">${t.price}</span>`;
    else if(t.t==='spot')h=`<span class="ic">${ICON.spot}</span><b class="nm">${t.name}</b><span class="pr num">${t.price}</span>`;
    else if(s==='corner')h=`<span class="ic">${ICON[t.t]}</span><b class="nm">${t.name}</b><span class="sub">${t.sub}</span>`;
    else h=`<span class="ic">${ICON[t.t]}</span><b class="nm">${t.short||t.name}</b>`;
    el.innerHTML=h+'<span class="tk"></span>';
    b.appendChild(el);
  });
  const c=document.createElement('div');c.id='center';
  c.innerHTML=`<div class="ttl">성경 부루마블</div><div class="rnd" id="cRnd"></div><div id="cWho"></div>
    <div class="dice"><div class="die" id="d1"></div><div class="die" id="d2"></div></div>
    <div id="cMsg"></div><button class="btn gold" id="cBtn" hidden>주사위 굴리기</button>
    <div class="pot">${ICON.pot.replace('<svg','<svg width="16" height="16"')}헌금함 <b class="num" id="cPot">0</b></div>
    <div id="pickBar" hidden>이동할 칸을 누르세요</div>`;
  b.appendChild(c);
  drawDie($('#d1'),1);drawDie($('#d2'),1);
  b.onclick=e=>{const el=e.target.closest('.tile');if(!el)return;onTileClick(+el.dataset.i)};
  b.onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('tile')){e.preventDefault();onTileClick(+e.target.dataset.i)}};
}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function drawDie(el,v){el.innerHTML=Array.from({length:9},(_,k)=>`<i class="${PIPS[v].includes(k)?'on':''}"></i>`).join('');el.setAttribute('aria-label','주사위 '+v)}
function renderTiles(){
  $$('#board .tile').forEach(el=>{
    const i=+el.dataset.i,t=TILES[i],o=G.own[i];
    if(t.t!=='city'&&t.t!=='spot')return;
    el.classList.toggle('owned',!!o);
    const pr=$('.pr',el),lv=$('.lv',el);
    if(o){const p=byId(o.o);el.style.setProperty('--oc',p.col);pr.textContent=tollOf(i);
      if(lv)lv.innerHTML='<i></i>'.repeat(o.l);
      el.setAttribute('aria-label',`${t.name}, ${p.name}의 땅, ${LV[o.l]}, 통행료 ${tollOf(i)}`)}
    else{el.style.removeProperty('--oc');pr.textContent=t.price;if(lv)lv.innerHTML='';el.setAttribute('aria-label',`${t.name}, 값 ${t.price}`)}
  });
}

let MSEQ=0;
function openBox(html,tone){closeModal();const ov=document.createElement('div');ov.className='ov';ov.id='ov';ov.innerHTML=`<div class="mbox" role="dialog" aria-modal="true" style="${tone?'--tc:'+tone:''}">${html}</div>`;document.body.appendChild(ov);return{ov,seq:++MSEQ}}
function closeModal(seq){const ov=$('#ov');if(ov&&(seq==null||seq===MSEQ))ov.remove()}
function modal(o){
  return waitFor(done=>{
    const btns=(o.buttons||[{label:'확인',value:true,primary:true}]).map((b,k)=>`<button class="btn ${b.primary?'gold':''} wide" data-k="${k}" ${b.disabled?'disabled':''}>${b.label}${b.note?` <small>${b.note}</small>`:''}</button>`).join('');
    const {ov,seq}=openBox(`${o.kick?`<div class="kick">${o.kick}</div>`:''}${o.title?`<h3>${o.title}</h3>`:''}<div class="mbody">${o.body||''}</div>${o.auto!=null?'':`<div class="mbtns">${btns}</div>`}`,o.tone);
    const list=o.buttons||[{value:true}];
    const fin=v=>{closeModal(seq);document.removeEventListener('keydown',kd);done(v)};
    const kd=e=>{if(e.key==='Enter'&&$('#ov')===ov){const k=list.findIndex(b=>b.primary&&!b.disabled);if(k>=0){e.preventDefault();fin(list[k].value)}}};
    if(o.auto!=null){setTimeout(()=>fin(o.auto),(o.autoMs||1400)*Math.max(SPD(),.05));return}

/* 사람에게는 확인 버튼, 컴퓨터 차례에는 잠깐 보여 주고 자동으로 닫습니다 */
const notice=(p,o)=>modal(Object.assign({},o,p.ai?{auto:true,autoMs:o.autoMs||1500}:{}));

/* ================= 퀴즈 ================= */
function drawQuestion(){
  let lv=G.set.diff;
  if(lv==='mix'){const r=Math.random();lv=r<.4?'easy':r<.75?'normal':'hard'}
  const used=G.used[lv]||(G.used[lv]=[]);
  if(used.length>=QB[lv].length)used.length=0;
  let k;do{k=Math.random()*QB[lv].length|0}while(used.includes(k));
  used.push(k);const[q,a,ref]=QB[lv][k];return{lv,q,a,ref};
}
function quiz(p,{kick,sub}){
  const Q=drawQuestion(), opts=shuffle(Q.a.map((t,i)=>({t,ok:i===0}))), okIdx=opts.findIndex(o=>o.ok);
  return waitFor(done=>{
    const {ov,seq}=openBox(`<div class="kick">${kick}<span class="lvchip" style="color:${LVCOLOR[Q.lv]}">${LVNAME[Q.lv]}</span></div>
      ${sub?`<div class="mbody" style="margin-top:4px"><span class="ref">${sub}</span></div>`:''}
      <div class="mbody" style="margin-top:10px"><p class="qtext">${esc(Q.q)}</p>
      <div class="qopts">${opts.map((o,k)=>`<button class="qo" data-k="${k}"><b>${k+1}</b><span>${esc(o.t)}</span></button>`).join('')}</div>
      <div id="qres"></div></div><div class="mbtns" id="qbtns"></div>`,LVCOLOR[Q.lv]);
    let picked=false;
    const finish=ok=>{closeModal(seq);document.removeEventListener('keydown',kd);done({ok,lv:Q.lv})};
    const choose=k=>{
      if(picked)return;picked=true;const ok=k===okIdx;
      $$('.qo',ov).forEach((b,j)=>{b.disabled=true;if(j===okIdx)b.classList.add('ok');else if(j===k)b.classList.add('no')});
      SND.play(ok?'good':'bad');
      $('#qres',ov).innerHTML=`<div class="qres ${ok?'ok':'no'}"><b>${ok?'정답입니다!':'아쉬워요, 틀렸어요.'}</b><small>정답: ${esc(Q.a[0])} · ${esc(Q.ref)}</small></div>`;
      log(`${p.name}: 말씀 퀴즈 ${ok?'정답':'오답'} (${Q.ref})`,p);
      if(p.ai){setTimeout(()=>finish(ok),2000*Math.max(SPD(),.05))}
      else{$('#qbtns',ov).innerHTML='<button class="btn gold wide" id="qok">계속하기</button>';const b=$('#qok',ov);b.onclick=()=>finish(ok);setTimeout(()=>b.focus(),30)}
    };
    const kd=e=>{if($('#ov')!==ov)return;if(!picked&&!p.ai&&/^[1-4]$/.test(e.key))choose(+e.key-1);else if(picked&&!p.ai&&e.key==='Enter'){e.preventDefault();$('#qok',ov)?.click()}};
    document.addEventListener('keydown',kd);
    if(p.ai){
      $$('.qo',ov).forEach(b=>b.disabled=true);
      $('#qres',ov).innerHTML=`<div class="qres wait">${esc(IGA(p.name))} 생각하고 있어요…</div>`;
      setTimeout(()=>{const acc=AIACC[G.set.ai][Q.lv];let k=okIdx;if(Math.random()>acc){const w=[0,1,2,3].filter(j=>j!==okIdx);k=w[Math.random()*w.length|0]}choose(k)},1600*Math.max(SPD(),.05));
    }else $$('.qo',ov).forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  });
}

/* ================= 이동 ================= */
async function moveBy(p,n,salary=true){
  const dir=n<0?-1:1;
  for(let k=0;k<Math.abs(n);k++){
    p.pos=(p.pos+dir+N)%N;
    if(dir>0&&p.pos===START&&salary){p.money+=SALARY;float(p,SALARY);SND.play('coin');log(`${p.name}: 출발 칸을 지나 축복금 +${SALARY}`,p);renderPlayers()}
    renderTokens(p.id);SND.play('step');
    await sleep(150*SPD());
  }
  flashTile(p.pos);
}
async function moveTo(p,dest,salary){const steps=(dest-p.pos+N)%N;const id=RUN;for(let k=0;k<steps;k++){p.pos=(p.pos+1)%N;if(p.pos===START&&salary){p.money+=SALARY;float(p,SALARY);SND.play('coin');log(`${p.name}: 출발 칸을 지나 축복금 +${SALARY}`,p);renderPlayers()}renderTokens(p.id);await sleep(60*SPD())}if(id!==RUN)throw ABORT;flashTile(p.pos)}
function flashTile(i){const el=$(`#board .tile[data-i="${i}"]`);if(!el)return;el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
async function goJail(p,why){p.pos=JAIL;p.jail=3;G.dbl=0;renderTokens(p.id);renderPlayers();SND.play('bad');log(`${p.name}: ${why} → 광야에서 최대 3턴 머뭅니다`,p);
  await notice(p,{kick:'광야',title:`${IGA(p.name)} 광야에 들어갔어요`,body:`<p>${esc(why)}</p><p>다음 차례부터 최대 3턴 동안 광야에 머뭅니다. 말씀 퀴즈를 맞히거나, 더블이 나오거나, 헌금 100을 내면 나올 수 있어요.</p><p class="ref">민 14:33</p>`,tone:'#ffb36b'})}

function waitRoll(p){

    setMsg(`<b>${esc(p.name)}</b>, 주사위를 굴려 주세요.`);

    b.onclick=go;document.addEventListener('keydown',kd)});

async function rollDice(p,now){
  if(!now){if(p.ai){setMsg(`${esc(IGA(p.name))} 주사위를 굴립니다…`);await sleep(700*SPD())}else await waitRoll(p)}
  const a=1+(Math.random()*6|0),b=1+(Math.random()*6|0),d1=$('#d1'),d2=$('#d2');
  SND.play('roll');d1.classList.remove('dbl');d2.classList.remove('dbl');
  if(SPD()>0){d1.classList.add('roll');d2.classList.add('roll');
    for(let k=0;k<7;k++){drawDie(d1,1+(Math.random()*6|0));drawDie(d2,1+(Math.random()*6|0));await sleep(55)}
    d1.classList.remove('roll');d2.classList.remove('roll')}
  drawDie(d1,a);drawDie(d2,b);if(a===b){d1.classList.add('dbl');d2.classList.add('dbl')}
  setMsg(`<b>${a} + ${b} = ${a+b}</b>${a===b?' · 더블!':''}`);log(`${p.name}: 주사위 ${a}+${b}${a===b?' (더블)':''}`,p);
  await sleep(300*SPD());return[a,b];

/* ================= 돈 ================= */
async function charge(p,amt,to,why){
  if(amt<=0)return true;
  if(p.money<amt)await liquidate(p,amt);
  const toP=to&&typeof to==='object', toName=toP?to.name:to==='pot'?'헌금함':'은행';
  if(p.money<amt){const rest=p.money;p.money=0;if(toP){to.money+=rest;float(to,rest)}else if(to==='pot')G.pot+=rest;
    log(`${p.name}: ${why} ${fmt(amt)}을 다 내지 못했어요`,p);await bankrupt(p,toP?to:null);return false}
  p.money-=amt;float(p,-amt);if(toP){to.money+=amt;float(to,amt)}else if(to==='pot')G.pot+=amt;
  SND.play('pay');log(`${p.name} → ${toName}: ${why} ${fmt(amt)}`,p);renderPlayers();renderCenter();return true;
}
async function liquidate(p,need){
  const sold=[];
  while(p.money<need){
    const bs=landsOf(p).filter(i=>G.own[i].l>0).sort((a,b)=>upCost(a)-upCost(b));
    if(!bs.length)break;const i=bs[0],v=r10(upCost(i)/2);G.own[i].l--;p.money+=v;sold.push(`${TILES[i].name} ${LV[G.own[i].l+1]} (+${v})`);
  }
  while(p.money<need){
    const ls=landsOf(p).sort((a,b)=>TILES[a].price-TILES[b].price);
    if(!ls.length)break;const i=ls[0],v=r10(TILES[i].price/2);delete G.own[i];p.money+=v;sold.push(`${TILES[i].name} 땅 (+${v})`);
  }
  if(!sold.length)return;
  log(`${p.name}: 빚을 갚으려고 ${sold.length}건을 반값에 팔았어요`,p);renderAll();
  await notice(p,{kick:'반값 매각',title:`${IGA(p.name)} 재산을 팔았어요`,body:`<p>달란트가 모자라서 건물과 땅을 반값에 팔았습니다.</p><p>${sold.map(esc).join('<br>')}</p>`,tone:'var(--bad)'});
}
async function bankrupt(p,creditor){
  p.bankrupt=true;p.money=0;for(const i of landsOf(p))delete G.own[i];
  SND.play('bad');log(`${p.name}: 파산했어요`,p);renderAll();
  await modal({kick:'파산',title:`${IGA(p.name)} 파산했어요`,body:`<p>${creditor?esc(creditor.name)+'에게 남은 달란트를 모두 주고, ':''}가진 땅은 모두 주인 없는 땅이 되었습니다.</p>`,tone:'var(--bad)',buttons:[{label:'확인',value:true,primary:true}],...(G.players.some(q=>!q.ai)?{}:{auto:true,autoMs:1800})});
}

/* ================= 칸에 도착 ================= */
async function land(p){
  if(p.bankrupt)return;
  const i=p.pos,t=TILES[i];renderAll();
  switch(t.t){
    case 'city':case 'spot':await onProperty(p,i);break;
    case 'card':await drawCard(p);break;
    case 'quiz':{setMsg('말씀 퀴즈 칸!');const r=await quiz(p,{kick:'말씀 퀴즈 칸',sub:`맞히면 난이도에 따라 100~200 달란트를 받아요`});if(r.ok)gain(p,QREWARD[r.lv],'말씀 퀴즈 정답');break}
    case 'jail':await goJail(p,'광야 칸에 도착했어요');break;
    case 'pot':if(G.pot>0){const v=G.pot;G.pot=0;renderCenter();gain(p,v,'오병이어 헌금함');await notice(p,{kick:'오병이어',title:`헌금함의 ${fmt(v)} 달란트를 받았어요`,body:'<p>"다 배불리 먹은 후에" 남은 조각을 모으니 열두 바구니에 찼습니다.</p><p class="ref">요 6:12-13</p>',tone:'var(--gold)'})}else{toast('헌금함이 비어 있어요');log(`${p.name}: 헌금함이 비어 있어요`,p)}break;
    case 'fly':await fly(p);break;
    case 'tithe':{const v=Math.max(10,r10(p.money*.1));setMsg(`십일조 ${fmt(v)} 달란트`);await charge(p,v,'pot','십일조');toast(`${IGA(p.name)} 십일조 ${fmt(v)}을 헌금함에 넣었어요`);break}
  }
  renderAll();
}
function tollTable(i,cur){
  const t=TILES[i];
  if(t.t==='spot')return `<table class="ttab"><tr${cur===0?' class="cur"':''}><td>명소 1곳</td><td>50</td></tr><tr${cur===1?' class="cur"':''}><td>홍해·요단강 모두</td><td>150</td></tr></table>`;
  return `<table class="ttab">${LV.map((n,l)=>`<tr${l===cur?' class="cur"':''}><td>${n}${l?` (짓는 값 ${upCost(i)})`:''}</td><td>${r10(t.price*MULT[l])}</td></tr>`).join('')}</table><p class="ref">같은 색 땅을 모두 가지면 통행료 2배</p>`;
}
async function onProperty(p,i){
  const t=TILES[i],o=G.own[i],grp=t.t==='city'?GROUPS[t.g].n:'명소',tone=t.t==='city'?GROUPS[t.g].c:'#7fd1ff';
  if(!o){
    if(p.money<t.price){toast(`${REUL(t.name)} 살 달란트가 모자라요`);log(`${p.name}: ${t.name} 살 달란트가 모자라요`,p);return}
    let buy;
    if(p.ai){buy=p.money-t.price>=aiReserve();await sleep(450*SPD())}
    else buy=(await modal({kick:`${t.name} · ${grp}`,title:`${REUL(t.name)} 살까요?`,tone,
      body:`<p>${esc(t.note)}</p><p class="ref">${t.ref}</p>${tollTable(i,0)}<p>사고 나면 <b class="num">${fmt(p.money-t.price)}</b> 달란트가 남아요.</p>`,
      buttons:[{label:`${t.price} 달란트로 사기`,value:'buy',primary:true},{label:'사지 않고 지나가기',value:'no'}]}))==='buy';
    if(buy){p.money-=t.price;G.own[i]={o:p.id,l:0};float(p,-t.price);SND.play('build');log(`${p.name}: ${REUL(t.name)} ${t.price}에 샀어요`,p);renderAll();if(p.ai)toast(`${IGA(p.name)} ${REUL(t.name)} 샀어요`)}

  }

    const c=upCost(i);
    if(p.money<c){toast(`${LV[o.l+1]}을 지을 달란트가 모자라요`);return}
    let up;
    if(p.ai){up=p.money-c>=aiReserve()-50;await sleep(450*SPD())}
    else up=(await modal({kick:`${t.name} · 내 땅`,title:`${t.name}에 ${REUL(LV[o.l+1])} 지을까요?`,tone,
      body:`<p>통행료가 <b class="num">${fmt(tollOf(i))}</b>에서 <b class="num">${fmt(r10(t.price*MULT[o.l+1])*(hasGroup(p.id,t.g)?2:1))}</b>(으)로 오릅니다.</p>${tollTable(i,o.l)}`,
      buttons:[{label:`${c} 달란트로 짓기`,value:'up',primary:true},{label:'다음에 짓기',value:'no'}]}))==='up';
    if(up){p.money-=c;o.l++;float(p,-c);SND.play('build');log(`${p.name}: ${t.name}에 ${REUL(LV[o.l])} 지었어요`,p);renderAll();if(p.ai)toast(`${IGA(p.name)} ${t.name}에 ${REUL(LV[o.l])} 지었어요`)}
    return;
  }
  const owner=byId(o.o);let amt=tollOf(i);
  setMsg(`<b>${esc(owner.name)}</b>의 ${esc(t.name)} · 통행료 ${fmt(amt)}`);
  if(p.ark>0){
    let use;
    if(p.ai){use=amt>=100;await sleep(400*SPD())}
    else use=(await modal({kick:'노아의 방주',title:`통행료 ${fmt(amt)}, 방주 카드를 쓸까요?`,tone:'var(--gold)',body:`<p>방주 카드를 쓰면 이번 통행료를 내지 않아요. 남은 방주 카드: ${p.ark}장</p>`,
      buttons:[{label:'방주 카드로 면제받기',value:'ark',primary:true},{label:G.set.tollQuiz?'카드는 아끼고 말씀 찬스 도전':'카드는 아끼고 통행료 내기',value:'pay'}]}))==='ark';
    if(use){p.ark--;SND.play('card');log(`${p.name}: 방주 카드로 ${t.name} 통행료를 면제받았어요`,p);toast(`${IGA(p.name)} 방주 카드를 썼어요`);renderPlayers();return}
  }
  if(G.set.tollQuiz){

    if(r.ok)amt=r10(amt/2);

  await charge(p,amt,owner,`${t.name} 통행료`);
  if(!p.bankrupt)toast(`${IGA(p.name)} ${owner.name}에게 통행료 ${fmt(amt)}을 냈어요`);

async function drawCard(p){
  if(!G.deck.length)G.deck=shuffle(CARDS.map(c=>c.id));
  const c=CARD_BY[G.deck.pop()];SND.play('card');log(`${p.name}: 말씀 카드 「${c.t}」`,p);
  await notice(p,{kick:'말씀 카드',tone:'var(--gold)',autoMs:2200,title:c.t,body:`<div class="card-art">${ICON.card}</div><p>${esc(c.d)}</p><p class="ref">${c.r}</p>`});
  await c.run(p);renderAll();
}
function aiFly(p){
  let best=START,score=150;
  TILES.forEach((t,i)=>{if(i===FLY||i===JAIL)return;let s=-1;const o=G.own[i];
    if(t.t==='city'||t.t==='spot'){if(!o&&p.money-t.price>=aiReserve())s=t.price;else if(o&&o.o===p.id&&t.t==='city'&&o.l<3&&p.money-upCost(i)>=aiReserve())s=upCost(i)+60}
    else if(t.t==='pot')s=G.pot;else if(t.t==='quiz')s=110;
    if(s>score){score=s;best=i}});
  return best;
}
function pickTile(){
  return waitFor(done=>{$('#board').classList.add('picking');$('#pickBar').hidden=false;
    window.__pick=i=>{if(i===FLY)return toast('다른 칸을 골라 주세요');$('#board').classList.remove('picking');$('#pickBar').hidden=true;window.__pick=null;done(i)}});
}
async function fly(p){
  let dest;
  if(p.ai){dest=aiFly(p);await sleep(700*SPD());toast(`${IGA(p.name)} 불수레를 타고 ${TILES[dest].name}(으)로 날아가요`)}
  else{await modal({kick:'엘리야의 불수레',tone:'#ff7a3d',title:'원하는 칸으로 날아갑니다',body:'<p>"불수레와 불말들이 두 사람을 갈라놓고 엘리야가 회오리바람으로 하늘로 올라가더라"</p><p class="ref">왕하 2:11</p><p>확인을 누른 뒤 보드에서 이동할 칸을 누르세요. 가는 길에 출발 칸을 지나면 축복금을 받아요.</p>',buttons:[{label:'칸 고르기',value:true,primary:true}]});
    setMsg('이동할 칸을 보드에서 누르세요.');dest=await pickTile()}
  log(`${p.name}: 불수레를 타고 ${TILES[dest].name}(으)로`,p);
  await moveTo(p,dest,true);await land(p);
}
async function wilderness(p){
  setMsg(`<b>${esc(p.name)}</b>, 광야에 있어요 (남은 차례 ${p.jail})`);
  let ch;
  if(p.ai){ch=p.song>0?'song':'quiz';await sleep(600*SPD())}
  else ch=await modal({kick:`광야 · 남은 차례 ${p.jail}`,tone:'#ffb36b',title:'광야를 어떻게 벗어날까요?',
    body:'<p>말씀 퀴즈를 맞히면 광야를 벗어나 바로 주사위를 굴립니다. 주사위를 골라 더블이 나오면 나온 수만큼 바로 이동합니다.</p>',
    buttons:[{label:'말씀 퀴즈로 탈출',value:'quiz',primary:true},{label:'주사위 굴리기',value:'dice',note:'더블이면 탈출'},
      ...(p.song>0?[{label:`찬송 카드 쓰기`,value:'song',note:`${p.song}장`}]:[]),
      {label:'헌금 100 내고 나가기',value:'pay',disabled:p.money<100}]});
  if(ch==='song'){p.song--;p.jail=0;SND.play('card');log(`${p.name}: 찬송 카드로 광야를 벗어났어요`,p);toast('옥문이 열렸어요!');renderPlayers();return'free'}
  if(ch==='pay'){await charge(p,100,'pot','광야 탈출 헌금');if(p.bankrupt)return'stay';p.jail=0;renderPlayers();return'free'}
  if(ch==='quiz'){const r=await quiz(p,{kick:'광야 탈출 퀴즈',sub:'맞히면 광야를 벗어나 주사위를 굴려요'});
    if(r.ok){p.jail=0;log(`${p.name}: 퀴즈를 맞혀 광야를 벗어났어요`,p);renderPlayers();return'free'}}
  else{const[a,b]=await rollDice(p,true);
    if(a===b){p.jail=0;log(`${p.name}: 더블! 광야를 벗어났어요`,p);renderPlayers();await moveBy(p,a+b);await land(p);return'moved'}}
  p.jail--;log(`${p.name}: 광야에 머뭅니다${p.jail===0?' (다음 차례에는 나가요)':''}`,p);renderPlayers();
  await sleep(500*SPD());return'stay';
}

/* ================= 차례 진행 ================= */
async function takeTurn(p){
  G.dbl=0;renderAll();$('#d1').classList.remove('dbl');$('#d2').classList.remove('dbl');
  if(p.skip){p.skip=0;log(`${p.name}: 안식일이라 한 번 쉽니다`,p);setMsg(`<b>${esc(p.name)}</b>, 안식일이라 이번 차례는 쉽니다.`);toast(`${IGA(p.name)} 안식일이라 쉬어요`);await sleep(1100*SPD());return}
  if(p.jail>0){const r=await wilderness(p);if(r!=='free')return}
  for(;;){
    const[a,b]=await rollDice(p),dbl=a===b;
    if(dbl&&++G.dbl>=3){await goJail(p,'더블을 세 번 연속으로 던졌어요');return}
    await moveBy(p,a+b);await land(p);
    if(!dbl||p.jail>0||p.bankrupt||p.skip||alive().length<2)return;
    toast('더블! 한 번 더 굴려요');setMsg(`<b>더블!</b> ${esc(p.name)}, 한 번 더 굴려요.`);
  }
}
function nextPlayer(){
  const n=G.players.length;
  for(let k=0;k<n;k++){G.turn=(G.turn+1)%n;if(G.turn===0)G.round++;if(!G.players[G.turn].bankrupt)return}
}
function save(){if(G&&!G.over)store.set('save',G);else store.del('save')}
async function gameLoop(){
  const id=RUN;
  try{
    while(!G.over){
      const p=cur();
      if(p.bankrupt){nextPlayer();continue}
      if(G.round>roundLimit())break;
      save();renderAll();
      await takeTurn(p);
      if(alive().length<=1)break;
      nextPlayer();
      if(G.round>roundLimit())break;
    }
    G.over=true;save();renderAll();await showEnd();
  }catch(e){if(e!==ABORT){console.error(e);if(id===RUN)toast('문제가 생겨 게임을 멈췄어요. 메뉴에서 새 게임을 시작해 주세요.',5000)}}
}
async function showEnd(){
  const rank=G.players.slice().sort((a,b)=>(a.bankrupt-b.bankrupt)||worth(b)-worth(a)), w=rank[0];
  SND.play('good');$('#cBtn').hidden=true;setMsg(`<b>${esc(w.name)}</b> 승리!`);
  const v=await modal({kick:alive().length<=1?'한 명만 남았어요':'정해진 라운드가 끝났어요',tone:'var(--gold)',title:`${esc(IGA(w.name))} 이겼어요!`,
    body:`<ol class="rank">${rank.map((p,k)=>`<li><span class="no">${k+1}</span><span class="tok" style="--pc:${p.col}">${p.tok}</span><span class="who">${esc(p.name)}<small>${p.bankrupt?'파산':`현금 ${fmt(p.money)} · 땅 ${landsOf(p).length}곳`}</small></span><span class="amt">${p.bankrupt?'-':fmt(worth(p))}</span></li>`).join('')}</ol>
      <p class="ref">총자산은 현금과 땅값, 지은 건물값을 모두 더한 금액입니다.</p>`,
    buttons:[{label:'같은 설정으로 다시 하기',value:'again',primary:true},{label:'처음 화면으로',value:'home'}]});
  if(v==='again')newGame(G.setup);else showSetup();
}

      pot:'헌금함에 모인 달란트를 모두 받습니다. 십일조와 벌금이 헌금함에 쌓입니다.',
      fly:'엘리야처럼 불수레를 타고 원하는 칸으로 바로 이동합니다.',

function openInfo(kick,title,body,tone){
  const {ov,seq}=openBox(`<div class="kick">${kick}</div><h3>${esc(title)}</h3><div class="mbody">${body}</div><div class="mbtns"><button class="btn wide" id="infoClose">닫기</button></div>`,tone);

}

function fit(){
  const land=innerWidth/innerHeight>=1.05&&innerWidth>=640;
  document.body.classList.toggle('land',land);
  const hdr=$('#hdr').offsetHeight;
  let bs=land?Math.min(innerHeight-hdr-28,innerWidth-32-14-280):Math.min(innerWidth-32,700);
  bs=Math.max(268,Math.min(bs,880));
  document.documentElement.style.setProperty('--bs',Math.floor(bs)+'px');
}
addEventListener('resize',fit);

/* ================= 게임 시작 ================= */
function newGame(setup){
  abortAll();SND.init();
  const st=JSON.parse(JSON.stringify(setup));
  G={v:1,setup:st,set:{diff:st.diff,ai:st.ai,rounds:st.rounds,tollQuiz:st.tollQuiz},
    players:st.players.map((p,k)=>({id:k,name:(p.name||'').trim()||DEF_NAMES[k],ai:!!p.ai,tok:TOKENS[p.tok]||TOKENS[k],col:SEAT[k],money:st.money,pos:0,jail:0,skip:0,ark:0,song:0,bankrupt:false})),
    own:{},pot:0,turn:0,round:1,dbl:0,deck:shuffle(CARDS.map(c=>c.id)),used:{easy:[],normal:[],hard:[]},log:[],over:false};
  log('새 게임을 시작했어요. 우르에서 예루살렘까지 여행을 떠나요!');
  enterGame();
}
function resume(saved){abortAll();G=saved;G.over=false;log('저장된 게임을 이어서 시작해요');enterGame()}
function enterGame(){
  $('#setup').hidden=true;$('#game').hidden=false;$('#bMenu').hidden=false;
  buildBoard();fit();renderAll();scrollTo(0,0);gameLoop();
}

/* ================= 시작 ================= */
$('#bRules').onclick=()=>{if(!$('#ov'))openInfo('게임 방법','성경 부루마블 규칙',rulesHTML(),'var(--gold)')};
$('#bSound').onclick=()=>{PREF.sound=!PREF.sound;savePref();drawSoundBtn();if(PREF.sound){SND.init();SND.play('coin')}};
$('#bMenu').onclick=openMenu;
drawSoundBtn();fit();
window.claude?.hot?.snapshot?.(()=>({G:G&&!G.over?JSON.parse(JSON.stringify(G)):null}));
const boot=data=>{if(data&&data.G&&data.G.players)resume(data.G);else showSetup()};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
</body>
