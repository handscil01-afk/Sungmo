<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>성경 부루마블</title>
<meta name="theme-color" content="#e6f3ff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
</head>
<body>
<style>
/* Layout: 태블릿 가로 = 왼쪽 상황판 | 정사각 보드 | 오른쪽 상황판, 세로·휴대폰 = 보드 아래 상황판 2열. 하늘과 모래 빛 동화책 같은 밝은 단일 테마 */
:root{
  --sky:#e6f3ff; --sky-2:#cfe6fb; --paper:#ffffff; --cream:#fffaf0; --sand:#ffe3a6; --sand-2:#efc672; --line:#e6def2;
  --ink:#3d3458; --ink-2:#6c648a; --ink-3:#a39cbb;
  --accent:#ff7b54; --accent-2:#e8613a; --on-accent:#ffffff; --mint:#38b996; --good:#23a26d; --bad:#e2496a; --warn:#f08c00;
  --g0:#ffc183; --g1:#ff9d9d; --g2:#b2df74; --g3:#86d5ea; --g4:#c9a9f6; --g5:#ffa6d6; --g6:#9ab6ff; --g7:#ffd657;
  --shadow:0 3px 0 rgba(61,52,88,.10),0 10px 22px rgba(61,52,88,.08);
  --f-cute:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --bs:360px; --u:calc(var(--bs) / 100); --pw:240px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);line-height:1.5;word-break:keep-all;overflow-wrap:break-word;
  background-image:radial-gradient(circle at 12% 18%,#fff 0 46px,transparent 47px),radial-gradient(circle at 16% 15%,#fff 0 34px,transparent 35px),
  radial-gradient(circle at 88% 82%,#fff 0 52px,transparent 53px),radial-gradient(circle at 84% 85%,#fff 0 36px,transparent 37px),
  radial-gradient(#d3e8fb 1.2px,transparent 1.3px);background-size:auto,auto,auto,auto,22px 22px;background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:4px;padding:6px 12px;background:color-mix(in srgb,var(--sky) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#hdr h1{flex:1;font-family:var(--f-cute);font-weight:400;font-size:22px;color:var(--ink)}
#hdr h1 span{color:var(--accent)}
.ib{min-width:44px;height:44px;padding:0 10px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--ink-2);font-family:var(--f-cute);font-size:15px;background:var(--paper);box-shadow:0 2px 0 rgba(61,52,88,.1)}
.ib:hover{color:var(--ink)}
.ib svg{width:22px;height:22px}
.ib .lb{display:none}
@media (min-width:700px){.ib .lb{display:inline}}

/* ---------- 공통 ---------- */
.box{background:var(--paper);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.box h2{font-family:var(--f-cute);font-weight:400;font-size:21px;margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.box h2 small{font-family:var(--f-body);font-size:13px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:16px;font-family:var(--f-cute);font-size:19px;background:var(--paper);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--line),0 1px 0 var(--line)}
.btn.main{background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-2)}
.btn.main:active{box-shadow:0 1px 0 var(--accent-2)}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 4px 0 #23977a}
.btn.wide{width:100%}
.btn.big{min-height:62px;font-size:24px;border-radius:20px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn small{font-family:var(--f-body);font-size:13px;opacity:.85}
.linkbtn{font-family:var(--f-cute);font-size:15px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:6px 8px}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:14px;background:var(--cream);box-shadow:inset 0 0 0 1.5px var(--line)}
.seg button{flex:1 1 auto;min-height:40px;padding:0 10px;border-radius:10px;color:var(--ink-2);font-family:var(--f-cute);font-size:16px;white-space:nowrap}
.seg button.on{background:var(--paper);color:var(--accent-2);box-shadow:0 2px 0 rgba(61,52,88,.12),inset 0 0 0 2px var(--accent)}
.sw{position:relative;flex:none;width:58px;height:34px;border-radius:17px;background:#ddd6ea;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.15);transition:.15s}
.sw[aria-checked="true"]{background:var(--mint)}
.sw[aria-checked="true"]::after{left:27px}
.tok{display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 0 0 2.5px var(--pc),0 2px 0 rgba(61,52,88,.18);line-height:1}

/* ---------- setup ---------- */
#setup{max-width:1100px;margin:0 auto;padding-block:8px 40px;padding-inline:16px}
.logo{text-align:center;padding:10px 0 16px}
.logo .big{font-family:var(--f-cute);font-size:clamp(44px,9vw,76px);line-height:1.1;display:inline-flex;gap:.04em;flex-wrap:wrap;justify-content:center}
.logo .big span{display:inline-block;color:var(--c);text-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,#3d3458);transform:rotate(var(--r))}
.logo .big span.sp{width:.3em}
@media (prefers-reduced-motion:no-preference){.logo .big span{animation:bob 2.6s ease-in-out infinite;animation-delay:var(--d)}}
@keyframes bob{50%{transform:rotate(var(--r)) translateY(-5px)}}
.logo p{margin-top:10px;color:var(--ink-2);font-size:16px;text-wrap:balance}
.scols{display:grid;gap:16px}
@media (min-width:900px){.scols{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}}
.scol{display:flex;flex-direction:column;gap:16px;min-width:0}
.prow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1.5px dashed var(--line);flex-wrap:wrap}
.prow:first-of-type{border-top:0}
.prow .tok{width:50px;height:50px;font-size:28px;flex:none}
.prow input{flex:1 1 120px;min-width:0;height:46px;border-radius:14px;border:0;box-shadow:inset 0 0 0 2px var(--line);background:var(--cream);padding:0 12px;font-size:17px;font-family:var(--f-cute)}
.prow .seg{flex:none}
.xbtn{flex:none;width:38px;height:38px;border-radius:12px;color:var(--ink-3);font-size:22px}
.xbtn:hover{color:var(--bad)}
.addp{width:100%;margin-top:6px;min-height:48px;border-radius:14px;border:2px dashed var(--line);color:var(--ink-2);font-family:var(--f-cute);font-size:17px}

/* ---------- 설정 목록 ---------- */
.sets{display:flex;flex-direction:column;gap:4px}
.sets h4{margin:14px 0 2px;font-family:var(--f-cute);font-weight:400;font-size:17px;color:var(--accent-2)}
.sets h4:first-child{margin-top:0}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1.5px dashed var(--line);flex-wrap:wrap}
.srow .tx{flex:1 1 200px;min-width:0}
.srow .tx b{display:block;font-family:var(--f-cute);font-weight:400;font-size:17px}
.srow .tx small{display:block;color:var(--ink-3);font-size:13px;line-height:1.4}
.srow .seg{flex:1 1 260px}
.srow.off{opacity:.45;pointer-events:none}

/* ---------- game layout ---------- */
#game{display:grid;gap:14px;padding-block:6px 24px;padding-inline:16px;margin:0 auto;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"b b" "l r";max-width:900px}
#board{grid-area:b;justify-self:center}
#pl{grid-area:l} #pr{grid-area:r}
.pcol{display:flex;flex-direction:column;gap:12px;min-width:0}
body.tab #game{grid-template-columns:var(--pw) var(--bs) var(--pw);grid-template-areas:"l b r";max-width:none;justify-content:center;align-items:stretch;padding-block:4px 12px}
body.tab .pcol{height:var(--bs)}
body.tab .pcol .pc{flex:1 1 0;min-height:0}

/* ---------- board ---------- */
#board{position:relative;width:var(--bs);height:var(--bs);display:grid;grid-template-columns:1.3fr repeat(7,1fr) 1.3fr;grid-template-rows:1.3fr repeat(7,1fr) 1.3fr;gap:max(2px,calc(var(--u)*.55));padding:max(4px,calc(var(--u)*1));border-radius:calc(var(--u)*3.4);background:var(--sand);box-shadow:0 6px 0 var(--sand-2),0 16px 30px rgba(61,52,88,.12)}
.tile{position:relative;min-width:0;min-height:0;background:var(--paper);border-radius:calc(var(--u)*1.3);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;cursor:pointer;padding:2px;box-shadow:0 2px 0 rgba(61,52,88,.12);transition:background .2s,transform .15s}
.tile:hover{transform:translateY(-1px)}
.tile .band{position:absolute;background:var(--gc)}
.tile.sb .band{left:0;right:0;top:0;height:18%}
.tile.st .band{left:0;right:0;bottom:0;height:18%}
.tile.sl .band{top:0;bottom:0;right:0;width:18%}
.tile.sr .band{top:0;bottom:0;left:0;width:18%}
.tile.sb{padding-top:calc(var(--u)*2)} .tile.st{padding-bottom:calc(var(--u)*2)}
.tile.sl{padding-right:calc(var(--u)*2)} .tile.sr{padding-left:calc(var(--u)*2)}
.tile .pic{font-size:calc(var(--u)*3.3);line-height:1.05}
.tile .nm{font-family:var(--f-cute);font-weight:400;font-size:max(8.5px,calc(var(--u)*2.45));line-height:1.08;word-break:break-all;color:var(--ink)}
.tile .pr{font-family:var(--f-cute);font-size:max(8px,calc(var(--u)*1.85));color:var(--ink-3);line-height:1.1;margin-top:1px;white-space:nowrap}
.tile.corner{background:var(--cream)}
.tile.corner .pic{font-size:calc(var(--u)*5.2)}
.tile.corner .nm{font-size:max(10px,calc(var(--u)*3))}
.tile.corner .sub{font-size:max(7px,calc(var(--u)*1.6));color:var(--ink-2);line-height:1.15}
body.small .tile:not(.corner) .pic{display:none}
body.small .tile.corner .sub{display:none}
/* 땅 주인: 칸 전체를 주인 색으로 칠하고, 굵은 테두리와 깃발을 붙입니다 */
.tile.owned{background:color-mix(in srgb,var(--oc) 30%,#fff);box-shadow:inset 0 0 0 max(2.5px,calc(var(--u)*.75)) var(--oc),0 2px 0 rgba(61,52,88,.12)}
.tile.owned .pr{color:color-mix(in srgb,var(--oc) 75%,#000);font-weight:700}
.tile .flag{position:absolute;top:max(1px,calc(var(--u)*.4));right:max(1px,calc(var(--u)*.4));width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);min-width:13px;min-height:13px;border-radius:50% 50% 50% 4px;background:var(--oc);display:grid;place-items:center;font-size:max(8px,calc(var(--u)*2.2));line-height:1;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.tile.sl .flag{right:auto;left:max(1px,calc(var(--u)*.4))}
.tile .bld{position:absolute;left:max(1px,calc(var(--u)*.4));bottom:max(1px,calc(var(--u)*.3));font-size:max(10px,calc(var(--u)*3.1));line-height:1;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.tile.sr .bld{left:auto;right:max(1px,calc(var(--u)*.4))}
.tile .tk{position:absolute;inset:auto 0 max(1px,calc(var(--u)*.3)) 0;display:flex;flex-wrap:wrap;justify-content:center;gap:1px;pointer-events:none;z-index:2}
.tile .tk .tok{width:calc(var(--u)*4.2);height:calc(var(--u)*4.2);min-width:15px;min-height:15px;font-size:max(9px,calc(var(--u)*2.7))}
.tok.hop{animation:hop .24s ease-out}
@keyframes hop{45%{transform:translateY(-40%) scale(1.15)}}
.tile.pop{animation:pop .55s}
@keyframes pop{30%{transform:scale(1.12)}60%{transform:scale(.97)}}
.tile.here{box-shadow:inset 0 0 0 max(2.5px,calc(var(--u)*.7)) var(--accent),0 2px 0 rgba(61,52,88,.12)}
.tile.owned.here{box-shadow:inset 0 0 0 max(2.5px,calc(var(--u)*.75)) var(--oc),0 0 0 3px var(--accent)}
#board.picking .tile:not(.c-fly){animation:pick 1s infinite alternate}
@keyframes pick{to{transform:translateY(-2px);box-shadow:0 0 0 3px var(--accent)}}
@media (prefers-reduced-motion:reduce){.tok.hop,.tile.pop,#board.picking .tile,.die.roll{animation:none}}

/* ---------- center ---------- */
#center{grid-area:2/2/9/9;position:relative;border-radius:calc(var(--u)*2.2);background:linear-gradient(180deg,#fffef8 0%,#fffef8 62%,#e9f7dc 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.5);padding:calc(var(--u)*2.2);text-align:center;overflow:hidden;box-shadow:inset 0 0 0 2px #f3e3bd}
#center .ttl{font-family:var(--f-cute);font-size:calc(var(--u)*5);line-height:1}
#center .ttl span{color:var(--c)}
#center .rnd{font-family:var(--f-cute);font-size:max(12px,calc(var(--u)*2.5));color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:3px 14px 3px 4px;border-radius:99px;background:color-mix(in srgb,var(--pc) 22%,#fff);box-shadow:inset 0 0 0 2.5px var(--pc);font-family:var(--f-cute);font-size:max(14px,calc(var(--u)*3.2))}
.chip .tok{width:calc(var(--u)*5.2);height:calc(var(--u)*5.2);min-width:24px;min-height:24px;font-size:max(14px,calc(var(--u)*3.1))}
.dice{display:flex;gap:calc(var(--u)*2.4)}
.die{width:calc(var(--u)*10);height:calc(var(--u)*10);min-width:34px;min-height:34px;border-radius:24%;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:max(5px,calc(var(--u)*1.5));box-shadow:inset 0 0 0 2px #ece4f5,0 4px 0 #d9cfe9}
.die i{border-radius:50%;margin:13%}
.die i.on{background:var(--ink)}
.die.d1 i.on{background:var(--bad)}
.die.dbl{box-shadow:inset 0 0 0 3px var(--accent),0 4px 0 var(--accent-2)}
.die.roll{animation:shake .12s infinite}
@keyframes shake{25%{transform:rotate(-12deg) translateY(-3px)}75%{transform:rotate(12deg)}}
#cMsg{min-height:1.4em;font-family:var(--f-cute);font-size:max(13px,calc(var(--u)*2.9));line-height:1.3;color:var(--ink-2);max-width:96%;text-wrap:balance}
#cMsg b{color:var(--ink);font-weight:400}
#cAct{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1)}
#cAct .btn{min-height:max(44px,calc(var(--u)*9.5));font-size:max(17px,calc(var(--u)*3.9));padding:0 calc(var(--u)*5)}
.dpad{display:flex;flex-direction:column;gap:calc(var(--u)*1);align-items:center;background:var(--cream);border-radius:16px;padding:calc(var(--u)*1.4) calc(var(--u)*1.8);box-shadow:inset 0 0 0 2px var(--line)}
.dpad .pl{font-family:var(--f-cute);font-size:max(12px,calc(var(--u)*2.3));color:var(--ink-2)}
.drow{display:flex;gap:calc(var(--u)*.9);align-items:center}
.drow em{font-style:normal;font-family:var(--f-cute);font-size:max(11px,calc(var(--u)*2.1));color:var(--ink-3);width:2.6em}
.dbtn{width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);min-width:28px;min-height:28px;border-radius:24%;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:max(4px,calc(var(--u)*.9));box-shadow:inset 0 0 0 2px #e6dcf2,0 2px 0 #d9cfe9}
.dbtn i{border-radius:50%;margin:10%}
.dbtn i.on{background:var(--ink-2)}
.dbtn.on{background:var(--accent);box-shadow:0 2px 0 var(--accent-2)}
.dbtn.on i.on{background:#fff}
#cLog{list-style:none;margin:0;padding:0;width:min(96%,calc(var(--u)*62));display:flex;flex-direction:column;gap:2px;font-size:max(11.5px,calc(var(--u)*1.9));color:var(--ink-2);text-align:left}
#cLog li{display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cLog li i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--pc,var(--ink-3));transform:translateY(-1px)}
#cLog li span{overflow:hidden;text-overflow:ellipsis}
#cLog li:not(:first-child){opacity:.7}
#center .pot{font-family:var(--f-cute);font-size:max(12px,calc(var(--u)*2.4));color:var(--ink-2)}
#center .pot b{font-weight:400;color:var(--warn)}
#pickBar{position:absolute;inset:auto 0 0 0;padding:10px;background:var(--accent);color:#fff;font-family:var(--f-cute);font-size:max(14px,calc(var(--u)*3))}
body.small #center .ttl,body.small #cLog{display:none}
body.small.padopen .dice{display:none}
body.small.padopen #center #toast{display:none}

/* ---------- 상황판 ---------- */
.pc{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:20px;background:var(--paper);box-shadow:var(--shadow);min-width:0;overflow:hidden;border-top:8px solid var(--pc);transition:transform .2s,box-shadow .2s}
.pc.act{box-shadow:0 0 0 3px var(--pc),0 12px 26px color-mix(in srgb,var(--pc) 35%,transparent);transform:translateY(-2px)}
.pc.out{opacity:.5;filter:grayscale(.7)}
.pc.empty{background:transparent;box-shadow:none;border:2.5px dashed rgba(61,52,88,.12);display:grid;place-items:center;color:var(--ink-3);font-family:var(--f-cute)}
.pc-top{display:flex;align-items:center;gap:10px;min-width:0}
.pc-top .tok{width:46px;height:46px;font-size:26px;flex:none}
.pc-top .nmw{flex:1;min-width:0}
.pc-top .nm{font-family:var(--f-cute);font-size:21px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-top .who{font-size:12.5px;color:var(--ink-3)}
.turnb{position:absolute;top:10px;right:10px;font-family:var(--f-cute);font-size:14px;padding:3px 10px;border-radius:99px;background:var(--pc);color:#fff}
.money{font-family:var(--f-cute);font-size:28px;line-height:1.1;color:var(--ink)}
.money small{font-size:15px;color:var(--ink-3);margin-left:3px}
.psub{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 10px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-family:var(--f-cute);font-size:13.5px;padding:2px 9px;border-radius:99px;background:var(--cream);box-shadow:inset 0 0 0 1.5px var(--line)}
.tag.w{background:#fff1dc;box-shadow:inset 0 0 0 1.5px #ffcf8a;color:#b25e00}
.lands{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;overflow-y:auto;min-height:0;flex:1 1 auto}
.lands .ln{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-cute);font-size:14px;padding:2px 8px 2px 4px;border-radius:9px;background:color-mix(in srgb,var(--gc) 45%,#fff);box-shadow:inset 3px 0 0 var(--gc)}
.lands .ln.ln3{box-shadow:inset 3px 0 0 var(--gc),inset 0 0 0 1.5px var(--warn)}
.lands .none{font-size:13px;color:var(--ink-3)}
.float{position:absolute;right:12px;top:10px;font-family:var(--f-cute);font-size:22px;pointer-events:none;animation:floatUp 1.4s ease-out forwards;text-shadow:0 2px 0 #fff}
.float.p{color:var(--good)} .float.m{color:var(--bad)}
@keyframes floatUp{from{opacity:1;transform:translateY(6px)}to{opacity:0;transform:translateY(-26px)}}
body:not(.tab) .pc .lands{max-height:96px}
body:not(.tab) .pc-top .tok{width:38px;height:38px;font-size:21px}
body:not(.tab) .pc-top .nm{font-size:18px}
body:not(.tab) .money{font-size:24px}
.pc.act .pc-top .nmw{padding-right:44px}

/* ---------- modal ---------- */

const SND={ctx:null,
  init(){if(this.ctx)return;try{const C=window.AudioContext||window.webkitAudioContext;this.ctx=new C()}catch(e){}},
  tone(f,t0,d,type='triangle',v=.07){const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.02)},
  play(k){if(!PREF.sound||!this.ctx||SPD()===0)return;const c=this.ctx;if(c.state==='suspended')c.resume();const t=c.currentTime;
    switch(k){
      case 'step':this.tone(880,t,.06,'sine',.06);break;
      case 'roll':for(let i=0;i<6;i++)this.tone(300+Math.random()*300,t+i*.05,.04,'square',.025);break;
      case 'coin':this.tone(1046,t,.08,'square',.04);this.tone(1568,t+.08,.2,'square',.04);break;
      case 'pay':this.tone(587,t,.1,'triangle',.07);this.tone(440,t+.1,.18,'triangle',.07);break;
      case 'good':[523,659,784,1047].forEach((f,i)=>this.tone(f,t+i*.08,.18,'triangle',.08));break;
      case 'bad':this.tone(330,t,.16,'triangle',.08);this.tone(262,t+.16,.3,'triangle',.08);break;
      case 'card':[784,988,1175,1568].forEach((f,i)=>this.tone(f,t+i*.06,.24,'sine',.07));break;
      case 'build':[392,523,659,784].forEach((f,i)=>this.tone(f,t+i*.06,.1,'square',.04));break;
      case 'tick':this.tone(1200,t,.03,'sine',.04);break;
    }}};

function drawQuestion(){
  let lv=G.set.diff;
  if(lv==='mix'){const r=Math.random();lv=r<.4?'easy':r<.75?'normal':'hard'}
  const used=G.used[lv]||(G.used[lv]=[]);
  if(used.length>=QB[lv].length)used.length=0;
  let k;do{k=Math.random()*QB[lv].length|0}while(used.includes(k));
  used.push(k);const[q,a,ref]=QB[lv][k];return{lv,q,a,ref};
}
function quiz(p,{kick,sub}){
  const Q=drawQuestion(), opts=shuffle(Q.a.map((t,i)=>({t,ok:i===0}))), okIdx=opts.findIndex(o=>o.ok);
  const limit=p.ai?0:(G.set.quizTime||0);
  return waitFor(done=>{
    const {ov,seq}=openBox(`<div class="kick">${kick}<span class="lvchip" style="--lc:${LVCOLOR[Q.lv]}">${LVNAME[Q.lv]}</span></div>

      ${limit?`<div class="qtimer" id="qt"><i style="width:100%"></i><b>${limit}초</b></div>`:''}
      <p class="qtext">${esc(Q.q)}</p>
      <div class="qopts">${opts.map((o,k)=>`<button class="qo" data-k="${k}"><b>${k+1}</b><span>${esc(o.t)}</span></button>`).join('')}</div>
      <div id="qres"></div></div><div class="mbtns" id="qbtns"></div>`,LVCOLOR[Q.lv],true);
    let picked=false,timer=null;
    const finish=ok=>{clearInterval(timer);closeModal(seq);document.removeEventListener('keydown',kd);done({ok,lv:Q.lv})};
    const choose=k=>{
      if(picked)return;picked=true;clearInterval(timer);const ok=k===okIdx;
      $$('.qo',ov).forEach((b,j)=>{b.disabled=true;if(j===okIdx)b.classList.add('ok');else if(j===k)b.classList.add('no')});
      SND.play(ok?'good':'bad');
      const head=ok?'🎉 정답이에요!':k<0?'⏰ 시간이 다 됐어요.':'😢 아쉬워요, 틀렸어요.';
      $('#qres',ov).innerHTML=`<div class="qres ${ok?'ok':'no'}"><b>${head}</b><small>정답: ${esc(Q.a[0])} · ${esc(Q.ref)}</small></div>`;
      log(`${p.name}: 말씀 퀴즈 ${ok?'정답':k<0?'시간 초과':'오답'} (${Q.ref})`,p);
      if(p.ai){setTimeout(()=>finish(ok),AW(2100))}
      else{$('#qbtns',ov).innerHTML='<button class="btn main wide" id="qok">계속하기</button>';const b=$('#qok',ov);b.onclick=()=>finish(ok);setTimeout(()=>b.focus({preventScroll:true}),30)}
    };
    const kd=e=>{if($('#ov')!==ov)return;if(!picked&&!p.ai&&/^[1-4]$/.test(e.key))choose(+e.key-1);else if(picked&&!p.ai&&e.key==='Enter'){e.preventDefault();$('#qok',ov)?.click()}};
    document.addEventListener('keydown',kd);
    if(p.ai){
      $$('.qo',ov).forEach(b=>b.disabled=true);
      $('#qres',ov).innerHTML=`<div class="qres wait">🤔 ${esc(IGA(p.name))} 생각하고 있어요…</div>`;
      setTimeout(()=>{const acc=AIACC[G.set.ai][Q.lv];let k=okIdx;if(Math.random()>acc){const w=[0,1,2,3].filter(j=>j!==okIdx);k=w[Math.random()*w.length|0]}choose(k)},AW(1700));
    }else{
      $$('.qo',ov).forEach(b=>b.onclick=()=>choose(+b.dataset.k));
      if(limit){const t0=performance.now(),total=limit*1000,bar=$('#qt i',ov),lab=$('#qt b',ov),box=$('#qt',ov);let lastS=limit;
        timer=setInterval(()=>{if(!ov.isConnected){clearInterval(timer);return}const rem=Math.max(0,total-(performance.now()-t0)),s=Math.ceil(rem/1000);
          bar.style.width=(rem/total*100)+'%';lab.textContent=s+'초';box.classList.toggle('hurry',s<=5);
          if(s<lastS&&s<=5&&s>0)SND.play('tick');lastS=s;if(rem<=0)choose(-1)},100)}
    }
  });
}

async function moveBy(p,n,salary=true){
  const dir=n<0?-1:1;
  for(let k=0;k<Math.abs(n);k++){
    p.pos=(p.pos+dir+N)%N;
    if(dir>0&&p.pos===START&&salary)passStart(p);
    renderTokens(p.id);SND.play('step');
    await sleep(170*SPD());
  }
  popTile(p.pos);
}
async function moveTo(p,dest,salary){const steps=(dest-p.pos+N)%N;for(let k=0;k<steps;k++){p.pos=(p.pos+1)%N;if(p.pos===START&&salary)passStart(p);renderTokens(p.id);await sleep(65*SPD())}popTile(p.pos)}
async function goJail(p,why){p.pos=JAIL;p.jail=G.set.jailTurns;G.dbl=0;renderTokens(p.id);renderPlayers();SND.play('bad');log(`${p.name}: ${why} → 광야`,p);
  await notice(p,{pic:'🌵',kick:'광야',title:`${IGA(p.name)} 광야에 들어갔어요`,body:`<p>${esc(why)}</p><p>다음 차례부터 최대 ${G.set.jailTurns}번 광야에 머뭅니다. ${G.set.jailQuiz?'말씀 퀴즈를 맞히거나, ':''}더블이 나오거나, 헌금 100을 내면 나올 수 있어요.</p><p class="ref">민 14:33</p>`,tone:'#ffcf8a'})}

/* ================= 주사위 ================= */
/* 사람 차례: 화면 주사위 버튼, 또는 실물 주사위 숫자 입력판을 보여 주고 결과를 기다립니다 */
function waitDiceInput(p,mode,label){
  return waitFor(done=>{
    const act=$('#cAct');let sel=[0,0];
    const finish=v=>{act.innerHTML='';document.body.classList.remove('padopen');document.removeEventListener('keydown',kd);done(v)};
    const padHTML=()=>`<div class="dpad"><span class="pl">굴려서 나온 숫자를 눌러 주세요</span>
      ${[0,1].map(d=>`<div class="drow"><em>${d?'둘째':'첫째'}</em>${[1,2,3,4,5,6].map(v=>`<button type="button" class="dbtn${sel[d]===v?' on':''}" data-d="${d}" data-v="${v}" aria-label="${d?'둘째':'첫째'} 주사위 ${v}">${pipHTML(v)}</button>`).join('')}</div>`).join('')}
      <button class="btn main" id="padGo" ${sel[0]&&sel[1]?'':'disabled'}>${sel[0]&&sel[1]?`${sel[0]+sel[1]}칸 이동하기`:'두 숫자를 골라 주세요'}</button>
      ${mode==='both'?'<button class="linkbtn" id="toScreen">화면 주사위로 굴릴게요</button>':''}</div>`;
    const showPad=()=>{document.body.classList.add('padopen');act.innerHTML=padHTML();
      $$('.dbtn',act).forEach(b=>b.onclick=()=>{sel[+b.dataset.d]=+b.dataset.v;showPad()});
      $('#padGo',act).onclick=()=>finish([sel[0],sel[1]]);
      if($('#toScreen',act))$('#toScreen',act).onclick=showBtn};
    const showBtn=()=>{document.body.classList.remove('padopen');
      act.innerHTML=`<button class="btn main" id="rollBtn">🎲 주사위 굴리기</button>${mode==='both'?'<button class="linkbtn" id="toPad">실물 주사위로 굴렸어요</button>':''}`;
      const rb=$('#rollBtn',act);rb.onclick=()=>finish('screen');rb.focus({preventScroll:true});
      if($('#toPad',act))$('#toPad',act).onclick=showPad};
    const kd=e=>{if((e.key===' '||e.key==='Enter')&&!$('#ov')&&$('#rollBtn')&&document.activeElement?.tagName!=='INPUT'){e.preventDefault();finish('screen')}};
    document.addEventListener('keydown',kd);
    setMsg(label||`<b>${esc(p.name)}</b>, 주사위를 굴려 주세요.`);
    mode==='real'?showPad():showBtn();
  });
}
async function rollDice(p,now,label){
  let v='screen';
  if(p.ai){if(!now){setMsg(`${esc(IGA(p.name))} 주사위를 굴려요…`);await sleep(750*SPD())}}
  else if(!(now&&G.set.dice==='screen'))v=await waitDiceInput(p,G.set.dice,label);
  const d1=$('#d1'),d2=$('#d2');d1.classList.remove('dbl');d2.classList.remove('dbl');
  let a,b;
  if(v==='screen'){a=1+(Math.random()*6|0);b=1+(Math.random()*6|0);SND.play('roll');
    if(SPD()>0){d1.classList.add('roll');d2.classList.add('roll');
      for(let k=0;k<8;k++){drawDie(d1,1+(Math.random()*6|0));drawDie(d2,1+(Math.random()*6|0));await sleep(60)}
      d1.classList.remove('roll');d2.classList.remove('roll')}}
  else[a,b]=v;
  drawDie(d1,a);drawDie(d2,b);if(a===b){d1.classList.add('dbl');d2.classList.add('dbl')}
  setMsg(`<b>${a} + ${b} = ${a+b}</b>${a===b?' · 더블!':''}`);log(`${p.name}: 주사위 ${a}+${b}${a===b?' (더블)':''}${v==='screen'?'':' · 실물'}`,p);
  await sleep(320*SPD());return[a,b];
}

/* ================= 돈 ================= */
async function charge(p,amt,to,why){
  if(amt<=0)return true;
  if(p.money<amt)await liquidate(p,amt);
  const toP=to&&typeof to==='object', toName=toP?to.name:to==='pot'?'헌금함':'은행';
  if(p.money<amt){const rest=p.money;p.money=0;if(toP){to.money+=rest;float(to,rest)}else if(to==='pot')G.pot+=rest;
    log(`${p.name}: ${why} ${fmt(amt)}을 다 내지 못했어요`,p);await bankrupt(p,toP?to:null);return false}
  p.money-=amt;float(p,-amt);if(toP){to.money+=amt;float(to,amt)}else if(to==='pot')G.pot+=amt;
  SND.play('pay');log(`${p.name} → ${toName}: ${why} ${fmt(amt)}`,p);renderPlayers();renderCenter();return true;
}
async function liquidate(p,need){
  const sold=[];
  while(p.money<need){
    const bs=landsOf(p).filter(i=>G.own[i].l>0).sort((a,b)=>upCost(a)-upCost(b));
    if(!bs.length)break;const i=bs[0],v=r10(upCost(i)/2);G.own[i].l--;p.money+=v;sold.push(`${TILES[i].name} ${LV[G.own[i].l+1]} (+${v})`);
  }
  while(p.money<need){
    const ls=landsOf(p).sort((a,b)=>TILES[a].price-TILES[b].price);
    if(!ls.length)break;const i=ls[0],v=r10(TILES[i].price/2);delete G.own[i];p.money+=v;sold.push(`${TILES[i].name} 땅 (+${v})`);
  }
  if(!sold.length)return;
  log(`${p.name}: 빚을 갚으려고 ${sold.length}건을 반값에 팔았어요`,p);renderAll();
  await notice(p,{pic:'💸',kick:'반값 매각',title:`${IGA(p.name)} 재산을 팔았어요`,body:`<p>달란트가 모자라서 건물과 땅을 반값에 팔았습니다.</p><p>${sold.map(esc).join('<br>')}</p>`,tone:'#ff9d9d'});
}
async function bankrupt(p,creditor){
  p.bankrupt=true;p.money=0;for(const i of landsOf(p))delete G.own[i];
  SND.play('bad');log(`${p.name}: 파산했어요`,p);renderAll();
  await modal({pic:'😭',kick:'파산',title:`${IGA(p.name)} 파산했어요`,body:`<p>${creditor?esc(creditor.name)+'에게 남은 달란트를 모두 주고, ':''}가진 땅은 모두 주인 없는 땅이 되었습니다.</p>`,tone:'#ff9d9d',buttons:[{label:'확인',value:true,primary:true}],...(G.players.some(q=>!q.ai)?{}:{auto:true,autoMs:1800})});
}

/* ================= 칸에 도착 ================= */
async function land(p){
  if(p.bankrupt)return;
  const i=p.pos,t=TILES[i];renderAll();
  switch(t.t){
    case 'start':break;
    case 'city':case 'spot':await onProperty(p,i);break;
    case 'card':if(G.set.cards)await drawCard(p);else{toast('말씀 카드를 끈 상태라 쉬어 가요');log(`${p.name}: 카드 칸에서 쉬어 가요`,p)}break;
    case 'quiz':
      if(G.set.quizTile){setMsg('❓ 말씀 퀴즈 칸!');const r=await quiz(p,{kick:'❓ 말씀 퀴즈 칸',sub:'맞히면 쉬움 100 · 보통 150 · 어려움 200 달란트'});if(r.ok)gain(p,QREWARD[r.lv],'말씀 퀴즈 정답')}
      else gain(p,100,'말씀 묵상');
      break;
    case 'jail':await goJail(p,'광야 칸에 도착했어요');break;
    case 'pot':if(G.pot>0){const v=G.pot;G.pot=0;renderCenter();gain(p,v,'오병이어 헌금함');await notice(p,{pic:'🧺',kick:'오병이어',title:`헌금함의 ${fmt(v)} 달란트를 받았어요`,body:'<p>"다 배불리 먹은 후에" 남은 조각을 모으니 열두 바구니에 찼습니다.</p><p class="ref">요 6:12-13</p>',tone:'var(--g7)'})}else{toast('헌금함이 비어 있어요');log(`${p.name}: 헌금함이 비어 있어요`,p)}break;
    case 'fly':await fly(p);break;
    case 'tithe':{const v=Math.max(10,r10(p.money*.1));setMsg(`🪙 십일조 ${fmt(v)} 달란트`);await charge(p,v,'pot','십일조');if(!p.bankrupt)toast(`${IGA(p.name)} 십일조 ${fmt(v)}을 헌금함에 넣었어요`);break}
  }
  renderAll();
}
function tollTable(i,curL){
  const t=TILES[i];
  if(t.t==='spot')return `<table class="ttab"><tr${curL===0?' class="cur"':''}><td>명소 1곳</td><td>50</td></tr><tr${curL===1?' class="cur"':''}><td>홍해·요단강 모두</td><td>150</td></tr></table>`;
  return `<table class="ttab">${LV.map((n,l)=>`<tr${l===curL?' class="cur"':''}><td>${BLD[l]||'🚩'} ${n}${l?` (짓는 값 ${upCost(i)})`:''}</td><td>통행료 ${r10(t.price*MULT[l])}</td></tr>`).join('')}</table>${G&&G.set.monopoly?'<p class="ref">같은 색 땅을 모두 가지면 통행료 2배</p>':''}`;
}
async function onProperty(p,i){
  const t=TILES[i],o=G.own[i],grp=t.t==='city'?GROUPS[t.g].n:'명소',tone=t.t==='city'?GROUPS[t.g].c:'#86d5ea';
  if(!o){
    if(p.money<t.price){toast(`${REUL(t.name)} 살 달란트가 모자라요`);log(`${p.name}: ${t.name} 살 달란트가 모자라요`,p);return}
    let buy;
    if(p.ai){buy=p.money-t.price>=aiReserve();await sleep(450*SPD())}
    else buy=(await modal({pic:t.pic,kick:`${grp}`,title:`${REUL(t.name)} 살까요?`,tone,
      body:`<p>${esc(t.note)}</p><p class="ref">${t.ref}</p>${tollTable(i,0)}<p>사고 나면 <b>${fmt(p.money-t.price)}</b> 달란트가 남아요.</p>`,
      buttons:[{label:`🚩 ${t.price} 달란트로 사기`,value:'buy',primary:true},{label:'사지 않고 지나가기',value:'no'}]}))==='buy';
    if(buy){p.money-=t.price;G.own[i]={o:p.id,l:0};float(p,-t.price);SND.play('build');log(`${p.name}: ${REUL(t.name)} ${t.price}에 샀어요 🚩`,p);renderAll();popTile(i);toast(`${p.tok} ${IGA(p.name)} ${REUL(t.name)} 샀어요!`)}

  }

    const c=upCost(i);
    if(p.money<c){toast(`${LV[o.l+1]}을 지을 달란트가 모자라요`);return}
    let up;
    if(p.ai){up=p.money-c>=aiReserve()-50;await sleep(450*SPD())}
    else up=(await modal({pic:BLD[o.l+1],kick:`${t.name} · 내 땅`,title:`${t.name}에 ${REUL(LV[o.l+1])} 지을까요?`,tone,
      body:`<p>통행료가 <b>${fmt(tollOf(i))}</b>에서 <b>${fmt(r10(t.price*MULT[o.l+1])*(G.set.monopoly&&hasGroup(p.id,t.g)?2:1))}</b>${batchim(String(r10(t.price*MULT[o.l+1])))?'으로':'로'} 올라요.</p>${tollTable(i,o.l)}`,
      buttons:[{label:`${BLD[o.l+1]} ${c} 달란트로 짓기`,value:'up',primary:true},{label:'다음에 짓기',value:'no'}]}))==='up';
    if(up){p.money-=c;o.l++;float(p,-c);SND.play('build');log(`${p.name}: ${t.name}에 ${REUL(LV[o.l])} 지었어요 ${BLD[o.l]}`,p);renderAll();popTile(i);toast(`${BLD[o.l]} ${IGA(p.name)} ${t.name}에 ${REUL(LV[o.l])} 지었어요!`)}
    return;
  }
  const owner=byId(o.o);let amt=tollOf(i);
  setMsg(`<b>${esc(owner.name)}</b>의 ${esc(t.name)} · 통행료 ${fmt(amt)}`);
  if(p.ark>0){
    let use;
    if(p.ai){use=amt>=100;await sleep(400*SPD())}
    else use=(await modal({pic:'🚢',kick:'노아의 방주',title:`통행료 ${fmt(amt)}, 방주 카드를 쓸까요?`,tone:'#86d5ea',body:`<p>방주 카드를 쓰면 이번 통행료를 내지 않아요. 남은 방주 카드: ${p.ark}장</p>`,
      buttons:[{label:'방주 카드로 면제받기',value:'ark',primary:true},{label:G.set.tollQuiz?'카드는 아끼고 말씀 찬스 도전':'카드는 아끼고 통행료 내기',value:'pay'}]}))==='ark';
    if(use){p.ark--;SND.play('card');log(`${p.name}: 방주 카드로 ${t.name} 통행료를 면제받았어요`,p);toast(`🚢 ${IGA(p.name)} 방주 카드를 썼어요`);renderPlayers();return}
  }
  if(G.set.tollQuiz){
    const r=await quiz(p,{kick:`💡 말씀 찬스 · ${esc(owner.name)}의 ${t.name}`,sub:`맞히면 통행료 ${fmt(amt)} → ${fmt(r10(amt/2))}`});
    if(r.ok)amt=r10(amt/2);
  }
  await charge(p,amt,owner,`${t.name} 통행료`);
  if(!p.bankrupt)toast(`${IGA(p.name)} ${owner.name}에게 통행료 ${fmt(amt)}을 냈어요`);
}
async function drawCard(p){
  if(!G.deck.length)G.deck=shuffle(CARDS.map(c=>c.id));
  const c=CARD_BY[G.deck.pop()];SND.play('card');log(`${p.name}: 말씀 카드 「${c.t}」`,p);
  await notice(p,{pic:'📜',kick:'말씀 카드',tone:'var(--g7)',autoMs:2300,title:c.t,body:`<p>${esc(c.d)}</p><p class="ref">${c.r}</p>`});
  await c.run(p);renderAll();
}
function aiFly(p){
  let best=START,score=150;
  TILES.forEach((t,i)=>{if(i===FLY||i===JAIL)return;let s=-1;const o=G.own[i];
    if(t.t==='city'||t.t==='spot'){if(!o&&p.money-t.price>=aiReserve())s=t.price;else if(o&&o.o===p.id&&t.t==='city'&&o.l<3&&p.money-upCost(i)>=aiReserve())s=upCost(i)+60}
    else if(t.t==='pot')s=G.pot;else if(t.t==='quiz')s=110;
    if(s>score){score=s;best=i}});
  return best;
}
function pickTile(){
  return waitFor(done=>{$('#board').classList.add('picking');$('#pickBar').hidden=false;
    window.__pick=i=>{if(i===FLY)return toast('다른 칸을 골라 주세요');$('#board').classList.remove('picking');$('#pickBar').hidden=true;window.__pick=null;done(i)}});
}
async function fly(p){
  let dest;
  if(p.ai){dest=aiFly(p);await sleep(700*SPD());toast(`🔥 ${IGA(p.name)} 불수레를 타고 ${RO(TILES[dest].name)} 날아가요`)}
  else{await modal({pic:'🔥',kick:'엘리야의 불수레',tone:'#ffb08a',title:'원하는 칸으로 날아가요',body:'<p>"불수레와 불말들이 두 사람을 갈라놓고 엘리야가 회오리바람으로 하늘로 올라가더라"</p><p class="ref">왕하 2:11</p><p>확인을 누른 뒤 보드에서 날아갈 칸을 누르세요. 가는 길에 출발 칸을 지나면 축복금을 받아요.</p>',buttons:[{label:'칸 고르기',value:true,primary:true}]});
    setMsg('🔥 날아갈 칸을 보드에서 눌러 주세요.');dest=await pickTile()}
  log(`${p.name}: 불수레를 타고 ${RO(TILES[dest].name)}`,p);
  await moveTo(p,dest,true);await land(p);
}
async function wilderness(p){
  setMsg(`<b>${esc(p.name)}</b>, 광야에 있어요 (남은 차례 ${p.jail})`);
  let ch;
  if(p.ai){ch=p.song>0?'song':G.set.jailQuiz?'quiz':(p.money-100>=aiReserve()?'pay':'dice');await sleep(600*SPD())}
  else ch=await modal({pic:'🌵',kick:`광야 · 남은 차례 ${p.jail}`,tone:'#ffcf8a',title:'광야를 어떻게 벗어날까요?',
    body:`<p>${G.set.jailQuiz?'말씀 퀴즈를 맞히면 광야를 벗어나 바로 주사위를 굴립니다. ':''}주사위를 골라 더블이 나오면 나온 수만큼 바로 이동합니다.</p>`,
    buttons:[...(G.set.jailQuiz?[{label:'❓ 말씀 퀴즈로 탈출',value:'quiz',primary:true}]:[]),{label:'🎲 주사위 굴리기',value:'dice',note:'더블이면 탈출',primary:!G.set.jailQuiz},
      ...(p.song>0?[{label:'🎵 찬송 카드 쓰기',value:'song',note:`${p.song}장`}]:[]),
      {label:'🪙 헌금 100 내고 나가기',value:'pay',disabled:p.money<100}]});
  if(ch==='song'){p.song--;p.jail=0;SND.play('card');log(`${p.name}: 찬송 카드로 광야를 벗어났어요`,p);toast('🎵 옥문이 열렸어요!');renderPlayers();return'free'}
  if(ch==='pay'){await charge(p,100,'pot','광야 탈출 헌금');if(p.bankrupt)return'stay';p.jail=0;renderPlayers();return'free'}
  if(ch==='quiz'){const r=await quiz(p,{kick:'🌵 광야 탈출 퀴즈',sub:'맞히면 광야를 벗어나 주사위를 굴려요'});
    if(r.ok){p.jail=0;log(`${p.name}: 퀴즈를 맞혀 광야를 벗어났어요`,p);renderPlayers();return'free'}}
  else{const[a,b]=await rollDice(p,true,`<b>${esc(p.name)}</b>, 더블이 나오면 광야를 벗어나요!`);
    if(a===b){p.jail=0;log(`${p.name}: 더블! 광야를 벗어났어요`,p);renderPlayers();await moveBy(p,a+b);await land(p);return'moved'}}
  p.jail--;log(`${p.name}: 광야에 머뭅니다${p.jail===0?' (다음 차례에는 나가요)':''}`,p);renderPlayers();
  await sleep(500*SPD());return'stay';
}

/* ================= 차례 진행 ================= */
async function takeTurn(p){
  G.dbl=0;renderAll();$('#d1').classList.remove('dbl');$('#d2').classList.remove('dbl');
  if(p.skip){p.skip=0;log(`${p.name}: 안식일이라 한 번 쉽니다`,p);setMsg(`<b>${esc(p.name)}</b>, 안식일이라 이번 차례는 쉬어요.`);toast(`🕯️ ${IGA(p.name)} 안식일이라 쉬어요`);await sleep(1200*SPD());return}
  if(p.jail>0){const r=await wilderness(p);if(r!=='free')return}
  for(;;){
    const[a,b]=await rollDice(p),dbl=a===b&&G.set.doubleAgain;
    if(dbl&&++G.dbl>=3){await goJail(p,'더블을 세 번 연속으로 던졌어요');return}
    await moveBy(p,a+b);await land(p);
    if(!dbl||p.jail>0||p.bankrupt||p.skip||alive().length<2)return;
    toast('🎲 더블! 한 번 더 굴려요');setMsg(`<b>더블!</b> ${esc(p.name)}, 한 번 더 굴려요.`);
  }
}
function nextPlayer(){
  const n=G.players.length;
  for(let k=0;k<n;k++){G.turn=(G.turn+1)%n;if(G.turn===0)G.round++;if(!G.players[G.turn].bankrupt)return}
}
function save(){if(G&&!G.over)store.set('save',G);else store.del('save')}
async function gameLoop(){
  const id=RUN;
  try{
    while(!G.over){
      const p=cur();
      if(p.bankrupt){nextPlayer();continue}
      if(G.round>roundLimit())break;
      save();renderAll();
      await takeTurn(p);
      if(alive().length<=1)break;
      nextPlayer();
      if(G.round>roundLimit())break;
    }
    G.over=true;save();renderAll();await showEnd();
  }catch(e){if(e!==ABORT){console.error(e);if(id===RUN)toast('문제가 생겨 게임을 멈췄어요. 설정에서 새 게임을 시작해 주세요.',5000)}}
}
async function showEnd(){
  const rank=G.players.slice().sort((a,b)=>(a.bankrupt-b.bankrupt)||worth(b)-worth(a)), w=rank[0];
  SND.play('good');$('#cAct').innerHTML='';setMsg(`🏆 <b>${esc(w.name)}</b> 승리!`);
  const v=await modal({pic:'🏆',kick:alive().length<=1?'한 명만 남았어요':'정해진 라운드가 끝났어요',tone:'var(--g7)',title:`${esc(IGA(w.name))} 이겼어요!`,
    body:`<ol class="rank">${rank.map((p,k)=>`<li><span class="no">${['🥇','🥈','🥉'][k]||k+1}</span><span class="tok" style="--pc:${p.col}">${p.tok}</span><span class="who">${esc(p.name)}<small>${p.bankrupt?'파산':`현금 ${fmt(p.money)} · 땅 ${landsOf(p).length}곳`}</small></span><span class="amt">${p.bankrupt?'-':fmt(worth(p))}</span></li>`).join('')}</ol>
      <p class="ref">총자산은 현금과 땅값, 지은 건물값을 모두 더한 금액입니다.</p>`,
    buttons:[{label:'같은 설정으로 다시 하기',value:'again',primary:true},{label:'처음 화면으로',value:'home'}]});
  if(v==='again')newGame(G.setup);else showSetup();
}

/* ================= 보드 칸 정보 ================= */
function onTileClick(i){
  if(window.__pick){window.__pick(i);return}
  if($('#ov'))return;
  const t=TILES[i],o=G&&G.own[i];
  let body='',kick='',tone='var(--sky-2)';
  if(t.t==='city'||t.t==='spot'){
    kick=t.t==='city'?GROUPS[t.g].n:'명소';tone=t.t==='city'?GROUPS[t.g].c:'#86d5ea';
    const ow=o?byId(o.o):null;
    body=`<p>${esc(t.note)}</p><p class="ref">${t.ref}</p><p>땅값 <b>${t.price}</b> · ${ow?`주인 <b style="color:${ow.col}">${ow.tok} ${esc(ow.name)}</b> · ${BLD[o.l]||'🚩'} ${LV[o.l]} · 지금 통행료 <b>${tollOf(i)}</b>`:'주인 없음'}</p>${tollTable(i,o?(t.t==='spot'?(tollOf(i)>50?1:0):o.l):-1)}`;
  }else{
    const D={start:`출발 칸을 지나거나 이 칸에 도착하면 축복금 ${G?G.set.salary:200} 달란트를 받습니다.`,
      card:'말씀 카드를 한 장 뽑아 적힌 대로 합니다. 방주 카드와 찬송 카드는 보관했다가 필요할 때 씁니다.',
      quiz:'말씀 퀴즈를 맞히면 쉬움 100, 보통 150, 어려움 200 달란트를 받습니다.',
      jail:'도착하면 다음 차례부터 광야에 머뭅니다. 말씀 퀴즈를 맞히거나, 더블이 나오거나, 헌금 100을 내면 나올 수 있습니다.',
      pot:'헌금함에 모인 달란트를 모두 받습니다. 십일조와 벌금이 헌금함에 쌓입니다.',
      fly:'엘리야처럼 불수레를 타고 원하는 칸으로 바로 날아갑니다.',
      tithe:'가진 달란트의 10%를 헌금함에 넣습니다.'};
    kick='특별 칸';body=`<p>${D[t.t]}</p>`;
  }
  openInfo(kick,`${t.pic} ${t.name}`,body,tone);
}
function openInfo(kick,title,body,tone,wide){
  const {ov,seq}=openBox(`<div class="kick">${kick}</div><h3>${esc(title)}</h3><div class="mbody">${body}</div><div class="mbtns"><button class="btn wide" id="infoClose">닫기</button></div>`,tone,wide);
  const close=()=>{closeModal(seq);document.removeEventListener('keydown',kd)};
  const kd=e=>{if($('#ov')!==ov){document.removeEventListener('keydown',kd);return}if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();close()}};
  $('#infoClose',ov).onclick=close;ov.onclick=e=>{if(e.target===ov)close()};document.addEventListener('keydown',kd);setTimeout(()=>$('#infoClose',ov).focus({preventScroll:true}),30);
  return ov;
}
function rulesHTML(){
  return `<ol class="rules">
  <li>차례가 되면 <b>주사위 두 개</b>를 굴려 나온 수만큼 화살표 방향으로 이동합니다. 실물 주사위를 굴렸다면 나온 숫자를 눌러 입력하면 됩니다.</li>
  <li>주인 없는 땅에 도착하면 <b>🚩 살 수</b> 있습니다. 산 땅은 주인의 색으로 칠해지고 깃발이 꽂힙니다.</li>
  <li>내 땅에 다시 도착하면 <b>⛺ 장막 → 🏠 집 → 🏰 성</b> 순서로 한 단계씩 지을 수 있습니다. 건물이 클수록 통행료가 많아집니다.</li>
  <li>다른 사람의 땅에 도착하면 <b>통행료</b>를 냅니다. 말씀 찬스 퀴즈를 맞히면 통행료가 반으로 줄어듭니다.</li>
  <li>같은 시대(같은 색)의 땅을 모두 가지면 통행료가 <b>2배</b>가 됩니다. 명소인 홍해와 요단강을 모두 가지면 통행료가 50에서 150으로 오릅니다.</li>
  <li>출발 칸을 지나거나 도착하면 <b>축복금</b>을 받습니다.</li>
  <li>달란트가 모자라면 건물과 땅을 <b>반값</b>에 팔아 갚고, 그래도 모자라면 파산합니다.</li>
  <li>정해진 라운드가 끝나면 <b>총자산</b>(현금 + 땅값 + 건물값)이 가장 많은 사람이 이깁니다.</li>
  </ol>
  <div class="legend">${GROUPS.map(g=>`<span style="--gc:${g.c}"><i></i>${g.n}</span>`).join('')}</div>
  <p class="ref">설정에서 퀴즈 제한 시간, 주사위 방식, 규칙을 바꿀 수 있어요. 보드의 칸을 누르면 그 장소에 얽힌 성경 이야기를 볼 수 있어요.</p>`;
}
const showRules=()=>{if(!$('#ov'))openInfo('게임 방법','📖 성경 부루마블 규칙',rulesHTML(),'var(--g7)',true)};

/* ================= 게임 중 설정 ================= */
function openMenu(){
  if($('#ov'))return;
  const {ov,seq}=openBox(`<div class="kick">⚙️ 설정</div><h3>게임 설정</h3><div class="mbody">${settingsHTML(G.set,true)}</div>
    <div class="mbtns"><button class="btn main wide" id="mClose">설정 닫고 계속하기</button><button class="btn wide" id="mNew">새 게임 준비하기</button></div>`,'var(--sky-2)',true);
  bindSettings(ov,G.set,()=>{renderAll();save()});
  const close=()=>closeModal(seq);
  $('#mClose',ov).onclick=close;ov.onclick=e=>{if(e.target===ov)close()};
  const nb=$('#mNew',ov);nb.onclick=()=>{if(nb.dataset.sure){close();abortAll();save();showSetup()}else{nb.dataset.sure=1;nb.textContent='한 번 더 누르면 처음 화면으로 가요 (지금 게임은 저장돼요)'}};
}
function openLog(){if($('#ov')||!G)return;openInfo('진행 기록','📒 지금까지 있었던 일',`<ul class="flog">${G.log.map(e=>`<li style="${e.c?'--pc:'+e.c:''}"><i></i><span>${esc(e.m)}</span></li>`).join('')}</ul>`,'var(--sky-2)',true)}
function drawSoundBtn(){const b=$('#bSound');b.innerHTML=(PREF.sound?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>')+`<span class="lb">${PREF.sound?'소리 켬':'소리 끔'}</span>`;b.setAttribute('aria-label',PREF.sound?'효과음 끄기':'효과음 켜기')}

/* ================= 화면 크기 ================= */
function fit(){
  const W=innerWidth,H=innerHeight,tab=W>=760&&W/H>=1.15;
  document.body.classList.toggle('tab',tab);
  const hdr=$('#hdr').offsetHeight;let bs,pw=0;
  if(tab){const gap=14,side=32;pw=Math.max(180,Math.min(300,W*.21));bs=Math.min(H-hdr-20,W-side-2*gap-2*pw);bs=Math.max(300,bs);pw=Math.min(340,Math.floor((W-side-2*gap-bs)/2))}
  else bs=Math.min(W-32,780);
  bs=Math.floor(Math.max(268,bs));
  document.documentElement.style.setProperty('--bs',bs+'px');document.documentElement.style.setProperty('--pw',pw+'px');
  document.body.classList.toggle('small',bs<520);
}
addEventListener('resize',fit);

/* ================= 처음 화면 ================= */
const loadSetup=()=>{const s=store.get('setup',{});return{players:Array.isArray(s.players)&&s.players.length>=2?s.players:[{name:DEF_NAMES[0],ai:false,tok:0},{name:DEF_NAMES[1],ai:true,tok:1}],set:Object.assign({},DEF_SET,s.set||{})}};
let SETUP=loadSetup();
const saveSetup=()=>store.set('setup',SETUP);
function showSetup(){
  abortAll();G=null;document.body.appendChild($('#toast'));
  $('#game').hidden=true;$('#bMenu').hidden=true;$('#bLog').hidden=true;const s=$('#setup');s.hidden=false;
  const saved=store.get('save',null);
  s.innerHTML=`<div class="logo"><div class="big">${logoHTML('성경 부루마블')}</div>
    <p>주사위를 굴려 우르에서 예루살렘까지 성경의 땅을 여행해요. 말씀 퀴즈를 맞히면 통행료가 반으로 줄어요! 🐑🕊️🐟🦁</p></div>
    <div class="scols"><div class="scol">
      ${saved&&saved.players?`<button class="btn mint big wide" id="sResume">이어하기 <small>${saved.players.map(p=>esc(p.name)).join(' · ')} · 라운드 ${saved.round}</small></button>`:''}
      <section class="box"><h2>👥 플레이어 <small>2~4명 · 동물을 누르면 바뀌어요</small></h2><div id="sPlayers"></div></section>
      <button class="btn main big wide" id="sStart">🎲 게임 시작</button>
      <button class="btn wide" id="sRules">📖 게임 방법 보기</button>
    </div><div class="scol"><section class="box"><h2>⚙️ 게임 설정 <small>게임 중에도 바꿀 수 있어요</small></h2><div id="sSets">${settingsHTML(SETUP.set,false)}</div></section></div></div>`;
  drawPlayers();bindSettings($('#sSets'),SETUP.set,saveSetup);
  $('#sStart').onclick=()=>newGame(SETUP);
  $('#sRules').onclick=showRules;
  if($('#sResume'))$('#sResume').onclick=()=>resume(saved);
  scrollTo(0,0);
}
function drawPlayers(){
  const box=$('#sPlayers'),P=SETUP.players;
  box.innerHTML=P.map((p,k)=>`<div class="prow">
    <button type="button" class="tok" style="--pc:${SEAT[k]}" data-tok="${k}" aria-label="${k+1}번 토큰 바꾸기">${TOKENS[p.tok]}</button>
    <input id="pname${k}" maxlength="8" value="${esc(p.name)}" aria-label="${k+1}번 플레이어 이름">
    <div class="seg" data-ai="${k}"><button type="button" data-v="0" class="${p.ai?'':'on'}">🙂 사람</button><button type="button" data-v="1" class="${p.ai?'on':''}">🤖 컴퓨터</button></div>
    ${P.length>2?`<button type="button" class="xbtn" data-del="${k}" aria-label="${k+1}번 플레이어 빼기">×</button>`:''}</div>`).join('')+
    (P.length<4?'<button type="button" class="addp" id="sAdd">+ 플레이어 추가</button>':'');
  $$('[data-tok]',box).forEach(b=>b.onclick=()=>{const k=+b.dataset.tok,taken=P.map(p=>p.tok);let t=P[k].tok;do{t=(t+1)%TOKENS.length}while(taken.includes(t)&&t!==P[k].tok);P[k].tok=t;drawPlayers();saveSetup()});
  $$('input',box).forEach((inp,k)=>inp.oninput=()=>{P[k].name=inp.value;saveSetup()});
  $$('[data-ai]',box).forEach(seg=>seg.onclick=e=>{const b=e.target.closest('button');if(!b)return;P[+seg.dataset.ai].ai=b.dataset.v==='1';drawPlayers();saveSetup()});
  $$('[data-del]',box).forEach(b=>b.onclick=()=>{P.splice(+b.dataset.del,1);drawPlayers();saveSetup()});
  const add=$('#sAdd');if(add)add.onclick=()=>{const k=P.length,taken=P.map(p=>p.tok);P.push({name:DEF_NAMES[k],ai:true,tok:TOKENS.findIndex((_,t)=>!taken.includes(t))});drawPlayers();saveSetup()};
}

/* ================= 게임 시작 ================= */
function newGame(setup){
  abortAll();SND.init();
  const st=JSON.parse(JSON.stringify(setup));st.set=Object.assign({},DEF_SET,st.set);
  G={v:2,setup:st,set:Object.assign({},st.set),
    players:st.players.map((p,k)=>({id:k,name:(p.name||'').trim()||DEF_NAMES[k],ai:!!p.ai,tok:TOKENS[p.tok]||TOKENS[k],col:SEAT[k],money:st.set.money,pos:0,jail:0,skip:0,ark:0,song:0,bankrupt:false})),
    own:{},pot:0,turn:0,round:1,dbl:0,deck:shuffle(CARDS.map(c=>c.id)),used:{easy:[],normal:[],hard:[]},log:[],over:false};
  log('새 게임을 시작했어요. 우르에서 예루살렘까지 여행을 떠나요!');
  enterGame();
}
function resume(saved){abortAll();G=saved;G.over=false;G.set=Object.assign({},DEF_SET,G.set||{});if(!G.setup.set)G.setup.set=Object.assign({},G.set);log('저장된 게임을 이어서 시작해요');enterGame()}
function enterGame(){
  $('#setup').hidden=true;$('#game').hidden=false;$('#bMenu').hidden=false;$('#bLog').hidden=false;
  buildBoard();$('#center').appendChild($('#toast'));fit();renderAll();scrollTo(0,0);gameLoop();
}

/* ================= 시작 ================= */
$('#bRules').onclick=showRules;
$('#bLog').onclick=openLog;
$('#bSound').onclick=()=>{PREF.sound=!PREF.sound;savePref();drawSoundBtn();if(PREF.sound){SND.init();SND.play('coin')}};
$('#bMenu').onclick=openMenu;
drawSoundBtn();fit();
window.claude?.hot?.snapshot?.(()=>({G:G&&!G.over?JSON.parse(JSON.stringify(G)):null}));
const boot=data=>{if(data&&data.G&&data.G.players)resume(data.G);else showSetup()};
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
