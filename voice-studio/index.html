<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* 카카오톡·라인 같은 앱 안 브라우저로 열면 바로 기기의 기본 브라우저로 다시 엶 (홈 화면 설치·저장된 정보가 한 브라우저에 모이게) */
(function(){var u=navigator.userAgent,h=location.href,ios=/iPhone|iPad|iPod/i.test(u);
if(/KAKAOTALK/i.test(u)){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(h);setTimeout(function(){location.href=ios?'kakaoweb://closeBrowser':'kakaotalk://inappbrowser/close';},1500);}
else if(/ Line\//i.test(u)&&!/openExternalBrowser=1/.test(h)){location.href=h+(h.indexOf('?')<0?'?':'&')+'openExternalBrowser=1';}
else if(/Android/i.test(u)&&/NAVER\(inapp|Instagram|FBAN|FBAV|everytimeApp|BAND\//i.test(u)){location.href='intent://'+h.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end';}
})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="중계 녹음실">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>중계 녹음실</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="hdr">
  <h1>중계 녹음실<small>야구 중계 음성 만들기</small></h1>
  <button id="hFS" class="hb" aria-label="전체화면"></button>
  <button id="hSet" class="hb" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main>
  <section id="banner" class="banner" hidden>
    <p><b>홈 화면에 설치</b>하면 아이콘으로 바로 열고, 화면을 넓게 쓸 수 있습니다.</p>
    <div class="row wrap"><button id="bInst" class="btn primary">설치하기</button><button id="bFs" class="btn">전체화면</button><button id="bLater" class="btn">다음에</button></div>
  </section>
  <section class="card">
    <div class="line"><span id="keyState"></span><button id="keyBtn" class="btn sm">API 키 바꾸기</button></div>
    <div class="line"><span id="voiceState"></span><button id="voiceBtn" class="btn sm">목소리·모델</button></div>
  </section>
  <section class="card">
    <p id="prog"></p>
    <div class="track"><div id="bar"></div></div>
    <p id="status" class="info" role="status" aria-live="polite"></p>
    <div class="row wrap"><button id="run" class="btn primary">자동으로 차례대로 만들기</button><button id="zip" class="btn" disabled>잘린 녹음 zip으로 받기</button></div>
    <p class="hint">묶음 하나(최대 20줄)를 한 번에 녹음하고, 문장 길이와 쉬는 곳을 따져 줄마다 자릅니다. 만든 녹음은 이 기기에 저장되어, 한도에 걸려 멈춰도 다음에 이어서 만듭니다. AI Studio에서 직접 만든 파일은 묶음을 눌러 "파일 넣기"로 넣으면 똑같이 잘립니다.</p>
  </section>
  <div id="filters" class="filters" role="group" aria-label="묶음 보기">
    <button data-f="all">전체</button><button data-f="need">확인 필요</button><button data-f="none">안 만듦</button>
  </div>
  <ul id="list" class="list"></ul>
  <button id="instBtn" class="btn wide">홈 화면에 설치하기</button>
</main>
<div id="sheets"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/cut.js"></script>
<script src="js/wavzip.js"></script>
<script src="js/app.js"></script>
</body>
</html>
