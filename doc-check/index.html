<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f99">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기안 점검판">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>기안 점검판</title>
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#1b2733; --muted:#586677; --line:#d5dce5; --line2:#e8edf3;
  --accent:#1f5f99; --accent-bg:#e5eff9; --accent-ink:#ffffff;
  --high:#a61b1b; --high-bg:#fdecea; --mid:#80560a; --mid-bg:#fff3d1; --low:#4a5563; --low-bg:#eceff3;
  --ok:#1d6b3a; --ok-bg:#e4f4ea;
  --font:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column}

/* 머리줄 */
.hdr{flex:none;height:54px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--card);border-bottom:1px solid var(--line)}
.hdr .name{font-weight:700;font-size:17px;white-space:nowrap;margin-right:6px}
.tabs{display:flex;gap:4px}
.tab{height:36px;padding:0 14px;border:1px solid transparent;border-radius:8px;background:none;font-weight:600;color:var(--muted);white-space:nowrap}
.tab:hover{background:var(--line2)}
.tab.on{background:var(--accent-bg);color:var(--accent);border-color:#bcd5ec}
.sp{flex:1}
.stamp{color:var(--muted);font-size:13px;white-space:nowrap}
.btn{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--line2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){background:#194f82}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.btn.icon{width:36px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.btn svg{width:18px;height:18px}
.btn:focus-visible,.tab:focus-visible,.li:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7fb0dc;outline-offset:1px}

.main{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 14px 12px}
.bar{flex:none;display:flex;align-items:center;gap:8px;min-height:30px;margin-bottom:8px;padding:6px 10px;border-radius:8px;background:var(--mid-bg);color:var(--mid);font-size:14px}
.bar .btn{margin-left:auto}
.split{flex:1;min-height:0;display:flex;gap:12px}
.side{flex:none;width:236px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.side h4{font-size:12.5px;color:var(--muted);padding:5px 8px 1px;font-weight:700;letter-spacing:.02em}
.li{display:flex;align-items:center;gap:6px;width:100%;min-height:27px;padding:2px 8px;border:1px solid transparent;border-radius:7px;background:none;text-align:left}
.li:hover{background:var(--line2)}
@media (max-height:840px){.side{gap:0;padding:6px}.side .li{min-height:24px;padding:0 8px}.side h4{padding:2px 8px 0}}
.li.on{background:var(--accent-bg);border-color:#bcd5ec;font-weight:700}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:22px;text-align:right}
.li.sub{padding-left:22px;min-height:28px;font-size:14px}
.li.dim .t{color:var(--muted)}
.content{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.tools{flex:none;display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:nowrap}
.tools label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;white-space:nowrap}
.fld{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:0}
.tools .fld.search{width:200px}
.cnt{color:var(--muted);font-size:14px;white-space:nowrap}

/* 표 */
.twrap{flex:1;min-height:0;overflow:hidden}
table.tbl{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px}
.tbl th{height:38px;padding:0 8px;text-align:left;font-size:13px;color:var(--muted);font-weight:700;background:#f6f8fb;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl td{height:46px;padding:0 8px;border-bottom:1px solid var(--line2);vertical-align:middle;overflow:hidden}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td{background:#f4f8fc}
.tbl tr.hit td{background:#fff6cc}
.cell{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.cell.one{-webkit-line-clamp:1}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.acts{display:flex;gap:4px}
.pager{flex:none;display:flex;align-items:center;gap:8px;height:42px;padding-top:8px;color:var(--muted);font-size:14px}
.pager .mid{min-width:80px;text-align:center;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.pager .r{margin-left:auto}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}

/* 표시 칩 */
.chip{display:inline-block;padding:0 6px;border-radius:5px;font-size:12.5px;font-weight:700;line-height:20px;white-space:nowrap}
.chip.h{background:var(--high-bg);color:var(--high)}
.chip.m{background:var(--mid-bg);color:var(--mid)}
.chip.l{background:var(--low-bg);color:var(--low)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.g{background:var(--line2);color:var(--muted)}
mark{background:#ffd9d4;color:#8a1010;border-radius:2px;padding:0 1px}

/* 사업별 칸 표 */
.mx td{height:54px;text-align:center;padding:2px 4px}
.mx td.rl{text-align:left;font-weight:600;background:#fafbfd}
.mx th{text-align:center}
.mx th.rl{text-align:left}
.mc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:46px;width:100%;border:0;background:none;font-size:13px;line-height:1.2;border-radius:6px}
.mc:hover{background:var(--line2)}
.mc .d{display:block;font-variant-numeric:tabular-nums;white-space:nowrap}
.mc.ord{background:#ffe9b8;outline:2px solid #d89a1b;outline-offset:-2px}
.mc.miss{color:var(--high)}
.mc.na{color:var(--muted)}
.mc small{font-size:11px;color:var(--muted)}
.legend{flex:none;display:flex;flex-wrap:wrap;gap:4px 14px;padding-top:6px;color:var(--muted);font-size:12.5px}

/* 안쪽 화면 */
.back{flex:none;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cols{flex:1;min-height:0;display:flex;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;min-height:0}
.card h3{font-size:15px;margin-bottom:8px}
.card h3 small{font-weight:400;color:var(--muted);margin-left:6px}
.kv{display:grid;grid-template-columns:78px 1fr;gap:3px 10px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{min-width:0;overflow-wrap:anywhere}
.frow{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-top:1px solid var(--line2);font-size:13.5px}
.frow .l{flex:none;width:62px;color:var(--muted);font-weight:700}
.frow .f{flex:1;min-width:0;overflow-wrap:anywhere}
.prob{padding:7px 0;border-top:1px solid var(--line2);font-size:14px}
.prob:first-of-type{border-top:0}
.prob .fx{color:var(--muted);font-size:13px;margin-top:2px}
.flow{display:flex;flex-direction:column}
.flow button{display:flex;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:5px 6px;border-radius:6px;font-size:13.5px;width:100%}
.flow button:hover{background:var(--line2)}
.flow button.cur{background:var(--accent-bg);font-weight:700}
.flow .k{flex:none;width:66px;color:var(--muted)}
.flow .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diff{font-size:13.5px;margin-top:3px;display:grid;grid-template-columns:62px 1fr;gap:1px 8px}
.diff span:nth-child(odd){color:var(--muted)}

/* 연결 화면 */
.conn{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px}
.cards{display:flex;gap:16px;width:100%;max-width:980px}
.cc{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px}
.cc h2{font-size:18px}
.cc p{color:var(--muted);font-size:14px}
.cc .state{font-size:14px;padding:6px 10px;border-radius:7px;background:var(--line2)}
.cc .state.ok{background:var(--ok-bg);color:var(--ok)}
.cc .btn{height:42px;font-size:16px}
.cc .row2{display:flex;gap:8px;flex-wrap:wrap}
.cc .row2 .btn{height:34px;font-size:14px}
.note{max-width:980px;width:100%;color:var(--muted);font-size:13.5px;text-align:center}
.warn{width:100%;max-width:980px;background:var(--mid-bg);color:var(--mid);border-radius:8px;padding:10px 14px;font-size:14px}
.banner{width:100%;max-width:980px;display:flex;align-items:center;gap:10px;background:var(--accent-bg);border:1px solid #bcd5ec;border-radius:10px;padding:10px 14px}
.banner span{flex:1;font-size:14px}

/* 설정 */
.setmenu .li{font-weight:600}
.set{display:flex;flex-direction:column;gap:12px;font-size:14.5px}
.set .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.set .line > b{min-width:110px}
.set small{color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;min-height:30px}
.chk input{width:18px;height:18px}
.pill{display:inline-flex;gap:4px}
.seg{display:inline-flex;align-self:flex-start;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{height:32px;padding:0 12px;border:0;background:#fff;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-bg);color:var(--accent);font-weight:700}

/* 창 */
.dim{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.dlg{background:#fff;border-radius:12px;padding:18px 20px;width:min(520px,92vw);max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h3{font-size:17px;margin-bottom:8px}
.dlg p,.dlg li{font-size:14.5px;margin:4px 0;color:var(--ink)}
.dlg ol{padding-left:20px}
.dlg .acts{justify-content:flex-end;margin-top:14px}
.dlg .pick{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dlg .pick .btn{height:auto;min-height:38px;padding:6px 12px;text-align:left;white-space:normal}
.kbd{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--line2);font-size:13px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b2733;color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:.95}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== 분석 엔진: 화면과 상관없이 이름·대장 자료만 가지고 계산합니다 ===== */
(function (root) {
'use strict';

const pad4 = n => String(n).padStart(4, '0');

/* ---------- 제목 비교용 정리 ---------- */
function normTitle(s) {
  s = String(s == null ? '' : s);
  s = s.replace(/[\s ]+/g, '')
    .replace(/[‘’'"“”`´]/g, '')
    .replace(/[·ㆍ•,，]/g, '')
    .replace(/（/g, '(').replace(/）/g, ')')
    .replace(/(\d{4})년도/g, '$1년')
    .replace(/개최계획/g, '계획')
    .replace(/납부/g, '')
    .replace(/요청$/, '');
  return s;
}
function stripTailParen(s) { return String(s || '').replace(/\s*[(（][^()（）]*[)）]\s*$/, ''); }
function cmpNorm(s) { return normTitle(stripTailParen(s)); }
function bigrams(s) {
  const m = new Map();
  for (let i = 0; i < s.length - 1; i++) { const g = s.substr(i, 2); m.set(g, (m.get(g) || 0) + 1); }
  return m;
}
function dice(a, b) {
  if (a === b) return 1;
  if (a.length < 2 || b.length < 2) return 0;
  const A = bigrams(a), B = bigrams(b);
  let inter = 0, ta = 0, tb = 0;
  A.forEach(v => { ta += v; });
  B.forEach((v, k) => { tb += v; if (A.has(k)) inter += Math.min(v, A.get(k)); });
  return 2 * inter / (ta + tb);
}
function contains(a, b) {
  const s = a.length <= b.length ? a : b, l = a.length <= b.length ? b : a;
  return s.length >= 4 && l.indexOf(s) >= 0;
}
/* 같은 문서인지 가르는 열쇠: 가운데 괄호 안(이름·반 이름)과 N차·N분기 같은 번호가 맞아야 같은 문서 */
function idKey(raw) {
  let s = String(raw || '').replace(/\s+/g, '').replace(/（/g, '(').replace(/）/g, ')').replace(/[‘’'"“”]/g, '');
  const ord = s.match(/\d+(?:차|분기|회기|회)/g) || [];
  const body = s.replace(/\([^()]*\)$/, '');
  const parens = (body.match(/\([^()]*\)/g) || []).filter(x => !/^\(\d+(?:차|분기|회기|회)\)$/.test(x));
  return { p: parens, o: ord };
}
function setCompat(x, y) {
  if (!x.length || !y.length) return true;
  const sx = new Set(x), sy = new Set(y);
  const sub = (p, q) => [...p].every(v => q.has(v));
  return sub(sx, sy) || sub(sy, sx);
}
function idCompat(a, b) { return setCompat(a.o, b.o) && setCompat(a.p, b.p); }
/* 두 글 사이에서 다른 글자 위치 표시(공백 무시) */
function diffMarks(a, b) {
  const ia = [], ib = [];
  for (let i = 0; i < a.length; i++) if (!/\s/.test(a[i])) ia.push(i);
  for (let i = 0; i < b.length; i++) if (!/\s/.test(b[i])) ib.push(i);
  const n = ia.length, m = ib.length;
  if (n * m > 160000) return { a: [], b: [] };
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = a[ia[i]] === b[ib[j]] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ma = new Set(ia), mb = new Set(ib);
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[ia[i]] === b[ib[j]]) { ma.delete(ia[i]); mb.delete(ib[j]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { a: [...ma], b: [...mb] };
}

function segs(str, marks) {
  const set = new Set(marks); const out = []; let cur = '', gap = '';
  for (let i = 0; i < str.length; i++) {
    const c = str[i];
    if (set.has(i)) { cur += gap + c; gap = ''; }
    else if (/\s/.test(c)) { if (cur) gap += c; }
    else { if (cur) { out.push(cur); cur = ''; } gap = ''; }
  }
  if (cur) out.push(cur);
  return out.map(x => x.length > 14 ? x.slice(0, 14) + '…' : x);
}
/* ---------- 파일 이름 해석 ---------- */
const FILE_RE = /^(?:\[([^\]]*)\]\s*)?손잡다(\d{2})-(\d+)\s*(.*)$/;
function parseFile(f) {
  const m0 = /^(.*)\.([A-Za-z0-9]+)$/.exec(f.name);
  const ext = m0 ? m0[2].toLowerCase() : '';
  if (ext !== 'hwp' && ext !== 'hwpx' && ext !== 'pdf') return null;
  let base = m0[1], conflict = false, copy = false;
  if (/_HAND_.*Conflict\s*$/i.test(base) || /Conflict/i.test(base)) { conflict = true; base = base.replace(/_HAND_.*$/i, '').replace(/_?Conflict.*$/i, ''); }
  base = base.trim();
  if (/\s*\(\d\)\s*$/.test(base)) { copy = true; base = base.replace(/\s*\(\d\)\s*$/, ''); }
  const m = FILE_RE.exec(base);
  const out = { loc: f.loc, name: f.name, author: f.author || '', ext, isHwp: ext === 'hwp' || ext === 'hwpx', conflict, copy, tag: '', n: null };
  if (!m) { out.noPattern = true; return out; }
  out.tag = m[1] || '';
  out.yy = m[2];
  out.fmtWarn = m[3].length !== 4;
  out.n = parseInt(m[3], 10);
  let rest = m[4].trim();
  out.mmdd = null;
  const d = /^(\d{2})(\d{2})\s+(.*)$/.exec(rest);
  if (d) {
    const mo = +d[1], da = +d[2];
    if (mo >= 1 && mo <= 12 && da >= 1 && da <= 31) { out.mmdd = d[1] + d[2]; rest = d[3].trim(); }
  }
  out.title = rest;
  out.tnorm = normTitle(rest);
  return out;
}

/* ---------- 문서 종류 ---------- */
const KINDS = ['사업계획', '계획', '변경계획', '모집', '보도자료', '협조요청', '홍보비', '대관료', '진행비', '물품구입비', '다과비', '재료비', '식비', '숙박비', '사전회의', '중간회의', '연계', '통역비', '강사비', '교육비', '활동비', '보험·공제', '결과보고', '실적보고', '기타'];
const SPEND = ['홍보비', '대관료', '진행비', '물품구입비', '다과비', '재료비', '식비', '숙박비', '통역비', '강사비', '교육비', '활동비'];
const KIND_RULES = [
  ['변경계획', /변경계획|수정운영계획|계획변경|운영계획수정/],
  ['실적보고', /실적보고|상반기실적/],
  ['결과보고', /결과보고|결과$/],
  ['사업계획', t => /사업계획$/.test(t) && !/\d+차/.test(t)],
  ['계획', /계획$|하반기계획|운영계획/],
  ['모집', /모집/],
  ['보도자료', /보도자료/],
  ['협조요청', /협조/],
  ['홍보비', /홍보비/],
  ['대관료', /대관료|대관비/],
  ['진행비', /진행비/],
  ['물품구입비', /물품구입|필요물품/],
  ['다과비', /다과비/],
  ['재료비', /재료비/],
  ['식비', /식비/],
  ['숙박비', /숙박비/],
  ['통역비', /통역비/],
  ['강사비', /강사비|ILP수행비/i],
  ['교육비', /교육비/],
  ['활동비', /활동비/],
  ['보험·공제', /배상책임공제|공제|보험|가입/],

  const clusterOf = (files) => {
    const k = files.length, par = Array.from({ length: k }, (_, i) => i);
    const find = x => par[x] === x ? x : (par[x] = find(par[x]));
    for (let i = 0; i < k; i++) for (let j = i + 1; j < k; j++) {
      const a = files[i], b = files[j];
      if (a.kind !== b.kind) continue;
      if (a.exactN && b.exactN && ![...a.exactN].some(x => b.exactN.has(x))) continue;
      if (idCompat(a.idk, b.idk) && (a.tnorm === b.tnorm || dice(a.tnorm, b.tnorm) >= 0.55 || contains(a.tnorm, b.tnorm) || (a.mmdd && a.mmdd === b.mmdd && dice(a.tnorm, b.tnorm) >= 0.4))) par[find(i)] = find(j);
    }
    const g = new Map();
    files.forEach((f, i) => { const r = find(i); if (!g.has(r)) g.set(r, []); g.get(r).push(f); });
    return [...g.values()].map(fs => {
      const rep = fs.slice().sort((x, y) => (y.isHwp - x.isHwp) || (x.tnorm.length - y.tnorm.length))[0];
      const mm = new Set(fs.map(f => f.mmdd).filter(Boolean));
      return { files: fs, rep, title: rep.title, tnorm: rep.tnorm, mmdd: mm, locs: new Set(fs.map(f => f.loc)) };
    });
  };
  const simToLedger = (cl, row) => {
    const rn = normTitle(row.t);
    let best = 0;
    for (const f of cl.files) { const s = (f.tnorm === rn || contains(f.tnorm, rn)) ? 1 : dice(f.tnorm, rn); if (s > best) best = s; }
    return best;
  };

  // 번호별 파일
  const byNo = new Map();
  const zeroFiles = [];
  for (const p of parsed) {
    if (p.n === 0) { zeroFiles.push(p); continue; }
    if (!byNo.has(p.n)) byNo.set(p.n, []);
    byNo.get(p.n).push(p);
  }
  const nums = new Set([...byNo.keys(), ...L.filled.map(r => r.n)]);
  const sortedNums = [...nums].sort((a, b) => a - b);
  const primary = new Map();          // 번호 -> 대장 줄과 이어진 문서(또는 첫 문서)
  const numDocs = new Map();          // 번호 -> 문서들
  const leftovers = [];
  const dupInfo = new Map();
  for (const n of sortedNums) {
    const row = L.byNo.get(n) && L.byNo.get(n).filled ? L.byNo.get(n) : null;
    const files = byNo.get(n) || [];
    const cls = clusterOf(files);
    const list = [];
    numDocs.set(n, list);
    let linked = -1;
    if (row && cls.length) {
      let best = -1, bs = -1;
      cls.forEach((c, i) => { const s = simToLedger(c, row); if (s > bs) { bs = s; best = i; } });
      linked = bs >= 0.3 ? best : -1;
    }
    if (cls.length >= 2) dupInfo.set(n, cls.length);
    if (row) {
      // 대장 줄이 있으면 이어진 묶음(없으면 파일 없는 빈 문서)이 이 번호의 대표 문서
      const d = mkDoc(n, row, linked >= 0 ? cls[linked].files : []);
      list.push(d); primary.set(n, d);
    }
    cls.forEach((c, i) => { if (i !== linked) leftovers.push({ n, cl: c, row, single: cls.length === 1 }); });
  }
  const filledRows = L.filled;
  const hasLocAt = (doc, locs) => doc && doc.files.some(f => locs.has(f.loc));
  const takenBy = new Map();
  const findLedgerMatch = (cl, selfN, ignoreDate) => {
    const tn = normTitle(cl.title);
    const cands = [];
    for (const row of filledRows) {
      if (row.n === selfN) continue;
      const rn = normTitle(row.t);
      if (!rn) continue;
      const s = dice(tn, rn);
      const exact = tn === rn || s >= 0.9;
      const loose = !ignoreDate && row.mmdd && cl.mmdd.has(row.mmdd) && contains(tn, rn);
      if (!exact && !loose) continue;
      if (!idCompat(cl.rep.idk, idKey(row.t))) continue;
      const tdoc = primary.get(row.n);
      if (hasLocAt(tdoc, cl.locs) || takenBy.has(row.n)) continue;
      cands.push({ row, exact, loose });
    }
    let c = cands;
    if (c.length > 1) { c = c.filter(x => x.row.mmdd && cl.mmdd.has(x.row.mmdd)); }
    if (c.length > 1) {
      const ex = c.filter(x => x.exact); if (ex.length === 1) c = ex; else return null;
    }
    return c.length === 1 ? c[0].row : null;
  };
  for (const lf of leftovers) {
    const row = findLedgerMatch(lf.cl, lf.n, false);
    if (row) {
      takenBy.set(row.n, lf);
      const tdoc = primary.get(row.n);
      tdoc.files.push(...lf.cl.files);
      lf.cl.files.forEach(f => { f.fileNo = lf.n; });
      tdoc.wrongNo = tdoc.wrongNo || [];
      tdoc.wrongNo.push({ fileNo: lf.n, files: lf.cl.files });
      lf.resolved = true;
      continue;
    }
    const pd = primary.get(lf.n);
    if (lf.row && lf.single && pd && !pd.files.length) { pd.files.push(...lf.cl.files); continue; }   // 대장 줄과 다른 점이 크지만 이 번호의 유일한 문서
    const d = mkDoc(lf.n, null, lf.cl.files, { dupExtra: !!lf.row });
    numDocs.get(lf.n).push(d);
    if (!pd) primary.set(lf.n, d);
  }
  // 0000 파일
  const zeroCl = clusterOf(zeroFiles);
  for (const cl of zeroCl) {
    const row = findLedgerMatch(cl, -1, true);
    if (row) {
      takenBy.set(row.n, cl);
      const tdoc = primary.get(row.n);
      cl.files.forEach(f => { f.fileNo = 0; });
      tdoc.files.push(...cl.files);
      tdoc.draftNumber = (tdoc.draftNumber || []).concat(cl.files);
    } else {
      const d = mkDoc(0, null, cl.files);
      d.unnumbered = true;
    }
  }

  /* ----- 문서별 값 채우기 ----- */
  const mmddToIso = (mmdd) => mmdd ? (yyFull + '-' + mmdd.slice(0, 2) + '-' + mmdd.slice(2)) : null;
  for (const d of docs) {
    d.has = { draft: false, request: false, internal: false, scan: false };
    d.hwp = false;
    for (const f of d.files) { d.has[f.loc] = true; if (f.isHwp) d.hwp = true; }
    const fts = d.files.slice().sort((a, b) => (b.isHwp - a.isHwp) || ((STATUS_RANK[b.loc]) - (STATUS_RANK[a.loc])));
    d.title = d.ledger && d.ledger.t ? d.ledger.t : (fts[0] ? fts[0].title : '');
    d.date = d.ledger && d.ledger.date ? d.ledger.date : null;
    if (!d.date) { const f = d.files.find(x => x.mmdd); if (f) d.date = mmddToIso(f.mmdd); }
    d.mmdd = d.date ? d.date.slice(5, 7) + d.date.slice(8, 10) : null;
    d.status = d.has.scan ? 'scan' : d.has.internal ? 'internal' : d.has.request ? 'request' : d.has.draft ? 'draft' : 'ledger';
    const reqF = d.files.find(f => f.loc === 'request' && f.author);
    d.who = (d.ledger && d.ledger.who) || (reqF && reqF.author) || (d.has.draft && myName) || '미지정';
    d.numStr = d.unnumbered ? '미부여' : pad4(d.n);
    const cls = classify(d.title, d.ledger && d.ledger.g1, d.ledger && d.ledger.g2);
    d.unit = cls.unit; d.sub = cls.sub;
    d.kind = kindOf(d.title);
    d.sortNo = d.unnumbered ? 0 : d.n;
  }

  /* ----- 문제 만들기 ----- */
  const problems = [];
  const add = (doc, code, text, fix, extra) => {
    const p = Object.assign({ code, sev: PDEF[code].sev, doc, num: doc ? doc.n : 0, numStr: doc ? doc.numStr : '', title: doc ? doc.title : '', who: doc ? doc.who : '', text, fix, copy: '' }, extra || {});
    if (doc) {
      doc.problems.push(p);
      p.unit = doc.unit; p.sub = doc.sub;
      if (!p.copy) { const f = doc.files.find(x => x.loc === 'internal') || doc.files[0]; p.copy = f ? f.name : (fullNo(doc.n) + ' ' + doc.title); }
    }
    p.key = code + '|' + p.numStr + '|' + (p.title || p.keyExtra || '');
    problems.push(p);
    return p;
  };

  const locNames = (set) => [...set].map(l => LOC_NAME[l]).join('·');
  for (const d of docs) {
    const ledgerOn = !!d.ledger;
    const hasFiles = d.files.length > 0;
    if (d.unnumbered) {
      add(d, 'no-number', '번호가 아직 없는 문서 (파일 이름 번호 0000)', '대장에 번호를 받은 뒤 파일 이름의 0000을 받은 번호로 바꿔 주세요');
    }
    if (d.draftNumber) {
      add(d, 'draft-number', '파일 이름 번호가 비어 있음 (대장은 ' + pad4(d.n) + ')', '파일 이름의 0000을 ' + pad4(d.n) + '로 바꿔 주세요', { copy: d.draftNumber[0].name });
    }
    if (d.wrongNo) {
      for (const w of d.wrongNo) {
        const locs = new Set(w.files.map(f => f.loc));
        add(d, 'wrong-no', '파일은 ' + pad4(w.fileNo) + ', 대장은 ' + pad4(d.n) + ' (' + locNames(locs) + ' 파일)', locNames(locs) + ' 파일 이름의 번호를 ' + pad4(d.n) + '로 바꿔 주세요', { copy: w.files[0].name, fileNo: w.fileNo });
      }
    }
    if (d.dupExtra) {
      // 번호 중복 문서는 번호 단위 문제로 따로 만듦
    }
    if (hasFiles && !ledgerOn && !d.unnumbered && !d.dupExtra) {
      add(d, 'not-in-ledger', '파일은 있는데 대장의 ' + pad4(d.n) + ' 줄이 비어 있음', '문서대장 ' + pad4(d.n) + ' 줄에 날짜·제목·담당자를 적어 주세요');
    }
    if (ledgerOn && !hasFiles) {
      add(d, 'ledger-only', '대장에는 적혀 있는데 파일이 어디에도 없음', '파일을 내부기안·스캔 폴더에 넣거나, 번호가 다르면 대장을 맞춰 주세요');
    }
    if (hasFiles && !d.hwp) {
      add(d, 'no-draft', '한글 파일(hwp·hwpx)이 어디에도 없음 (' + locNames(new Set(d.files.map(f => f.loc))) + '만 있음)', '내부기안 폴더에 이 번호의 한글 파일을 넣어 주세요');
    }
    if (d.has.internal && !d.has.scan) {
      add(d, 'no-scan', '내부기안은 있는데 스캔 파일이 없음', '스캔 폴더에 이 번호의 스캔 PDF를 넣어 주세요', { copy: (d.files.find(f => f.loc === 'internal') || {}).name });
    }
    // 여러 위치
    if (d.has.draft && d.has.internal) add(d, 'multi-place', '미리 작성 폴더와 내부기안 폴더에 함께 있음', '결재가 끝났다면 미리 작성 폴더의 파일을 정리해 주세요');
    if (d.has.request && d.has.internal) add(d, 'multi-place', '결재요청 폴더와 내부기안 폴더에 함께 있음', '결재가 끝났다면 결재요청 폴더의 파일을 정리해 주세요');
    // 충돌 사본
    const cf = d.files.filter(f => f.conflict);
    if (cf.length) add(d, 'conflict', '동기화 충돌로 생긴 사본 파일이 있음 (' + cf.length + '개)', '내용을 비교해 필요 없는 사본을 지워 주세요', { copy: cf[0].name });
    // 번호 형식
    const ff = d.files.filter(f => f.fmtWarn);
    if (ff.length) add(d, 'no-format', '파일 이름의 번호가 네 자리가 아님 (' + ff[0].name.replace(/^\[[^\]]*\]\s*/, '').split(' ')[0] + ')', '번호를 ' + pad4(d.n) + '처럼 네 자리로 맞춰 주세요', { copy: ff[0].name });
    // 이름 다름
    if (ledgerOn && hasFiles || d.files.length > 1) {
      const variants = [];
      if (ledgerOn && d.ledger.t) variants.push({ label: '대장', t: d.ledger.t });
      for (const f of d.files) variants.push({ label: LOC_NAME[f.loc], t: f.title, file: f });
      const base = variants[0];
      const diffs = [];
      if (base) {
        const bn = cmpNorm(base.t);
        for (const v of variants.slice(1)) {
          if (cmpNorm(v.t) !== bn) {
            const mk = diffMarks(base.t, v.t);
            if (!diffs.some(x => x.b === v.t && x.aLabel === base.label)) diffs.push({ aLabel: base.label, bLabel: v.label, a: base.t, b: v.t, ma: mk.a, mb: mk.b });
          }
        }
      }
      const noDate = d.files.filter(f => !f.mmdd && f.n !== 0);
      if (diffs.length || noDate.length) {
        let text;
        if (diffs.length) {
          const x = diffs[0];
          const sa = segs(x.a, x.ma), sb = segs(x.b, x.mb);
          if (sa.length && sb.length) text = '제목이 다름: ' + x.aLabel + ' ‘' + sa[0] + '’ ↔ ' + x.bLabel + ' ‘' + sb[0] + '’';
          else if (sb.length) text = '제목이 다름: ' + x.bLabel + '에 ‘' + sb[0] + '’이(가) 더 있음 (' + x.aLabel + '과 비교)';
          else if (sa.length) text = '제목이 다름: ' + x.aLabel + '에 ‘' + sa[0] + '’이(가) 더 있음 (' + x.bLabel + '과 비교)';
          else text = x.aLabel + '과 ' + x.bLabel + '의 제목이 다름';
          if (diffs.length > 1) text += ' 외 ' + (diffs.length - 1) + '곳';
          if (noDate.length) text += ', 파일 이름에 날짜 없음';
        } else text = '파일 이름에 날짜가 없음';
        add(d, 'name-diff', text, diffs.length ? '대장이나 파일 이름 중 맞는 쪽으로 제목을 통일해 주세요' : '파일 이름 번호 뒤에 날짜(예: ' + (d.mmdd || '0105') + ')를 넣어 주세요', { diffs, copy: (noDate[0] || d.files[0] || {}).name });
      }
    }
    // 날짜 다름
    {
      const set = new Map();
      if (ledgerOn && d.ledger.mmdd) set.set('대장', d.ledger.mmdd);
      for (const f of d.files) {
        if (f.mmdd && !(d.draftNumber && d.draftNumber.indexOf(f) >= 0)) {
          const k = LOC_NAME[f.loc];
          if (!set.has(k)) set.set(k, f.mmdd);
          else if (set.get(k) !== f.mmdd) set.set(k + '(' + f.mmdd + ')', f.mmdd);
        }
      }
      const vals = new Set(set.values());
      if (vals.size > 1) {
        const txt = [...set.entries()].map(([k, v]) => k + ' ' + v).join(', ');
        add(d, 'date-diff', '날짜가 서로 다름: ' + txt, '대장이나 파일 이름의 날짜를 맞춰 주세요');
      }
    }
    // 대장 빈칸 / 날짜 이상 / 구분
    if (ledgerOn) {
      const miss = [];
      if (!d.ledger.t) miss.push('제목'); if (!d.ledger.who) miss.push('담당자'); if (!d.ledger.date && !d.ledger.dateRaw) miss.push('날짜');
      if (miss.length) add(d, 'ledger-blank', '대장 ' + pad4(d.n) + ' 줄의 ' + miss.join('·') + ' 칸이 비어 있음', '문서대장 ' + pad4(d.n) + ' 줄의 빈 칸을 채워 주세요');
      if (d.ledger.dateIssue) add(d, 'ledger-date', d.ledger.dateIssue + ' (' + (d.ledger.date || d.ledger.dateRaw) + ')', '문서대장 ' + pad4(d.n) + ' 줄의 날짜를 확인해 주세요');
    }
  }
  // 번호 중복(번호 단위)
  dupInfo.forEach((cnt, n) => {
    const doc = primary.get(n);
    const others = (numDocs.get(n) || []).filter(x => x !== doc);
    const resolved = leftovers.filter(l => l.n === n && l.resolved);
    let t = '한 번호에 서로 다른 문서가 ' + cnt + '건 있음';
    const names = [];
    resolved.forEach(l => names.push(l.cl.title)); others.forEach(o => names.push(o.title));
    add(doc, 'dup-no', t, '나중 문서의 번호를 빈 번호로 고치고 대장도 맞춰 주세요', { others: names, copy: (others[0] && others[0].files[0] && others[0].files[0].name) || (resolved[0] && resolved[0].cl.files[0].name) || undefined });
  });
  // 대장 중복
  for (const r of L.dups) { const doc = primary.get(r.n); if (doc) add(doc, 'dup-no', '대장에 같은 번호 줄이 둘 이상 있음', '문서대장에서 중복된 줄을 정리해 주세요', { keyExtra: 'ledger-dup' }); }
  // 대장 구분 표기 차이
  for (const col of ['g1', 'g2']) {
    const canon = new Map();
    for (const r of filledRows) {
      const v = r[col]; if (!v) continue;
      const c = v.replace(/\s+/g, '').replace(/사업$/, '');
      if (!canon.has(c)) canon.set(c, new Map());
      canon.get(c).set(v, (canon.get(c).get(v) || 0) + 1);
    }
    canon.forEach((vm) => {
      if (vm.size < 2) return;
      const top = [...vm.entries()].sort((a, b) => b[1] - a[1])[0][0];
      for (const r of filledRows) {
        if (r[col] && vm.has(r[col]) && r[col] !== top) {
          const doc = primary.get(r.n);
          if (doc) add(doc, 'group-mismatch', '대장 구분이 ‘' + r[col] + '’ 표기로 적혀 있음 (다른 줄은 ‘' + top + '’)', '문서대장 구분 칸을 같은 표기로 맞춰 주세요');
        }
      }
    });
  }

  /* ----- 사업·회차 표 ----- */
  const subs = new Map();
  const soonLimit = today.getTime() - soonDays * 86400000;
  for (const d of docs) {
    const ops = d.unit === OPS;
    d.subKey = d.unit + '/' + d.sub;
    if (!subs.has(d.subKey)) subs.set(d.subKey, { key: d.subKey, unit: d.unit, sub: d.sub, ops, docs: [], rows: new Map() });
    const s = subs.get(d.subKey); s.docs.push(d);
    if (ops) continue;
    let r = roundOf(d.sub, d.title, d.kind, d.date);
    if (r.type !== 'round') {   // 대장 제목에 회차·이름이 없으면 파일 이름의 제목에서 찾음
      for (const f of d.files) { const fr = roundOf(d.sub, f.title, d.kind, d.date); if (fr.type === 'round') { r = fr; break; } }
    }
    d.row = r.label; d.rowInfo = r;
    if (!s.rows.has(r.label)) s.rows.set(r.label, { label: r.label, type: r.type, sortN: r.sortN, req: r.req, single: r.single, docs: [], also: new Map() });
    const row = s.rows.get(r.label); row.docs.push(d);
    if (r.req) row.req = r.req;
    if (r.also) r.also.forEach(nm => { if (!s.rows.has(nm)) s.rows.set(nm, { label: nm, type: 'round', req: r.req, docs: [], also: new Map() }); s.rows.get(nm).also.set(d.id, d); });
  }
  const cellKey = (s, row, kind) => s.sub + '|' + row.label + '|' + kind;
  for (const s of subs.values()) {
    if (s.ops) continue;
    const rowsArr = [...s.rows.values()];
    rowsArr.sort((a, b) => {
      const w = x => x.type === 'annual' ? 0 : x.type === 'common' ? 3 : 1;
      if (w(a) !== w(b)) return w(a) - w(b);
      if (a.sortN != null && b.sortN != null) return a.sortN - b.sortN;
      const mn = x => Math.min(...x.docs.concat([...x.also.values()]).map(d => d.sortNo || 99999));
      return mn(a) - mn(b);
    });
    s.rowList = rowsArr;
    const annual = s.rows.get('연간');
    const colSet = new Set();
    for (const row of rowsArr) {
      row.req = row.req || (row.type === 'round' ? ['계획', '결과보고'] : []);
      row.cells = new Map();
      for (const d of row.docs) { const c = KIND_COL(d.kind); colSet.add(c); if (!row.cells.has(c)) row.cells.set(c, []); row.cells.get(c).push(d); }
      row.also.forEach(d => { const c = KIND_COL(d.kind); if (!row.cells.has(c)) row.cells.set(c, []); row.cells.get(c).push(Object.assign(Object.create(null), { ref: d, alsoOnly: true })); });
      for (const k of row.req) colSet.add(k);
      row.mark = {};
    }

      row('내부기안 스캔 폴더', conn.scan, false, () => pickOne('scan'), '이 폴더만 따로 고르기'),
      row('문서대장', conn.ledger, false, pickLedgerFile, '파일 따로 지정')) : null,
    h('div', { class: 'row2' }, h('button', { class: 'btn', onclick: pickLedgerFile }, '문서대장 파일만 따로 지정')));
  const c2 = h('div', { class: 'cc' }, h('h2', { text: '2. 내부기안 미리 작성 폴더 연결' }), h('p', { text: '선택 사항입니다. 연결하지 않아도 사용할 수 있습니다. 작성 중인 기안과 결재요청 파일을 함께 보려면 연결해 주세요' }),
    h('button', { class: 'btn', onclick: connectDraft }, '미리 작성 폴더 연결'),
    conn.draft ? h('div', { class: 'state ok' }, '✓ ' + conn.draft.name) : h('div', { class: 'state' }, '연결 안 됨 (건너뛰어도 됩니다)'));
  box.append(h('div', { class: 'cards' }, c1, c2));
  if (NEED_PERM && SNAP) box.append(h('button', { class: 'btn primary', onclick: reconnect }, '다시 연결'));
  box.append(h('div', { class: 'note' }, '이 앱은 파일 이름과 문서대장만 읽고, 어떤 파일도 열거나 고치거나 지우지 않습니다. 읽은 내용은 이 브라우저 안에서만 쓰이며 어디로도 보내지 않습니다'));
  if (!SET.installDismissed || isStandalone() || inFrame) { /* 배너가 보이는 동안은 아래 버튼 생략 */ } else if (!isStandalone()) box.append(h('div', { class: 'row2' }, h('button', { class: 'btn', onclick: installHelp }, '홈 화면에 설치하기')));
  return box;
}
